.gmwait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px}
</style>

      var at=-1;

      if(add.length) d0.items.splice.apply(d0.items,[at,0].concat(add));

/* ================= 時間鏈 ================= */
function rideKey(tid,i){ return tid+":"+i; }
function compute(day){
  var out={}, cursor=toMin(day.start);
  /* 第一站若被自己固定成更早的時間，就把當日起點往前挪，
     這樣「家 出發」這種插在最前面的站才調得動 */
  for(var q=0;q<day.items.length;q++){
    var f0=day.items[q];
    if(f0.k!=="spot") continue;
    var a0=S.anchor[f0.id];
    if(a0 && toMin(a0)<cursor) cursor=toMin(a0);
    break;
  }
  day.items.forEach(function(it,i){
    if(it.k==="flight"){
      var f=S.flights[it.dir];
      out[it.id]={dep:toMin(f.dep),arr:toMin(f.arr)}; cursor=toMin(f.arr);
    } else if(it.k==="transit"){
      var r=runTransit(it,cursor); out[it.id]=r; cursor=r.arr;
    } else {
      var a=S.anchor[it.id]||it.pin, nat=cursor, arr=a?toMin(a):cursor;
      /* 只有「前一格是交通」才算得上衝突；前面是登機證或另一站就不用警告 */
      var pv=day.items[i-1], chained=!!(pv&&pv.k==="transit");
      out[it.id]={arr:arr, nat:nat, anchored:!!S.anchor[it.id], chained:chained,
        early:!!S.anchor[it.id]&&arr<nat&&chained};
      /* 離開：使用者釘住的優先，否則抵達＋預計停留 */
      var lv=S.leave[it.id]||it.lvpin, lvm = lv ? toMin(lv) : (arr+(it.stay||0));
      var over = lvm < arr;                 /* 抵達晚於原本設定的離開 */
      if(over) lvm = arr;
      out[it.id].leave  = lvm;
      out[it.id].lvfix  = !!S.leave[it.id];
      out[it.id].over   = over;
      out[it.id].win    = lvm-arr;
      cursor = lvm;
    }
  });
  day.items.forEach(function(it,i){
    if(it.k!=="spot") return;
    var me=out[it.id], nx=day.items[i+1];
    me.need  = (nx&&nx.k==="transit") ? out[nx.id].leaveAt : null;   /* 趕上目前這班車最晚要走的時間 */
    me.tight = me.win<(it.min||0);
  });
  return out;
}
function runTransit(it,entry){
  var cursor=entry, pre=0, seen=false, legs=[], firstDep=null, leaveAt=entry;
  for(var i=0;i<it.legs.length;i++){
    var lg=it.legs[i];
    if(lg.k!=="ride"){ cursor+=lg.min||0; if(!seen) pre+=lg.min||0; legs.push({i:i,type:lg.k}); continue; }
    var ready=cursor, list=lg.tt?ttList(lg.tt):[], key=rideKey(it.id,i), picked=S.pick[key], dep, synth=false;
    /* 沒有公布時刻表、但屬於「隨到隨搭」的密集班次（班距 ≤15 分），
       就依班距推算一排可切換的班次，並標明是推算的 */
    /* 沒有可用時刻表、但知道班距時，就依班距推算一排可切換的班次。
       已知「有時刻表但尚未公布」（tt 存在但沒有資料）且班距很疏的，不推算，以免誤導。 */
    var ttEmpty = lg.tt && !list.length;
    if(!list.length && lg.freq && (!ttEmpty || lg.freq<=15)){
      synth=true;
      list=[];                                   /* 一定要新陣列，不能動到共用的時刻表 */
      var st=Math.max(0,Math.floor((ready-lg.freq*4)/lg.freq)*lg.freq);
      for(var z=0;z<16;z++) list.push(toHM(st+z*lg.freq).slice(0,5));
    } else { list=list.slice(); }
    if(picked){ dep=toMin(picked); }
    else if(lg.freq){ dep=ready+lg.freq; }
    else if(list.length){
      var auto=null;
      for(var j=0;j<list.length;j++){ if(toMin(list[j])>=ready){ auto=list[j]; break; } }
      dep=auto!=null?toMin(auto):toMin(list[list.length-1]);
    }
    else if(lg.dep){ dep=toMin(lg.dep); }
    else dep=ready;
    var arr=dep+(lg.min||0);
    legs.push({i:i,type:"ride",dep:dep,arr:arr,ready:ready,wait:dep-ready,list:list,key:key,late:dep<ready,synth:synth});
    if(!seen){ seen=true; firstDep=dep; leaveAt=dep-pre; }
    cursor=arr;
  }
  return {dep:seen?firstDep:entry, arr:cursor, entry:entry, pre:pre, legs:legs, leaveAt:seen?leaveAt:entry, total:cursor-entry};
}
function shiftTransit(day,tid){
  var idx=-1; for(var i=0;i<day.items.length;i++) if(day.items[i].id===tid) idx=i;
  var c=compute(day)[tid], target=null;
  for(var j=0;j<c.legs.length;j++){ var L=c.legs[j]; if(L.type==="ride"&&L.late){ target=L; break; } }
  if(!target) for(var j2=0;j2<c.legs.length;j2++){ var L2=c.legs[j2]; if(L2.type==="ride"&&L2.list.length){ target=L2; break; } }
  if(target){
    if(target.list.length){
      var need=target.late?target.ready:target.dep+1, nx=null;
      for(var q=0;q<target.list.length;q++){ if(toMin(target.list[q])>=need){ nx=target.list[q]; break; } }
      if(nx) S.pick[target.key]=nx; else delete S.pick[target.key];
    } else delete S.pick[target.key];
  }
  clearAfter(day,idx); save(); render();
}
function extendSpot(day,sid){
  var idx=-1; for(var i=0;i<day.items.length;i++) if(day.items[i].id===sid) idx=i;
  if(idx<0) return;

  delete S.leave[sp.id];
  clearAfter(day,idx); save(); render(); flag("停留已拉長，後面順延");
}
function resetTransit(day){
  var def=null, D=DEFAULT();
  D.days.forEach(function(d){ if(d.id===day.id) def=d; });
  if(!def) return;
  var res=day.items.slice(), have={};
  res.forEach(function(x){ if(x.k==="transit") have[x.id]=1; });
  def.items.forEach(function(x,i){
    if(x.k!=="transit") return;
    var copy=JSON.parse(JSON.stringify(x));
    if(have[x.id]){
      for(var q=0;q<res.length;q++) if(res[q].id===x.id) res[q]=copy;
      return;
    }
    var nxt=null;
    for(var j=i+1;j<def.items.length;j++){ if(def.items[j].k!=="transit"){ nxt=def.items[j]; break; } }
    var at=res.length;
    if(nxt){ for(var k=0;k<res.length;k++){ if(res[k].id===nxt.id){ at=k; break; } } }
    res.splice(at,0,copy);
  });
  res.forEach(function(x){ if(x.k==="transit") x.legs.forEach(function(lg,i){ delete S.pick[rideKey(x.id,i)]; }); });
  day.items=res; save(); render();
}
var PFLAT=(function(){
  var a=[]; PALIAS.forEach(function(r){ r[1].forEach(function(x){ a.push([x,r[0]]); }); });
  a.sort(function(x,y){ return y[0].length-x[0].length; });
  return a;
})();
function canonPlace(s){
  s=String(s||"").trim(); if(!s) return null;
  for(var i=0;i<PFLAT.length;i++){ if(s.indexOf(PFLAT[i][0])>=0) return PFLAT[i][1]; }
  return null;
}
var ROUTES=(function(){
  var m={};
  DEFAULT().days.forEach(function(d){ d.items.forEach(function(x){
    if(x.k!=="transit") return;
    var a=canonPlace(x.from), b=canonPlace(x.to);
    if(!a||!b||a===b) return;
    if(!m[a+">"+b]) m[a+">"+b]=x;
  }); });
  return m;
})();
function reverseTransit(t){
  var c=JSON.parse(JSON.stringify(t));
  c.legs=(c.legs||[]).slice().reverse().map(function(lg){
    if(lg.k==="ride"){ var a=lg.a; lg.a=lg.b; lg.b=a; if(lg.tt) lg.tt=TTREV[lg.tt]||lg.tt; delete lg.dep; }
    else if(typeof lg.text==="string" && lg.text.indexOf("→")>=0){
      var pp=lg.text.split("→"); lg.text=pp[1].trim()+" → "+pp[0].trim();
    }
    return lg;
  });
  var f=c.from; c.from=c.to; c.to=f;
  return c;
}
function directRoute(a,b){
  if(ROUTES[a+">"+b]) return JSON.parse(JSON.stringify(ROUTES[a+">"+b]));
  if(ROUTES[b+">"+a]) return reverseTransit(ROUTES[b+">"+a]);
  return null;
}
function findRoute(from,to){
  var a=canonPlace(from), b=canonPlace(to);
  if(!a||!b||a===b) return null;
  var d=directRoute(a,b); if(d) return d;
  /* 沒有直達就找一個中繼點湊兩段（例如 飯店 → 岡山駅 → 後樂園） */
  for(var i=0;i<PALIAS.length;i++){
    var h=PALIAS[i][0];
    if(h===a||h===b) continue;
    var r1=directRoute(a,h), r2=directRoute(h,b);
    if(r1&&r2) return {from:from,to:to,fare:(+r1.fare||0)+(+r2.fare||0),
      note:[r1.note,r2.note].filter(Boolean).join("\n"),
      legs:r1.legs.concat(r2.legs)};
  }
  return null;
}
/* 把查到的路線套進這段交通；套不到回傳 false */
function applyRoute(tr){
  var r=findRoute(tr.from,tr.to);
  if(!r) return false;
  tr.legs=JSON.parse(JSON.stringify(r.legs));
  tr.fare=r.fare||0;
  tr.note=r.note||"";
  if(r.alts){ tr.alts=JSON.parse(JSON.stringify(r.alts)); tr.altI=r.altI||0; }
  else { delete tr.alts; delete tr.altI; }
  if(r.cur) tr.cur=r.cur; else delete tr.cur;
  (tr.legs||[]).forEach(function(lg,i){ delete S.pick[rideKey(tr.id,i)]; });
  delete tr.chk;
  return true;
}

/* 每一段交通的預設值（用 id 對照），給單獨還原用 */

function switchAlt(day,tid,i){

function restoreOneTransit(day,tid){

function newSpot(){ return {id:uid(),k:"spot",ic:"camera",t:"新的一站",place:"",stay:60,min:30,notes:[""],events:[]}; }
function newTransit(a,b){ return {id:uid(),k:"transit",from:a||"上一站",to:b||"下一站",fare:0,note:"",

function prevSpotName(day,at){

  return "上一站";

function addStop(day,afterId){
  var at;
  if(afterId){ at=0; day.items.forEach(function(x,i){ if(x.id===afterId) at=i+1; }); }
  else { at=day.items.length; while(at>0 && day.items[at-1].k==="flight") at--; }

function spotName(it){ return (it&&(it.place||it.t))||"上一站"; }
/* 每次新增／刪除／重排之後，把每段交通的起訖點接回真正的上下兩站；
   端點有變的那段標成「需確認」，班次資料先留著讓使用者自己判斷 */
function syncTransits(day){
  var prev=null;
  day.items.forEach(function(it,i){
    if(it.k==="spot"){ prev=it; return; }
    if(it.k!=="transit") return;
    var nxt=null;
    for(var j=i+1;j<day.items.length;j++){ if(day.items[j].k==="spot"){ nxt=day.items[j]; break; } }
    if(!prev || !nxt){ it.orphan=1; return; }
    delete it.orphan;
    var a=spotName(prev), b=spotName(nxt), changed=false;
    if(it.from!==a){ (it.legs||[]).forEach(function(lg){
        if(lg.k!=="ride"&&typeof lg.text==="string") lg.text=lg.text.split(it.from).join(a); });
      it.from=a; changed=true; }
    if(it.to!==b){ (it.legs||[]).forEach(function(lg){
        if(lg.k!=="ride"&&typeof lg.text==="string") lg.text=lg.text.split(it.to).join(b); });
      it.to=b; changed=true; }
    if(changed){
      (it.legs||[]).forEach(function(lg,k){ delete S.pick[rideKey(it.id,k)]; });
      if(!applyRoute(it)) it.chk=1;    /* 查得到就自動填好，查不到才標「需確認」 */
    }
  });
  /* 第一站前面若還掛著一段交通（重排後常見），直接拿掉 */
  for(var q=day.items.length-1;q>=0;q--) if(day.items[q].orphan){ day.items.splice(q,1); }
}
function delSpot(day,id){
  var i=-1; day.items.forEach(function(x,k){ if(x.id===id) i=k; });
  if(i<0) return;
  var start=i, del=1;
  if(i>0 && day.items[i-1].k==="transit"){ start=i-1; del=2; }
  day.items.splice(start,del);
  delete S.visited[id]; delete S.anchor[id]; delete S.leave[id];
  syncTransits(day);
  save(); render(); flag("已刪除，交通已接起");
}
function clearAfter(day,idx){
  for(var j=idx+1;j<day.items.length;j++){
    var t=day.items[j]; if(t.k!=="transit") continue;
    t.legs.forEach(function(lg,i){ delete S.pick[rideKey(t.id,i)]; });
  }
}

function autoTr(){

var FBes=null, FBtimer=null, FBstate="off", FBlastTs=0;
var FBme=Math.random().toString(36).slice(2,8);
var FBwant=false;      /* 使用者是否要開著同步（跟連線狀態分開） */
var FBseen=0;          /* 最後一次真的收到雲端資料的時間 */
var FBretry=0;         /* 重連次數，用來拉長間隔 */
var FBpoll=null;       /* 備援輪詢：Safari 切到背景會把 SSE 斷掉且不自己接回來 */
var FBpending=null;    /* 對方的更新先收著，等使用者不在編輯狀態再套用 */
var FBdirty=false;     /* 本機有還沒推上去的修改 */

function fbLoad(){ try{ var r=localStorage.getItem(FBKEY); if(r) FB=JSON.parse(r)||FB; }catch(e){} }
function fbSaveCfg(){ try{ localStorage.setItem(FBKEY,JSON.stringify(FB)); }catch(e){} }
function fbOn(){ return !!(FB.url&&FB.room); }
function fbPath(){ return String(FB.url).replace(/\/+$/,"")+"/trips/"+encodeURIComponent(FB.room)+".json"; }
function fbRoom(){ var a="abcdefghijkmnpqrstuvwxyz23456789",o="";
  for(var i=0;i<22;i++) o+=a.charAt(Math.floor(Math.random()*a.length)); return o; }

/* 使用者正在打字、開著編輯模式或彈窗時，不要把畫面整個重畫掉 */
function fbBusy(){
  var a=document.activeElement;
  if(a && (a.isContentEditable || a.tagName==="INPUT" || a.tagName==="TEXTAREA")) return true;
  if(document.body.classList.contains("editmode")) return true;
  var d=$("#dlg"); if(d && d.hasAttribute("open")) return true;
  var sh=$("#sheet"); if(sh && sh.hasAttribute("open")) return true;
  return false;
}

function fbCut(){ if(FBes){ try{ FBes.close(); }catch(e){} FBes=null; } }
function fbStop(){
  FBwant=false; fbCut();
  if(FBpoll){ clearInterval(FBpoll); FBpoll=null; }
  FBpending=null; FBstate="off";
}

function fbStart(){
  if(!fbOn()) return;
  FBwant=true; fbCut();
  FBstate = (FBstate==="on") ? "on" : "connecting";
  renderMast();
  fbPull();                                   /* 先抓一次現況，SSE 掛掉也還有東西 */
  if(typeof EventSource!=="undefined"){
    try{
      FBes=new EventSource(fbPath());
      FBes.onopen=function(){ FBstate="on"; FBretry=0; FBseen=now(); renderMast(); fbFlushDirty(); };
      FBes.onerror=function(){ fbDrop(); };
      FBes.addEventListener("put",function(ev){ FBstate="on"; FBretry=0; fbIncoming(ev.data); renderMast(); });
      FBes.addEventListener("patch",function(ev){ FBstate="on"; FBretry=0; fbIncoming(ev.data); renderMast(); });
      FBes.addEventListener("keep-alive",function(){ FBseen=now(); });
    }catch(e){ fbDrop(); }
  }
  fbWatch();
}

/* 斷線了：標記狀態，隔一段時間自己接回來（間隔越接越長，最多 20 秒） */
function fbDrop(){
  fbCut();
  if(!FBwant) return;
  if(FBstate!=="err"){ FBstate="err"; renderMast(); }
  FBretry=Math.min(FBretry+1,8);
  setTimeout(function(){ if(FBwant && !FBes) fbStart(); }, Math.min(1500*FBretry,20000));
}

/* 備援：每 12 秒看一次，超過 35 秒沒收到東西就直接用一般連線抓一次 */
function fbWatch(){
  if(FBpoll) return;
  var n=0;
  FBpoll=setInterval(function(){
    if(!FBwant) return;
    /* 每 1.5 秒：使用者一離開編輯狀態就把對方的更新補上 */
    if(FBpending && !fbBusy()) fbApplyPending();
    if(++n < 8) return;                      /* 每 12 秒才檢查一次連線 */
    n=0;
    if(document.hidden) return;
    if(FBseen && (now()-FBseen)<35000) return;
    fbPull();
    if(!FBes || FBes.readyState===2) fbStart();
  },1500);
}

function fbPull(){
  if(!fbOn()) return;
  fetch(fbPath()+"?_="+now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      FBseen=now(); FBretry=0;
      if(FBstate!=="on"){ FBstate="on"; renderMast(); }
      fbIncoming(JSON.stringify({path:"/",data:d}));
    })
    .catch(function(){});
}

function fbIncoming(raw){
  var m=null; try{ m=JSON.parse(raw); }catch(e){ return; }
  if(!m || (m.path && m.path!=="/")) return;
  var d=m.data;
  FBseen=now();
  if(!d || !d.days || !d.days.length) return;
  if(d.by===FBme) return;                       /* 自己剛送出去的，不用再套用 */
  if((+d.ts||0) <= (+FBlastTs||0)) return;
  FBlastTs=+d.ts||0;
  if(fbBusy()){                                 /* 正在打字/編輯：先收著，不要把畫面抽掉 */
    FBpending=d;
    flag("對方有更新，離開編輯後套用");
    return;
  }
  fbApply(d);
}

function fbApplyPending(){ var d=FBpending; FBpending=null; if(d) fbApply(d); }

function fbApply(d){
  var keep=S.photos;
  S=migrate(d);
  if(!S.photos || !Object.keys(S.photos).length) S.photos=keep||{};
  S.days.forEach(function(day){ day.items.forEach(function(x){
    if(x.k==="transit" && !x.alts && DEFTR[x.id] && DEFTR[x.id].alts)
      x.alts=JSON.parse(JSON.stringify(DEFTR[x.id].alts)); }); });
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  render(); flag("已同步對方的更新");
}

function fbPush(){
  if(!fbOn() || !FBwant) return;
  FBdirty=true;
  clearTimeout(FBtimer);
  FBtimer=setTimeout(fbSend,1200);
}
function fbFlushDirty(){ if(FBdirty) fbSend(); }
function fbSend(){
  if(!fbOn() || !FBwant) return;
  var d=JSON.parse(JSON.stringify(S));
  d.ts=now(); d.by=FBme;
  var body=JSON.stringify(d);
  if(body.length>3000000){ d.photos={}; body=JSON.stringify(d); }
  FBlastTs=d.ts;
  fetch(fbPath(),{method:"PUT",body:body,headers:{"Content-Type":"application/json"}})
    .then(function(r){ if(!r.ok) throw new Error(r.status);
      FBdirty=false; FBseen=now();
      if(FBstate!=="on"){ FBstate="on"; renderMast(); } })
    .catch(function(){
      FBdirty=true;                              /* 留著，連回來再送一次 */
      if(FBstate!=="err"){ FBstate="err"; renderMast(); flag("目前連不上，改動先存在手機裡"); }
    });
}

/* Safari 切到背景會把連線收掉而且不會自己接回來，回到前景時要重接 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden || !FBwant) return;
  fbPull();
  if(!FBes || FBes.readyState===2) fbStart();
  else fbFlushDirty();
});
window.addEventListener("online",function(){ if(FBwant) fbStart(); });
window.addEventListener("pageshow",function(e){ if(FBwant && e.persisted) fbStart(); });

function baseUrl(){ return location.origin+location.pathname; }
function fbPayload(){
  return btoa(unescape(encodeURIComponent(JSON.stringify({u:FB.url,r:FB.room}))))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function fbInvite(){ return baseUrl()+"?fb="+fbPayload(); }

/* 把房間寫進網址列。iPhone 的「加入主畫面」是另一個獨立的儲存空間，
   房間代號不會跟過去；寫進網址之後，主畫面圖示啟動時才認得出自己是哪一間。 */
function fbStamp(){
  if(!fbOn()) return;
  try{ history.replaceState(null,"",baseUrl()+"?fb="+fbPayload()); }catch(e){}
}
function fbClearUrl(){ try{ history.replaceState(null,"",baseUrl()); }catch(e){} }

function fbReadUrl(){
  var m=/^#fb=(.+)$/.exec(location.hash||"") || /[?&]fb=([^&]+)/.exec(location.search||"");
  return m?m[1]:"";
}
function fbIncomingLink(){
  var code=fbReadUrl();
  if(!code) return false;
  var b=code.replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  var cfg=null;
  try{ cfg=JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){}
  if(!cfg||!cfg.u||!cfg.r){ fbClearUrl(); tell("這個同步邀請讀不出來","請對方重新複製一次。"); return true; }
  if(fbOn() && FB.url===cfg.u && FB.room===cfg.r){ fbStamp(); return false; }  /* 本來就在同一間，不用再問 */
  ask("加入共同編輯？","加入之後，你和對方任何一邊的修改都會即時同步。你目前這台裝置上的內容會被雲端那份取代。",
    function(){ FB={url:cfg.u,room:cfg.r}; fbSaveCfg(); fbStamp(); fbStart(); flag("已加入，正在同步…"); renderMast(); },"加入");
  return true;
}

/* ---------- 分享連結：把行程壓進網址（哪裡都能用，不需要權限） ---------- */
function u8ToB64(u8){
  var s="",CH=0x8000;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64ToU8(b){
  b=String(b).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  var raw=atob(b), u=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) u[i]=raw.charCodeAt(i);
  return u;
}
function packState(){
  var d=JSON.parse(JSON.stringify(S));
  d.photos={};                                   /* 活動圖太大，不放進連結 */
  /* 交通方案是程式內建的資料，不用塞進連結，對方那邊會自己接回來 */
  (d.days||[]).forEach(function(day){ (day.items||[]).forEach(function(x){ delete x.alts; }); });
  var txt=JSON.stringify(d), bytes=new TextEncoder().encode(txt);
  if(typeof CompressionStream==="undefined") return Promise.resolve("r"+u8ToB64(bytes));
  var cs=new CompressionStream("gzip");
  return new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer()
    .then(function(ab){ return "z"+u8ToB64(new Uint8Array(ab)); })
    .catch(function(){ return "r"+u8ToB64(bytes); });
}
function unpackState(code){
  var tag=code.charAt(0), body=code.slice(1), u=b64ToU8(body);
  if(tag!=="z") return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
  var ds=new DecompressionStream("gzip");
  return new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer()
    .then(function(ab){ return JSON.parse(new TextDecoder().decode(new Uint8Array(ab))); });
}
function shareLink(){
  return packState().then(function(code){
    return baseUrl()+"#s="+code;
  });
}
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).then(function(){return true;}).catch(function(){return false;});
  try{
    var ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=document.execCommand("copy"); document.body.removeChild(ta);
    return Promise.resolve(ok);
  }catch(e){ return Promise.resolve(false); }
}
/* 開啟時如果網址帶著分享碼，問要不要載入 */
function shareIncoming(){
  var h=location.hash||"";
  if(h.indexOf("#s=")!==0) return false;
  var code=h.slice(3);
  history.replaceState(null,"",location.pathname+location.search);
  unpackState(code).then(function(d){
    if(!d||!d.days||!d.days.length){ tell("這個連結讀不出來","可能複製時被截斷了，請對方重傳一次。"); return; }
    ask("載入朋友分享的行程？","「"+(d.meta&&d.meta.title||"行程")+"」。載入後會覆蓋你目前這台裝置上的內容（活動圖不含在連結裡，會保留你自己的）。",
      function(){
        var keep=S.photos;
        S=migrate(d); S.photos=keep||{};
        /* 把內建的交通方案接回來 */
        S.days.forEach(function(day){ day.items.forEach(function(x){
          if(x.k==="transit" && !x.alts && DEFTR[x.id] && DEFTR[x.id].alts)
            x.alts=JSON.parse(JSON.stringify(DEFTR[x.id].alts)); }); });
        save(); di=0; render(0); flag("已載入分享的行程");
      },"載入");
  }).catch(function(){ tell("這個連結讀不出來","可能複製時被截斷了，請對方重傳一次。"); });
  return true;
}

function fbAgo(){
  if(!FBseen) return "";
  var s=Math.round((now()-FBseen)/1000);
  if(s<10) return "剛剛";
  if(s<60) return s+" 秒前";
  if(s<3600) return Math.round(s/60)+" 分鐘前";
  return Math.round(s/3600)+" 小時前";
}
function fbLabel(){
  if(!fbOn()) return "尚未設定";
  if(FBstate==="on") return "● 連線中　最後更新 "+fbAgo();
  if(FBstate==="connecting") return "連線中…";
  if(FBstate==="err") return "✕ 目前連不上，改動先存在這台裝置，連回來會自動補送"+
    (FBseen?("（最後更新 "+fbAgo()+"）"):"（可能是網址錯了，或這個網址不支援對外連線）");
  return "已停止";
}
/* 連線診斷：一次把該看的都列出來，看不懂也可以整段複製給我 */
function fbDiag(){
  var L=[];
  L.push("網址　"+(FB.url||"(未設定)"));
  L.push("房間　"+(FB.room||"(未設定)"));
  L.push("開啟方式　"+(window.navigator.standalone?"主畫面 App":(location.protocol==="file:"?"本機檔案":"瀏覽器分頁")));
  L.push("網路　"+(navigator.onLine?"有":"沒有"));
  L.push("目前狀態　"+FBstate+(FBseen?("（最後更新 "+fbAgo()+"）"):""));
  L.push("EventSource　"+(typeof EventSource==="undefined"?"這個瀏覽器不支援":
    (!FBes?"沒有連線":(FBes.readyState===0?"連線中":(FBes.readyState===1?"已連上":"已關閉")))));
  var show=function(extra){
    openSheet("連線檢查",'<textarea class="inp bk" id="dgT" readonly rows="10">'+esc(L.concat(extra||[]).join("\n"))+'</textarea>'+
      '<button class="bigbtn ghost" id="dgCp">複製這段</button>'+
      '<button class="bigbtn ghost" data-close>關閉</button>');
    if($("#dgCp")) $("#dgCp").onclick=function(){
      copyText(L.concat(extra||[]).join("\n")).then(function(ok){ flag(ok?"已複製":"請長按全選複製"); }); };
  };
  if(!fbOn()){ show(["讀寫測試　跳過（還沒設定）"]); return; }
  show(["讀寫測試　進行中…"]);
  var t0=now();
  fetch(fbPath()+"?_="+t0,{cache:"no-store"})
    .then(function(r){
      var ms=now()-t0;
      return r.text().then(function(txt){
        var ok=r.ok, note="讀取測試　"+(ok?"成功":"失敗")+"（HTTP "+r.status+"，"+ms+" 毫秒）";
        var has=(txt&&txt!=="null")?"雲端有資料（"+txt.length+" 字元）":"雲端這個房間是空的";
        var tips=[];
        if(r.status===401||r.status===403) tips.push("→ 資料庫規則沒開。到 Firebase 的「規則」分頁貼上手冊裡那段，按發布");
        if(r.status===404) tips.push("→ 網址對不上。確認結尾是 firebasedatabase.app，而且是同一個專案");
        show([note,has].concat(tips));
      });
    })
    .catch(function(e){
      show(["讀取測試　連不上（"+(e&&e.message||e)+"）",
            "→ 多半是沒網路、網址打錯，或這個網址不允許對外連線（例如 claude.ai 的 Artifact）"]);
    });
}

        FB={url:u,room:fbRoom()}; fbSaveCfg(); fbStamp(); fbStart();

  if($("#fbCpRm")) $("#fbCpRm").onclick=function(){
    copyText(FB.room).then(function(ok){ flag(ok?"房間代號已複製":"請長按上面那格全選複製"); }); };
  if($("#fbDiag")) $("#fbDiag").onclick=fbDiag;
  if($("#fbJoin")) $("#fbJoin").onclick=function(){
    askInput("資料庫網址","先貼資料庫網址（跟另一台一樣的那個）",FB.url||"",function(v){
      var u=String(v||"").trim().replace(/\/+$/,"");
      if(!/^https:\/\/.+/.test(u)){ tell("網址看起來不對","要以 https:// 開頭，結尾是 firebasedatabase.app 或 firebaseio.com。"); return true; }
      setTimeout(function(){
        askInput("房間代號","到另一台裝置的「分享」裡複製「房間代號」，貼在這裡","",function(w){

          FB={url:u,room:r}; fbSaveCfg(); fbStamp(); fbStart();

/* ================= viewport（避免 iOS 編輯時自動放大） ================= */
var VP_LOOSE="width=device-width, initial-scale=1, viewport-fit=cover";
var VP_LOCK ="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
function vpSet(c){
  var vp=document.querySelector('meta[name="viewport"]');
  if(!vp){ vp=document.createElement("meta"); vp.name="viewport"; document.head.appendChild(vp); }
  if(vp.getAttribute("content")===c) return;
  vp.setAttribute("content",c);
  /* Safari 只有在 meta 節點本身變動時才重讀 viewport，所以整顆換掉 */
  var n=vp.cloneNode(true); vp.parentNode.replaceChild(n,vp);
}
function vpLock(){ vpSet(VP_LOCK); }
function vpUnlock(){ vpSet(VP_LOOSE); }

/* ================= render ================= */
var view=$("#view");
var EDIT=false;                    /* 全域編輯模式（不寫進存檔） */
var NOSCROLL=false;
var EDITPAGES={info:1,itin:1,memo:1};
/* 進出編輯模式時整顆換掉 viewport：必須在任何欄位取得焦點之前就設定好，
   iOS 才不會在編輯時自動放大 */
function setEdit(on){
  /* 進出編輯模式時每張卡都會長高／變矮，先記住畫面上第一張卡的位置，
     重畫完再把它放回原位，眼睛看到的東西才不會整個往下跑 */
  var anchor=null, off=0, top=70;
  /* 上方黏住的日期列／今日進度底下才算看得到 */
  ["#daystrip",".prog.stuck"].forEach(function(q){ var h=$(q); if(h&&!h.hidden){ var b=h.getBoundingClientRect().bottom; if(b>top) top=b; } });
  /* 以「頂端完整露出來的第一個項目」當基準，進出編輯後讓它停在原來的位置 */
  $$(".row[data-rid],.sec[data-id],.memo[data-id]",view).some(function(n){
    var r=n.getBoundingClientRect();
    if(r.top>=top-2 && r.top<window.innerHeight){ anchor=n.dataset.rid||n.dataset.id; off=r.top; return true; }
    return false;
  });
  EDIT=!!on;
  if(EDIT) vpLock(); else vpUnlock();
  NOSCROLL=true; render(); NOSCROLL=false;
  function find(){ return $('.row[data-rid="'+anchor+'"]',view)||$('[data-id="'+anchor+'"]',view); }
  if(anchor){
    var t=find();
    if(t){
      var d=t.getBoundingClientRect().top-off;
      window.scrollTo(0,Math.max(0,window.scrollY+d));
      requestAnimationFrame(function(){
        var t2=find();
        if(t2) window.scrollTo(0,Math.max(0,window.scrollY+(t2.getBoundingClientRect().top-off)));
      });
    }
  }
}

function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1500, w=img.width, h=img.height, r=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(w*r)); cv.height=Math.max(1,Math.round(h*r));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      try{ cb(cv.toDataURL("image/jpeg",0.72)); }catch(e){ tell("讀不到這張圖","這張圖處理不了，換一張試試。"); }
    };
    img.onerror=function(){ tell("讀不到這張圖","換一張試試。"); };
    img.src=fr.result;
  };
  fr.onerror=function(){ tell("讀不到這個檔案","換一個試試。"); };
  fr.readAsDataURL(file);
}

/* 條列的四種樣子，用開頭那個字元記在字串裡：
   （無）＝・　!＝⚠　?＝☐未打勾　+＝☐已打勾　:＝小標（舊資料）　@＝超連結列 */
function noteKind(n){
  var c=String(n||"").charAt(0);
  if(c==="!") return "warn";
  if(c==="?") return "chk";
  if(c==="+") return "chkon";
  if(c===":") return "none";
  if(c==="@") return "link";
  return "dot";
}
function noteBody(n){
  n=String(n||"");
  return noteKind(n)==="dot" ? n : n.slice(1);
}
function notePre(k){
  return k==="warn"?"!":k==="chk"?"?":k==="chkon"?"+":k==="none"?":":k==="link"?"@":"";
}
function noteCycle(k){        /* 循環：空白 → ・ → ⚠ → ☐ → 空白 */
  return k==="none"?"dot":k==="dot"?"warn":k==="warn"?"chk":"none";
}
function noteMark(k){
  return k==="warn"?"⚠":"";   /* ・ ☐ ✓ 都由 CSS 畫，按鈕裡不能有文字節點 */
}

/* 行首符號：三個頁面共用一套，用事件委派，重畫也不用重綁 */
var MKWIRED=false;
function cycleAt(cur,forceCheck){
  var k=noteKind(cur), body=noteBody(cur), nk;
  if(forceCheck){ nk = (k==="chkon") ? "chk" : (k==="chk" ? "chkon" : null); }
  else nk = noteCycle(k==="chkon"?"chk":k);
  return nk===null ? null : notePre(nk)+body;
}
function wireMarkers(){
  if(MKWIRED) return; MKWIRED=true;
  document.addEventListener("click",function(e){
    var b=e.target.closest(".mk"); if(!b) return;
    var forceCheck=!EDIT;

    if(b.dataset.mk){                                  /* 行程條列 */
      var q=b.dataset.mk.split(":"), f=findItem(q[0]); if(!f) return;
      var v=cycleAt(f.it.notes[+q[1]]||"",forceCheck); if(v===null) return;
      f.it.notes[+q[1]]=v; save(); render(); return;
    }
    if(b.dataset.mki){                                 /* 行前 */
      var r=b.dataset.mki.split(":"), sec=secById(r[0]); if(!sec) return;
      var arr = r[1]==="after" ? sec.after : sec.rows;
      if(!arr) return;
      var w=cycleAt(arr[+r[2]]||"",forceCheck); if(w===null) return;
      arr[+r[2]]=w; save(); render(); return;
    }
    if(b.dataset.mkb){                                 /* 備忘 */
      var t=b.dataset.mkb.split(":"), m=memoById(t[0]); if(!m) return;
      var u=cycleAt(m.b[+t[1]]||"",forceCheck); if(u===null) return;
      m.b[+t[1]]=u; save(); render(); return;
    }
  });
}

function safeUrl(u){

  if(!/^https?:\/\//i.test(u)) u="https://"+u.replace(/^\/+/,"");
  return /^https?:\/\/[^\s"'<>]+$/i.test(u) ? u : "";
}

      (S.pick[L.key]?'<button class="clr" data-cleardep="'+L.key+'">還原</button>':'')+
      '<span class="why">'+esc(lg.line)+'　'+esc(lg.a)+' 發・'+why+'</span></div>';
    first=false;
    if(L.list.length){
      var chosen=toHM(L.dep), at=L.list.indexOf(chosen);
      if(at<0){ at=0; for(var q=0;q<L.list.length;q++){ if(toMin(L.list[q])>=L.dep){ at=q; break; } } }
      var a=Math.max(0,at-6), b=Math.min(L.list.length,at+9);
      pickHTML+='<div class="times'+(L.synth?" synth":"")+'" data-focus="'+L.key+'">'+L.list.slice(a,b).map(function(t){
        return '<button class="tb'+(toMin(t)<L.ready?" past":"")+(t===chosen?" now":"")+
          '" aria-pressed="'+(t===chosen)+'" data-pick="'+L.key+'" data-t="'+t+'">'+t+'</button>';
      }).join("")+'</div>';
    }
  });
  var altHTML = (it.alts && it.alts.length>1) ?
    '<div class="alts">'+it.alts.map(function(A,i){
      return '<button class="altb" aria-pressed="'+((it.altI||0)===i)+'" data-alt="'+it.id+':'+i+'">'+
        '<b>'+esc(A.n)+'</b><span>'+esc(A.d||"")+'</span></button>';
    }).join("")+'</div>' : '';
  var chkHTML = it.chk ? '<div class="conf warn2">上下兩站變動過了，這段的路線與班次請重新確認。'+
    '<button class="cx" data-okchk="'+it.id+'" aria-label="關掉提醒">✕</button>'+
    '<br><button class="cb" data-restr="'+it.id+'">↺ 帶入查好的交通</button></div>' : '';
  var conf = lateL ? '<div class="conf">趕不上這班：'+esc(it.legs[lateL.i].line)+' '+toHM(lateL.dep)+' 開，但 '+toHM(lateL.ready)+' 才到得了 '+esc(it.legs[lateL.i].a)+'，差 '+dur(lateL.ready-lateL.dep)+'。'+
    '<br><button class="cb" data-shift="'+it.id+'">一鍵套用下一班</button></div>' : '';

  var tts={}; it.legs.forEach(function(lg){ if(lg.k==="ride"&&lg.tt) tts[lg.tt]=1; });
  var ttHTML=Object.keys(tts).map(function(k){ return ttBox(TTS[k], toHM(c.dep)); }).join("");

  return {late:lateL, hasRide:hasRide, chk:chkHTML,
    th:'<div class="th"><b><span contenteditable="true" data-tr="'+it.id+':from">'+esc(it.from)+'</span> → '+
      '<span contenteditable="true" data-tr="'+it.id+':to">'+esc(it.to)+'</span></b></div>',
    body:altHTML+'<ul class="legs">'+legHTML+'</ul>'+pickHTML+conf+
    (String(it.note||"").trim()?'<div class="tnote" contenteditable="true" data-tnote="'+it.id+'">'+esc(it.note)+'</div>':'')+
    (ttHTML?'<details class="disc"><summary>完整時刻表與出處</summary>'+ttHTML+'</details>':'')+
    '<div class="acts">'+
      (hasRide
        ? '<a class="mini" target="_blank" rel="noopener" href="'+mapDir(it.from,it.to)+'">'+ico("route")+'Google Maps 路線</a>'+
          '<button class="mini" data-addleg="'+it.id+'">＋ 加一段</button>'
        : '<a class="mini" target="_blank" rel="noopener" href="'+mapDir(it.from,it.to)+'&travelmode=walking">'+ico("walk")+'Google Maps 路線</a>')+
      '<button class="mini" data-trmap="'+it.id+'">'+ico("pin")+'在地圖上看</button>'+
      '<button class="mini rst" data-restr="'+it.id+'" title="重新帶入查好的交通">↺ 還原</button>'+
    '</div>'+
    '<div class="acts tredit">'+
      '<button class="mini" data-trfare="'+it.id+'">票價 '+(it.fare?money(it.fare,it.cur):"—")+' ✎</button>'+

function viewMoney(){
  var EX=allEx(), g=grand(), n=EX.length;
  var head='<div class="sechead"><h2>花費紀錄</h2><span class="rule"></span><span class="cnt">'+n+' 筆</span></div>'+
   '<div class="total"><span class="tlb">總計</span>'+
     '<span class="amt"><b>'+amtMain(g)+'</b><small>'+amtSub(g)+'</small></span></div>'+
   '<div class="mfabs">'+
     '<button class="fab fab-ed" data-curtog aria-label="切換主要幣別">'+ico("swap")+'</button>'+
     '<button class="fab fab-add" id="mAdd" aria-label="新增花費"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>'+
   '</div>';
  if(!n) return head+'<div class="empty">還沒有任何紀錄。<br>按右下角的「＋」新增。</div>';

  var seg='<div class="seg" role="tablist">'+
    '<button role="tab" data-g="day" aria-selected="'+(S.mgroup!=="cat"&&S.mgroup!=="who")+'">依日期</button>'+
    '<button role="tab" data-g="cat" aria-selected="'+(S.mgroup==="cat")+'">依類別</button>'+
    '<button role="tab" data-g="who" aria-selected="'+(S.mgroup==="who")+'">依人</button></div>';

  /* 類別長條 */
  var cs={}; EX.forEach(function(e){ cs[e.c||"etc"]=(cs[e.c||"etc"]||0)+(+e.a||0); });
  var mx=1; Object.keys(cs).forEach(function(k){ if(cs[k]>mx) mx=cs[k]; });
  var bars='<div class="bars">'+allCats().filter(function(C){return cs[C.k];}).sort(function(a,b){return cs[b.k]-cs[a.k];})
    .map(function(C){ return '<div class="bar"><span class="bl">'+esc(C.n)+'</span>'+
      '<span class="bt"><span class="bfill" style="width:'+Math.max(3,cs[C.k]/mx*100)+'%;background:'+catColor(C)+'"></span></span>'+
      '<span class="bv">'+amtMain(cs[C.k])+'</span></div>'; }).join("")+'</div>';

  var groups="";
  if(S.mgroup==="cat"){
    groups=allCats().filter(function(C){return cs[C.k];}).sort(function(a,b){return cs[b.k]-cs[a.k];}).map(function(C){
      var rows=EX.filter(function(e){return (e.c||"etc")===C.k;}).map(function(e){ return mrow(e,true); }).join("");
      return '<div class="mgrp"><h3><span class="sw" style="background:'+catColor(C)+'"></span>'+esc(C.n)+
        '<small>'+amtLine(cs[C.k])+'</small></h3>'+rows+'</div>';
    }).join("");
  } else if(S.mgroup==="who"){
    groups=WHOS().map(function(W){
      var list=S.expenses.filter(function(e){ return whoOf(e)===W.k; });
      if(!list.length) return "";
      var sum=0; list.forEach(function(e){ sum+=+e.a||0; });
      return '<div class="mgrp"><h3><span class="sw" style="background:'+W.c+'"></span>'+esc(W.n)+
        '<small>'+amtLine(sum)+'</small></h3>'+
        list.map(function(e){ return mrow(e,true); }).join("")+'</div>';
    }).join("");
  } else {
    groups=S.days.map(function(d){
      var list=EX.filter(function(e){return e.day===d.id;});
      if(!list.length) return "";
      var sum=0; list.forEach(function(e){ sum+=+e.a||0; });
      return '<div class="mgrp"><h3>'+esc(d.date)+'（'+esc(d.dow)+'）'+
        '<small>'+amtLine(sum)+'</small></h3>'+list.map(function(e){return mrow(e,false);}).join("")+'</div>';
    }).join("");
    var un=EX.filter(function(e){ return !dayById(e.day); });
    if(un.length){ var s2=0; un.forEach(function(e){s2+=+e.a||0;});
      groups+='<div class="mgrp"><h3>未指定日期<small>'+amtLine(s2)+'</small></h3>'+un.map(function(e){return mrow(e,false);}).join("")+'</div>'; }
  }
  return head+seg+(S.mgroup==="cat"?bars:"")+groups;
}
var WHOPAL=["#C04C36","#4E7A8C","#9C7A2E","#6B5C9E","#B4557E","#A8683F"];
function people(){ return (S.people&&S.people.length)?S.people:[{id:"a",n:"我"}]; }
function whoOf(e){
  var w=e.w||"both";
  return people().some(function(x){ return x.id===w; }) ? w : "both";
}
/* 共同排最前面，其他人照設定順序 */
function WHOS(){
  var L=[{k:"both",n:"共同",c:"#5C7A56"}];
  people().forEach(function(x,i){ L.push({k:x.id,n:x.n,c:WHOPAL[i%WHOPAL.length]}); });
  return L;
}
function whoName(k){ var L=WHOS(); for(var i=0;i<L.length;i++) if(L[i].k===k) return L[i].n; return "共同"; }
function newPersonId(){ var k; do{ k="p"+uid().slice(0,4); }while(people().some(function(x){return x.id===k;})); return k; }
function mrow(e,byCat){
  var C=cat(e.c), d=dayById(e.day);
  if(e.auto){   /* 行程票價自動帶入：地點在上、交通方式在下；點一下改票價，行程頁跟著改 */
    return '<div class="mrow auto"><button class="mhit" data-trfare="'+e.tid+'" aria-label="修改票價">'+
      '<span class="dot" style="background:'+catColor(C)+'"></span>'+
      '<span class="mn"><b>'+esc(e.sub||e.n)+'</b><small>'+esc((byCat&&d?d.date+"（"+d.dow+"）　":"")+e.n)+'</small></span>'+
      '<span class="mv"><b>'+amtMain(+e.a||0)+'</b><small>'+amtSub(+e.a||0)+'</small></span>'+
    '</button></div>';
  }
  var sub = byCat ? (d?d.date+"（"+d.dow+"）":"未指定日期") : C.n;
  sub = sub+"　"+whoName(whoOf(e));
  return '<div class="mrow">'+
    '<button class="mhit" data-editex="'+e.id+'" aria-label="編輯這筆">'+
      '<span class="dot" style="background:'+catColor(C)+'"></span>'+
      '<span class="mn"><b>'+esc(e.n||C.n)+'</b><small>'+esc(sub)+'</small></span>'+
      '<span class="mv"><b>'+amtMain(+e.a||0)+'</b><small>'+amtSub(+e.a||0)+'</small></span>'+
    '</button>'+
    '<button class="mx" data-delex="'+e.id+'">✕</button></div>';
}

function delCat(k,keepEdit){
  var L=allCats();
  if(L.length<=1){ tell("至少要留一個類別","不能把類別全部刪掉。"); return; }
  var rest=L.filter(function(c){ return c.k!==k; });
  var to=rest[0];
  var used=S.expenses.filter(function(e){return e.c===k;}).length, nm=cat(k).n;
  ask("刪除類別「"+nm+"」？", used?("已有 "+used+" 筆花費用這個類別，會改成「"+to.n+"」。"):"",function(){
    S.expenses.forEach(function(e){ if(e.c===k) e.c=to.k; });
    if(S.cats.some(function(c){ return c.k===k; })) S.cats=S.cats.filter(function(c){ return c.k!==k; });
    else S.hidecat[k]=1;                       /* 內建類別用隱藏的，舊資料不會壞掉 */
    save(); sheetAdd(keepEdit); render(); },"刪除",true);
}

/* 時間欄位：轉滑輪的過程不動，等離開欄位（按完成／點別處）才套用一次 */
function onTime(inp,apply){
  var start=inp.value, done=false;
  function commit(){
    if(done) return;
    if(inp.value===start) return;
    done=true; apply(inp.value);
  }
  inp.addEventListener("blur",commit);
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
}

/* ================= 拖曳排序 ================= */
function sortable(box,sel,onEnd,holdMs,wrap,gripSel){
  wrap = wrap || function(n){ return n.closest(".row")||n; };
  gripSel = gripSel || "[data-grip]";
  var el=null,sy=0,hold=null,py=0,auto=null;
  function items(){ return $$(sel,box); }
  /* 拖到畫面上下緣時自動捲動，這樣才能從最底下一路拉到最上面 */
  function autoScroll(){
    if(!el){ auto=null; return; }
    var top=90, bot=window.innerHeight-120, sp=0;
    if(py<top) sp=-Math.min(26,Math.ceil((top-py)/4)+4);
    else if(py>bot) sp= Math.min(26,Math.ceil((py-bot)/4)+4);
    if(sp){
      var y0=window.scrollY;
      window.scrollBy(0,sp);
      var moved=window.scrollY-y0;
      if(moved){ sy-=moved; el.style.transform="translateY("+(py-sy)+"px)"; reorder(); }
    }
    auto=requestAnimationFrame(autoScroll);
  }
  box.addEventListener("pointerdown",function(e){
    var t=e.target.closest(sel); if(!t) return;
    if(e.target.closest(gripSel)){ e.preventDefault(); e.stopPropagation(); begin(t,e.clientY); return; }
    if(holdMs==null) return;
    if(!EDIT) return;        /* 非編輯模式時長按要留給「選取文字」用，不要變成拖曳 */
    if(e.target.closest("[contenteditable],button,a,input,summary,details")) return;
    hold=setTimeout(function(){ begin(t,e.clientY); },holdMs);
    var clr=function(){ clearTimeout(hold); };
    document.addEventListener("pointerup",clr,{once:true});
    document.addEventListener("pointercancel",clr,{once:true});
    document.addEventListener("pointermove",clr,{once:true});
  });
  function begin(t,y){
    el=t; sy=y; py=y; el.classList.add("dragging");
    el.style.position="relative"; el.style.zIndex="30"; el.style.transition="none";
    document.body.style.userSelect="none";
    if(navigator.vibrate) navigator.vibrate(10);
    document.addEventListener("pointermove",move,{passive:false});
    document.addEventListener("pointerup",up,{once:true});
    document.addEventListener("pointercancel",up,{once:true});
    if(!auto) auto=requestAnimationFrame(autoScroll);
  }
  function reorder(){
    var r=el.getBoundingClientRect(), mid=r.top+r.height/2, list=items();
    for(var i=0;i<list.length;i++){
      var o=list[i]; if(o===el) continue;
      var q=o.getBoundingClientRect();
      if(mid>q.top&&mid<q.bottom){
        var before=list.indexOf(o)<list.indexOf(el);
        var he=wrap(el), ho=wrap(o);
        if(before) ho.parentNode.insertBefore(he,ho); else ho.parentNode.insertBefore(he,ho.nextSibling);
        sy=py; el.style.transform="translateY(0px)";
        if(navigator.vibrate) navigator.vibrate(6);
        break;
      }
    }
  }
  function move(e){
    if(!el) return; e.preventDefault();
    py=e.clientY;
    el.style.transform="translateY("+(py-sy)+"px)";
    reorder();
  }
  function up(){
    if(!el) return;
    document.removeEventListener("pointermove",move);
    if(auto){ cancelAnimationFrame(auto); auto=null; }
    el.classList.remove("dragging");
    el.style.transform=""; el.style.position=""; el.style.zIndex=""; el.style.transition="";
    document.body.style.userSelect="";
    var order=items().map(function(n){return n.dataset.id;});
    el=null; onEnd(order);
  }
}

/* ================= events ================= */
function txt(n){ return n.innerText.replace(/ /g," ").replace(/\n+$/,""); }
function onBlur(sel,fn){ $$(sel).forEach(function(n){ n.addEventListener("blur",function(){ fn(n); }); }); }
function noEnter(sel){ $$(sel).forEach(function(n){ n.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); n.blur(); } }); }); }
function secById(id){ for(var i=0;i<S.info.sections.length;i++) if(S.info.sections[i].id===id) return S.info.sections[i]; return null; }
function memoById(id){ for(var i=0;i<S.memo.length;i++) if(S.memo[i].id===id) return S.memo[i]; return null; }

function wire(){
  /* 行程卡：標題 / 地點 */
  onBlur("[data-ed]",function(n){
    var f=findItem(n.dataset.id); if(!f) return;
    var was=f.it[n.dataset.ed];
    f.it[n.dataset.ed]=txt(n);
    if(was===f.it[n.dataset.ed]){ save(); return; }
    /* 站名或地點改了，前後兩段交通要跟著換，能查到路線就直接帶入 */
    syncTransits(f.d); save(); render();
  });
  noEnter("[data-ed]");
  /* 頁首大標 */
  onBlur("[data-meta]",function(n){ S.meta[n.dataset.meta]=txt(n); save(); });
  noEnter('[data-meta="title"]');
  /* 日標題 */
  onBlur("[data-day]",function(n){ S.days[di][n.dataset.day]=txt(n); save(); });
  noEnter('[data-day="title"]');
  /* 註解：Enter 新增一行、空白 Backspace 刪除 */
  $$("[data-note]").forEach(function(n){
    n.addEventListener("blur",function(){
      var p=n.dataset.note.split(":"), f=findItem(p[0]); if(!f) return;
      var old=f.it.notes[+p[1]]||"";
      f.it.notes[+p[1]]=notePre(noteKind(old))+txt(n); save();
    });
    n.addEventListener("input",function(){
      var box=n.closest("li")||n;
      if(txt(n).trim()) box.classList.remove("blank"); else box.classList.add("blank");
    });
    n.addEventListener("keydown",function(e){
      var p=n.dataset.note.split(":"), f=findItem(p[0]); if(!f) return;
      if(e.key==="Enter"){ e.preventDefault(); n.blur();
        f.it.notes.splice(+p[1]+1,0,""); save(); render();
        var next=$('[data-note="'+p[0]+':'+(+p[1]+1)+'"]'); if(next) next.focus(); }
      if(e.key==="Backspace"&&!txt(n).trim()&&f.it.notes.length>1){ e.preventDefault();
        f.it.notes.splice(+p[1],1); save(); render();
        var prev=$('[data-note="'+p[0]+':'+Math.max(0,+p[1]-1)+'"]'); if(prev) prev.focus(); }
    });
  });
  /* 超連結：新增與編輯 */
  function linkDialog(title,name,url,onOk){
    dlgOpen(title,"填顯示名稱跟網址，會變成卡片下方那顆可以點的連結。",
      '<label class="fl">顯示名稱<input class="inp" id="lkN" value="'+esc(name)+'" placeholder="例：三宅商店 官網"></label>'+
      '<label class="fl">網址<input class="inp" id="lkU" inputmode="url" value="'+esc(url)+'" placeholder="https://…"></label>',
      "儲存", function(){
        var n=String($("#lkN").value||"").trim(), u=safeUrl($("#lkU").value);
        if(!u){ tell("網址看起來不對","要像 https://example.com 這樣，可以直接從瀏覽器複製貼上。"); return true; }
        onOk(n||u.replace(/^https?:\/\//,"").replace(/\/.*$/,""), u);
      });
  }
  $$("[data-addlink]").forEach(function(b){ b.onclick=function(){
    var f=findItem(b.dataset.addlink); if(!f) return;
    linkDialog("新增超連結","","",function(n,u){
      f.it.notes=f.it.notes||[]; f.it.notes.push("@"+n+"|"+u); save(); render(); });
  }; });
  $$("[data-editlink]").forEach(function(b){ b.onclick=function(){
    var q=b.dataset.editlink.split(":"), f=findItem(q[0]); if(!f) return;
    var L=linkParts(f.it.notes[+q[1]]||"");
    linkDialog("編輯超連結",L.n,L.u,function(n,u){
      f.it.notes[+q[1]]="@"+n+"|"+u; save(); render(); });
  }; });

  /* 條列可以拖曳重排 */
  $$(".notes[data-notesfor]").forEach(function(ul){
    var f=findItem(ul.dataset.notesfor); if(!f) return;
    sortable(ul,"li[data-id]",function(order){
      var links=(f.it.notes||[]).filter(function(n){ return noteKind(n)==="link"; });
      f.it.notes=order.map(function(i){ return f.it.notes[+i]; }).concat(links);
      save(); render();
    },null,function(n){ return n; },"[data-ngrip]");
  });
  /* 行前：每個區塊裡的列 */
  $$("[data-sort]").forEach(function(box){
    var q=box.dataset.sort.split(":"), sec=secById(q[0]); if(!sec) return;
    var sel = box.tagName==="TBODY" ? "tr[data-id]" : (box.classList.contains("after") ? "li[data-id]" : "[data-id]");
    sortable(box,sel,function(order){
      var arr = q[1]==="after" ? sec.after : sec.rows;
      if(!arr) return;
      var next=order.map(function(i){ return arr[+i]; });
      /* 打勾清單的完成狀態是照索引存的，重排後要跟著搬 */
      if(sec.type==="check"){
        var d={}; order.forEach(function(oldI,newI){ if(S.done[sec.id+":"+oldI]) d[sec.id+":"+newI]=1; });
        arr.forEach(function(_,i){ delete S.done[sec.id+":"+i]; });
        for(var kk in d) S.done[kk]=d[kk];
      }
      if(q[1]==="after") sec.after=next; else sec.rows=next;
      save(); render();
    },null,function(n){ return n; },"[data-ngrip]");
  });
  /* 備忘：每則備忘裡的點 */
  $$(".buls[data-memo]").forEach(function(box){
    var m=memoById(box.dataset.memo); if(!m) return;
    sortable(box,".bul[data-id]",function(order){
      var b=order.map(function(i){ return m.b[+i]; });

/* 想吃清單：用那一行的店名去搜 Google 地圖（去掉價格、營業時間、公休這些字） */
function eatQuery(t){
  var q=String(t).replace(/[（(]/g," ").replace(/[）)]/g," ")
    .replace(/[¥￥]\s?[\d,]+/g," ").replace(/\d{1,2}:\d{2}\s*[–\-~～]\s*\d{1,2}:\d{2}/g," ")
    .replace(/週.休|公休|無休/g," ").replace(/[・｜|]/g," ").replace(/\s+/g," ").trim();
  return q+" 岡山";
}

function dayArtKey(d){
  var t=d.items.map(function(x){ return (x.t||"")+" "+(x.place||""); }).join(" ");
  if(/丹頂鶴|後樂園|後楽園/.test(t)) return "crane";
  if(/吉備津/.test(t)) return "kibitsu";
  if(/阿智神社|初詣/.test(t)) return "torii";
  if(d.items.some(function(x){ return x.k==="flight"; })) return "plane";
  return "walk";
}
function lineArt(svg){
  /* 改成線條風：色塊全部去掉，只留墨色線；原本沒有外框的小圓點改成墨色實點；白色高光拿掉 */
  return svg.replace(/<(path|circle|rect)\b[^>]*\/>/g,function(el){
    var noStroke=/stroke="none"/.test(el);
    if(/stroke="#FFFFFF"/.test(el)) return "";
    if(noStroke && /fill="#FFFFFF"/.test(el)) return "";
    if(noStroke) return el.replace(/fill="#[0-9A-Fa-f]{6}"/,'fill="'+INK+'"');
    return el.replace(/fill="#[0-9A-Fa-f]{6}"/,'fill="#FFFDFC"').replace(/stroke="#[0-9A-Fa-f]{6}"/,'stroke="'+INK+'"');
  });
}
function dayArtSvg(key){
  var a=DAYART[key]||DAYART.walk;
  return '<svg class="dayart" viewBox="0 0 40 30" role="img" aria-label="'+a.n+'" fill="none" stroke="'+INK+
    '" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><title>'+a.n+'</title>'+a.svg+'</svg>';
}

var RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
var UIKEY = KEY+":ui";          /* 只記畫面偏好（單日/週、地圖開關），跟行程資料分開 */

function clamp(v,a,b){ return v<a?a:v>b?b:v; }

/* render = 引擎原本的畫面 ＋ 這一版新增的後續處理 */

  afterRender();
}

/* ---------- 頁首：標題＋插圖（內文已刪除，留空就不顯示） ---------- */
function renderMast(){
  var lede=String(S.meta.lede||"").trim();
  /* 插圖滿版、標題（含紅白繩）疊在插圖正中央；按鈕列在最下面，「自動存檔」靠右 */
  $("#mast").innerHTML=
   '<div class="eyebrow"><span>Okayama · Kurashiki</span><span>2027.01.01–03</span></div>'+
   '<div class="mhero2">'+ART.hero+
     '<div class="mtitle"><span class="titlewrap"><h1 contenteditable="true" data-meta="hero">'+
       esc(S.meta.hero||"岡山🍑倉敷").replace(/(\p{Extended_Pictographic}\uFE0F?)/gu,'<span class="emo">$1</span>')+'</h1>'+mizuhiki()+'</span></div>'+
   '</div>'+
   (lede?'<p contenteditable="true" data-meta="lede">'+esc(S.meta.lede)+'</p>':'')+
   '<div class="mtools"><button class="pill" id="btnSet">'+ico("clock")+'設定</button>'+
   '<button class="pill'+(FBstate==="on"?" live":(FBstate==="err"?" down":""))+'" id="btnSync">'+ico("swap")+

   '<span id="saveflag">自動存檔</span></div>';
  wireMast();
}

var AX={rows:[],s:0,e:0,on:false};
function tokyoNow(){
  try{
    var p=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tokyo",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(new Date());
    var h=0,m=0; p.forEach(function(x){ if(x.type==="hour") h=+x.value; if(x.type==="minute") m=+x.value; });
    return h*60+m;

}
function rowSpans(d,c){
  var tm=d.items.map(function(it){
    var x=c[it.id]||{};
    if(it.k==="spot") return [x.arr,x.leave];
    if(it.k==="transit") return [x.entry,x.arr];
    return [x.dep,x.arr];
  });
  /* 機票不算在行程時間裡：登機證那一列在軸上當成 0 分鐘，貼在前一段的結尾（第一列就貼下一段的開頭） */
  tm.forEach(function(t,i){
    if(d.items[i].k!=="flight") return;
    var p=null;
    for(var j=i-1;j>=0;j--){ if(d.items[j].k!=="flight"&&tm[j][1]!=null){ p=tm[j][1]; break; } }
    if(p==null) for(var q=i+1;q<tm.length;q++){ if(d.items[q].k!=="flight"&&tm[q][0]!=null){ p=tm[q][0]; break; } }
    tm[i]=[p,p];

function axisPrep(){

function region(){

var axRaf=0;
function axisQueue(){ if(!axRaf) axRaf=requestAnimationFrame(function(){ axRaf=0; axisTick(); }); }
function axisTick(){
  var a=$("#taxis"); if(!a) return;

  var s0=T-R.t, s1=Bm-R.b, p = s1>s0 ? clamp((Y-s0)/(s1-s0),0,1) : 0;
  var fy=T+p*(Bm-T)-Y;              /* 視窗座標 */

/* ==========================================================================
   週行事曆：時間網格、類別顏色、重疊時並排
   桌面：單擊預覽、雙擊編輯；手機：點一下預覽，預覽裡有「編輯」
   按住行程卡 3 秒才開始拖移（只改時間、留在同一天）；底部把手拉長縮短
   ========================================================================== */
var WCAT={
  sight:{n:"景點",c:"#6B5C9E"}, food:{n:"餐飲",c:"#C25A3E"}, shrine:{n:"參拜",c:"#B0802A"},
  stay:{n:"住宿・行李",c:"#6E7B72"}, move:{n:"交通",c:"#3E6E86"}, fly:{n:"航班・機場",c:"#8A7C75"}
};
function spotCat(ic){
  if(ic==="fork"||ic==="cup") return "food";
  if(ic==="torii") return "shrine";
  if(ic==="bed"||ic==="luggage") return "stay";
  if(ic==="plane") return "fly";
  return "sight";
}
var WK={H:52, s:0, e:0, days:[]};
function weekData(){
  var all=[];
  var days=S.days.map(function(d,dIdx){
    var c=compute(d), ev=[];
    d.items.forEach(function(it,i){
      var x=c[it.id]||{}, s, e, cat, name, kind=it.k;
      if(it.k==="spot"){ s=x.arr; e=x.leave; cat=spotCat(it.ic); name=it.t; }
      else if(it.k==="transit"){ s=x.entry; e=x.arr; cat="move"; name=it.from+" → "+it.to; }
      else return;                 /* 機票不算在行程裡 */
      if(s==null||isNaN(s)) return;
      if(e==null||isNaN(e)||e<s) e=s;
      ev.push({id:it.id,kind:kind,it:it,s:s,e:e,cat:cat,name:name,i:i,d:dIdx});
    });
    /* 重疊時並排：同一串互相重疊的行程，平分欄寬 */
    ev.sort(function(a,b){ return a.s-b.s || a.i-b.i; });
    var cl=[], cEnd=-1;
    function flush(){
      if(!cl.length) return;
      var cols=[];
      cl.forEach(function(o){
        var k=0; while(k<cols.length && cols[k]>o.s) k++;
        cols[k]=Math.max(o.e,o.s+1); o.col=k;
      });
      cl.forEach(function(o){ o.n=cols.length; });
      cl=[];
    }
    ev.forEach(function(o){
      var oe=Math.max(o.e,o.s+1);           /* 用實際時間判斷重疊；很短的只是畫高一點 */
      if(o.s>=cEnd) flush();
      cl.push(o); cEnd=Math.max(cEnd,oe);
    });
    flush();
    all=all.concat(ev);
    return {d:d,ev:ev};
  });
  var s=Infinity,e=-Infinity;
  all.forEach(function(o){ if(o.s<s) s=o.s; if(o.e>e) e=o.e; });
  if(!isFinite(s)){ s=420; e=1260; }

/* ---------- 指標操作：按住 3 秒拖移、底部把手調時長 ---------- */
var WDRAG=null, WHOLD=null, WLAST={id:null,t:0};
function snap5(m){ return Math.round(m/5)*5; }
function wireWeek(){
  var wk=$("#wk"); if(!wk) return;
  weekNow();
  wk.addEventListener("touchmove",function(e){ if(WDRAG) e.preventDefault(); },{passive:false});
  wk.addEventListener("contextmenu",function(e){ if(e.target.closest(".wev")) e.preventDefault(); });
  wk.addEventListener("pointerdown",function(e){
    var el=e.target.closest(".wev"); if(!el) return;
    if(e.button>0) return;
    var o=wevById(el.dataset.wev); if(!o) return;
    var start={x:e.clientX,y:e.clientY,t:Date.now(),el:el,o:o,moved:false};
    if(e.target.closest("[data-wrz]") && o.kind==="spot"){
      e.preventDefault(); wpopClose();
      WDRAG={type:"rz",el:el,o:o,y0:e.clientY,e0:o.e,v:o.e};
      el.classList.add("resizing");
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      return;
    }
    if(o.kind==="spot"){
      el.classList.add("holding");
      WHOLD=setTimeout(function(){
        WHOLD=null; el.classList.remove("holding");
        wpopClose(); start.dragged=true;
        WDRAG={type:"mv",el:el,o:o,y0:start.y,x0:start.x,s0:o.s,v:o.s,col:+el.dataset.day,col0:+el.dataset.day};
        el.classList.add("dragging");
        if(navigator.vibrate) navigator.vibrate(12);
      },500);
    }
    function mv(ev){
      if(WDRAG) return;
      if(Math.abs(ev.clientX-start.x)>8||Math.abs(ev.clientY-start.y)>8){ start.moved=true; cancelHold(); }
    }
    function cancelHold(){ if(WHOLD){ clearTimeout(WHOLD); WHOLD=null; } el.classList.remove("holding"); }
    function up(ev){
      document.removeEventListener("pointermove",mv);
      var wasHold=!!WHOLD; cancelHold();
      if(WDRAG||start.dragged) return;        /* 拖移結束由 wDragEnd 處理 */
      if(ev.type==="pointercancel"||start.moved) return;
      if(wasHold || Date.now()-start.t<500){
        /* 單擊＝預覽；桌面上 350ms 內再點一下＝編輯 */
        var nowT=Date.now();
        if(WLAST.id===o.id && nowT-WLAST.t<350 && o.kind==="spot"){ WLAST.id=null; sheetWeekEdit(o.id); return; }
        WLAST={id:o.id,t:nowT};
        wpopOpen(el);
      }
    }
    document.addEventListener("pointermove",mv);
    document.addEventListener("pointerup",up,{once:true});
    document.addEventListener("pointercancel",up,{once:true});
  });
  if(!WK.bound){
    WK.bound=true;
    document.addEventListener("pointermove",wDragMove,{passive:false});
    document.addEventListener("pointerup",wDragEnd);
    document.addEventListener("pointercancel",wDragEnd);
  }
  wk.addEventListener("keydown",function(e){
    var el=e.target.closest(".wev"); if(!el) return;
    if(e.key==="Enter"||e.key===" "){ e.preventDefault(); wpopOpen(el); }
  });
}
function wDragMove(e){
  if(!WDRAG) return;
  e.preventDefault();
  var dm=(e.clientY-WDRAG.y0)/WK.H*60, o=WDRAG.o, el=WDRAG.el;
  if(WDRAG.type==="mv"){
    var ns=clamp(snap5(WDRAG.s0+dm),WK.s,WK.e-(o.e-o.s));
    WDRAG.v=ns; el.style.top=wy(ns)+"px";
    $(".wt",el).textContent=hm(ns);
    /* 左右：看手指在哪一天的欄位，整塊移過去 */
    var cols=$$("#wk .wkcol"), c0=cols[WDRAG.col0], hit=WDRAG.col0;
    cols.forEach(function(c,i){ var r=c.getBoundingClientRect(); if(e.clientX>=r.left&&e.clientX<r.right) hit=i; });
    WDRAG.col=hit;
    var dx=cols[hit].getBoundingClientRect().left-c0.getBoundingClientRect().left;
    el.style.transform=dx?"translateX("+dx+"px)":"";
    cols.forEach(function(c,i){ c.classList.toggle("droptg",i===hit&&hit!==WDRAG.col0); });
  } else {
    var ne=clamp(snap5(WDRAG.e0+dm),o.s+5,WK.e);
    WDRAG.v=ne; el.style.height=Math.max(13,wy(ne)-wy(o.s)-2)+"px";
    $(".wt",el).textContent=hm(o.s)+"–"+hm(ne);
  }
}
function wDragEnd(){
  if(!WDRAG) return;
  var W=WDRAG; WDRAG=null;
  W.el.classList.remove("dragging","resizing");
  var o=W.o, f=findItem(o.id); if(!f){ render(); return; }
  var d=f.d, idx=f.j;
  $$("#wk .wkcol").forEach(function(c){ c.classList.remove("droptg"); }); W.el.style.transform="";
  if(W.type==="mv"){
    if(W.col!==W.col0 || spotOrderChanges(d,o.id,W.v)){ moveSpotTo(d,o.id,W.col,W.v,o.e-o.s); return; }
    if(W.v===o.s){ render(); return; }
    S.anchor[o.id]=hm(W.v); S.leave[o.id]=hm(W.v+(o.e-o.s));
    clearAfter(d,idx); save(); render(); flag("改到 "+hm(W.v)+"，後面自動順延");
  } else {
    if(W.v===o.e){ render(); return; }
    S.leave[o.id]=hm(W.v);
    clearAfter(d,idx); save(); render(); flag("停留改成 "+dur(W.v-o.s));
  }
}

/* 拖到別的時間會不會越過前後的景點（越過就要換順序） */
function spotOrderChanges(day,id,T){
  var c=compute(day), ids=day.items.filter(function(x){return x.k==="spot";}).map(function(x){return x.id;});
  var k=ids.indexOf(id); if(k<0) return false;
  var prev=ids[k-1], next=ids[k+1];
  return (prev && c[prev] && T<c[prev].arr) || (next && c[next] && T>c[next].arr);
}
/* 把一站搬到（同一天或別天）指定時間：拿掉原本的站與前面那段交通，依時間插進目標那天，交通自動接好 */
function moveSpotTo(src,id,toIdx,T,durMin){
  var dst=S.days[toIdx]; if(!dst) return;
  var c0=compute(dst), beforeId=null;
  dst.items.forEach(function(it){ if(beforeId||it.k!=="spot"||it.id===id) return; var x=c0[it.id]; if(x&&x.arr!=null&&x.arr>T) beforeId=it.id; });
  var i=-1; src.items.forEach(function(x,k){ if(x.id===id) i=k; }); if(i<0) return;
  var sp=src.items[i], st=i, del=1;
  if(i>0 && src.items[i-1].k==="transit"){ st=i-1; del=2; }
  else if(src.items[i+1] && src.items[i+1].k==="transit"){ del=2; }   /* 第一站：連同後面那段交通 */
  src.items.splice(st,del); syncTransits(src);
  function idx(d,iid){ var r=-1; d.items.forEach(function(x,k){ if(x.id===iid) r=k; }); return r; }
  var at=beforeId?idx(dst,beforeId):-1, tr;
  if(at<0){
    at=dst.items.length; while(at>0 && dst.items[at-1].k==="flight") at--;
    tr=newTransit(prevSpotName(dst,at), spotName(sp)); dst.items.splice(at,0,tr,sp);
  } else {
    var ins=at; if(ins>0 && dst.items[ins-1].k==="transit") ins--;
    var hasPrev=dst.items.slice(0,ins).some(function(x){ return x.k==="spot"; });
    if(hasPrev){ tr=newTransit(prevSpotName(dst,ins), spotName(sp)); dst.items.splice(ins,0,tr,sp); }
    else { tr=newTransit(spotName(sp), spotName(dst.items[at])); dst.items.splice(at,0,sp,tr); }
  }
  applyRoute(tr); syncTransits(dst);
  S.anchor[id]=hm(T); S.leave[id]=hm(T+(durMin||60));
  [src,dst].forEach(function(d){ clearAfter(d,-1); });
  save(); render();
  flag((src===dst?"":"搬到 "+dst.date+"，")+"改到 "+hm(T)+"，前後交通已重算");
}

function prj(ll,z){
  var s=256*Math.pow(2,z), sn=Math.sin(ll[0]*Math.PI/180);

function unprj(px,z){
  var s=256*Math.pow(2,z), n=Math.PI-2*Math.PI*px[1]/s;
  return [180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n))), px[0]/s*360-180];
}

function legMode(lg){
  if(lg.k!=="ride") return "walk";

function lineWay(lg,it){
  var s=String(lg.line||""), m=legMode(lg);
  if(m==="train"&&/山陽/.test(s)) return WAY.sanyo;
  if(m==="train"&&/桃太郎線|吉備線/.test(s)) return WAY.kibi;
  if(m==="tram") return WAY.tram;
  if(m==="bus"&&/利木津|リムジン|空港|機場/.test(s+it.from+it.to)) return /倉敷/.test(it.from+it.to)?WAY.busKura:WAY.busOka;
  if(m==="train"&&/機場捷運|機捷/.test(s)) return WAY.tymetro;
  if(m==="train"&&/松山新店|捷運/.test(s)) return WAY.mrt;
  return null;
}
function trGeom(it){
  var A=geoOf(it.from), B=geoOf(it.to); if(!A||!B) return null;
  var cur=[A[0],A[1]], out=[], pend=false;
  it.legs.forEach(function(lg){
    var m=legMode(lg);
    if(m==="walk"){ pend=true; return; }
    var w=lineWay(lg,it);
    if(w){
      w=w.slice(); if(gdist(cur,w[w.length-1])<gdist(cur,w[0])) w.reverse();
      if(gdist(cur,w[0])>0.0004) out.push({m:"walk",pts:[cur,w[0]]});
      out.push({m:m,pts:w,rail:m!=="bus"}); cur=w[w.length-1];
    } else { out.push({m:m,pts:[cur,[B[0],B[1]]]}); cur=[B[0],B[1]]; }
    pend=false;
  });
  if(gdist(cur,B)>0.0002 || (pend&&!out.length)) out.push({m:"walk",pts:[cur,[B[0],B[1]]]});
  return out.length?out:null;
}
function dayFeat(d){
  var spots=[], segs=[], by={}, n=0;
  d.items.forEach(function(it){
    if(it.k==="spot"){
      n++;
      var nm=it.place||it.t, key=canonPlace(nm)||(GEO[nm]?nm:null), g=key&&GEO[key]; if(!g) return;
      if(by[key]){ by[key].nums.push(n); by[key].ids.push(it.id); return; }
      by[key]={key:key,ll:g,lab:g[2],nums:[n],ids:[it.id],ic:it.ic,cat:spotCat(it.ic),place:it.place||it.t};
      spots.push(by[key]);
    } else if(it.k==="transit"){
      var p=trGeom(it); if(p) segs.push({id:it.id,it:it,parts:p});
    }
  });
  return {spots:spots,segs:segs};
}
function isTW(ll){ return ll[1]<125; }

var TILE="?";      /* ? 測試中、ok 可用、no 不可用 */
function tileUrl(z,x,y){ return "https://"+"abcd".charAt((x+y)%4)+".basemaps.cartocdn.com/light_all/"+z+"/"+x+"/"+y+(window.devicePixelRatio>1.4?"@2x":"")+".png"; }
function tileProbe(){
  if(TILE!=="?") return;
  TILE="testing";
  var img=new Image(), done=false;
  function fin(ok){ if(done) return; done=true; TILE=ok?"ok":"no"; mapDraw(); if(ok) routeFetchAll(); }
  img.onload=function(){ fin(true); }; img.onerror=function(){ fin(false); };
  setTimeout(function(){ fin(false); },4500);

}

/* ---------- 真實路線（步行、巴士），存在另一個 key，不動行程資料 ---------- */
var RKEY=KEY+":routes";
var ROUTEC=(function(){ try{ return JSON.parse(localStorage.getItem(RKEY))||{}; }catch(e){ return {}; } })();
function rkey(part){ var a=part.pts[0], b=part.pts[part.pts.length-1]; return part.m+":"+a[0].toFixed(4)+","+a[1].toFixed(4)+";"+b[0].toFixed(4)+","+b[1].toFixed(4); }
var RBUSY={};
function routeFetchAll(){
  if(TILE!=="ok"||!MP.feat) return;
  MP.feat.segs.forEach(function(sg){ sg.parts.forEach(function(pt){
    if(pt.rail||pt.m==="plane") return;
    var k=rkey(pt); if(ROUTEC[k]||RBUSY[k]) return;
    var a=pt.pts[0], b=pt.pts[pt.pts.length-1];
    if(gdist(a,b)>0.6||gdist(a,b)<0.0008) return;
    RBUSY[k]=1;
    var prof = pt.m==="walk" ? "routed-foot/route/v1/foot/" : "routed-car/route/v1/driving/";
    fetch("https://routing.openstreetmap.de/"+prof+a[1]+","+a[0]+";"+b[1]+","+b[0]+"?overview=full&geometries=geojson")
      .then(function(r){ return r.json(); })
      .then(function(j){
        var c=j&&j.routes&&j.routes[0]&&j.routes[0].geometry&&j.routes[0].geometry.coordinates;
        if(!c||c.length<2) return;
        var step=Math.max(1,Math.floor(c.length/160));
        ROUTEC[k]=c.filter(function(_,i){ return i%step===0||i===c.length-1; }).map(function(q){ return [+q[1].toFixed(5),+q[0].toFixed(5)]; });
        try{ localStorage.setItem(RKEY,JSON.stringify(ROUTEC)); }catch(e){}
        mapDraw();
      }).catch(function(){});
  }); });
}

function mapRefresh(){
  var mp=$("#mappanel"); if(!mp) return;
  mp.innerHTML = UI.map ? mapPanelHTML() : "";
  if(UI.map) mapInit();
}
function mapPts(){
  var F=MP.feat, sel=MP.sel, mode=UI.mapMode, pts=[];
  if(mode==="spot"&&sel){ F.spots.forEach(function(s){ if(s.key===sel) pts.push(s.ll); }); }
  else if(mode==="seg"&&sel){ F.segs.forEach(function(sg){ if(sg.id===sel) sg.parts.forEach(function(p){ pts=pts.concat(p.pts); }); }); }
  else {
    F.spots.forEach(function(s){ pts.push(s.ll); });
    F.segs.forEach(function(sg){ sg.parts.forEach(function(p){ pts=pts.concat(p.pts); }); });
  }
  var jp=pts.filter(function(p){ return !isTW(p); });
  MP.twHidden = jp.length && jp.length<pts.length;
  return jp.length?jp:pts;
}
function mapFit(){
  var box=$("#mapbox"); if(!box) return;
  var W=box.clientWidth||320, H=box.clientHeight||220, pts=mapPts(), pad=34;
  if(!pts.length){ MP.view={c:[34.63,133.84],z:10}; return; }
  var a=pts.map(function(p){ return prj(p,0); });
  var x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  a.forEach(function(q){ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); });
  var dx=x1-x0, dy=y1-y0, z;
  if(dx<1e-9&&dy<1e-9) z=16;
  else z=Math.log2(Math.min((W-pad*2)/Math.max(dx,1e-9),(H-pad*2)/Math.max(dy,1e-9)));
  z=clamp(z,4,17);
  MP.view={c:unprj([(x0+x1)/2,(y0+y1)/2],0),z:z};
}
function mapInit(){
  var box=$("#mapbox"); if(!box) return;
  if(!MP.view) mapFit();
  tileProbe();
  mapDraw();
  mapWire(box);
}
function pathD(pts,z,ox,oy){
  return pts.map(function(p,i){ var q=prj(p,z); return (i?"L":"M")+(q[0]-ox).toFixed(1)+" "+(q[1]-oy).toFixed(1); }).join("");
}
function mapDraw(){
  var box=$("#mapbox"), L=$("#mlayer"); if(!box||!L||!MP.view||!MP.feat) return;
  var W=box.clientWidth, H=box.clientHeight, z=MP.view.z, c=prj(MP.view.c,z), ox=c[0]-W/2, oy=c[1]-H/2;
  var html="";
  if(TILE==="ok"){
    var tz=clamp(Math.round(z),1,18), k=Math.pow(2,z-tz), ts=256*k, n=Math.pow(2,tz);
    var tx0=Math.floor(ox/ts), tx1=Math.floor((ox+W)/ts), ty0=Math.floor(oy/ts), ty1=Math.floor((oy+H)/ts);
    for(var ty=ty0;ty<=ty1;ty++){ if(ty<0||ty>=n) continue;
      for(var tx=tx0;tx<=tx1;tx++){
        var wx=((tx%n)+n)%n;
        html+='<img class="tile" alt="" draggable="false" src="'+tileUrl(tz,wx,ty)+'" style="left:'+(tx*ts-ox).toFixed(1)+'px;top:'+(ty*ts-oy).toFixed(1)+'px;width:'+(ts+.5).toFixed(1)+'px;height:'+(ts+.5).toFixed(1)+'px">';
      }
    }
  }
  var mpp=156543.03*Math.cos(MP.view.c[0]*Math.PI/180)/Math.pow(2,z);
  var svg='<svg class="msvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">';
  if(TILE!=="ok"){
    svg+='<rect width="'+W+'" height="'+H+'" fill="#EEECE9"/>'+
      '<path d="'+pathD(SKETCH.sea,z,ox,oy)+'Z" fill="#D5E6EF"/>'+
      SKETCH.rivers.map(function(r){ return '<path d="'+pathD(r.p,z,ox,oy)+'" fill="none" stroke="#C9DFEA" stroke-width="'+Math.max(1.6,r.w/mpp).toFixed(1)+'" stroke-linecap="round" stroke-linejoin="round"/>'; }).join("")+
      SKETCH.towns.map(function(t){ var q=prj(t,z); return '<text class="town" x="'+(q[0]-ox).toFixed(1)+'" y="'+(q[1]-oy+(z>13?-26:-12)).toFixed(1)+'">'+t[2]+'</text>'; }).join("");
  }
  var sel=MP.sel, mode=UI.mapMode;
  /* 路線：先畫白色外框，再畫顏色 */
  var lines="", halo="";
  MP.feat.segs.forEach(function(sg){
    var on = mode!=="seg" || !sel || sel===sg.id;
    sg.parts.forEach(function(pt){
      var pts = (!pt.rail && ROUTEC[rkey(pt)]) || pt.pts;
      var d=pathD(pts,z,ox,oy), w=(mode==="seg"&&sel===sg.id)?5.5:4;
      halo+='<path d="'+d+'" stroke="#FFFFFF" stroke-width="'+(w+3)+'" opacity="'+(on?.95:.4)+'"/>';
      lines+='<path data-mseg="'+sg.id+'" d="'+d+'" stroke="'+MCOL[pt.m]+'" stroke-width="'+w+'"'+(pt.m==="walk"?' stroke-dasharray="0.1 '+(w+3)+'"':'')+' opacity="'+(on?1:.28)+'"/>';
    });
  });
  svg+='<g fill="none" stroke-linecap="round" stroke-linejoin="round">'+halo+lines+'</g>';
  /* 地標 */
  var marks="";
  MP.feat.spots.forEach(function(s){
    var q=prj(s.ll,z), x=q[0]-ox, y=q[1]-oy, on=(mode==="spot"&&sel===s.key);
    if(x<-30||y<-30||x>W+30||y>H+30) return;
    var r=on?12:9, C=WCAT[s.cat].c;
    marks+='<g class="mspot" data-mspot="'+esc(s.key)+'" transform="translate('+x.toFixed(1)+' '+y.toFixed(1)+')">'+
      '<circle r="'+r+'" fill="'+C+'" stroke="#FFFFFF" stroke-width="2.4"/>'+
      '<text y="3.6" text-anchor="middle" class="mnum">'+s.nums[0]+'</text>'+
      ((on||mode==="spot"||z>=15.2)?'<text class="mlab" x="'+(r+4)+'" y="4">'+esc(s.lab+(s.nums.length>1?"（"+s.nums.join("・")+"）":""))+'</text>':'')+
    '</g>';
  });
  svg+=marks+'</svg>';
  L.style.transform="";
  L.innerHTML=html+svg;
  /* 外部地圖連結 */
  var go=$("#mgo"), F=MP.feat, url;
  if(mode==="spot"&&sel){ F.spots.forEach(function(s){ if(s.key===sel) url=mapGo(s.place); }); }
  else if(mode==="seg"&&sel){ F.segs.forEach(function(sg){ if(sg.id===sel){ var walk=sg.parts.every(function(p){ return p.m==="walk"; });
      url=mapDir(sg.it.from,sg.it.to)+(walk?"&travelmode=walking":""); } }); }
  else {
    var seq=[]; S.days[di].items.forEach(function(it){ if(it.k==="spot"&&it.place&&seq[seq.length-1]!==it.place) seq.push(it.place); });
    var jp=seq.filter(function(p){ var g=geoOf(p); return !g||!isTW(g); });
    if(jp.length>=2){
      var mid=jp.slice(1,-1).slice(0,8);
      url="https://www.google.com/maps/dir/?api=1&origin="+encodeURIComponent(jp[0])+"&destination="+encodeURIComponent(jp[jp.length-1])+
        (mid.length?"&waypoints="+encodeURIComponent(mid.join("|")):"")+"&travelmode=transit";
    } else if(jp.length) url=mapGo(jp[0]);
  }
  if(go){ go.href=url||"https://www.google.com/maps"; }
  var at=$("#mattr"); if(at) at.textContent = TILE==="ok" ? "© OpenStreetMap © CARTO" : "示意圖";
  var nt=$("#mnote");
  if(nt) nt.textContent = (TILE==="no" ? "這裡載不到底圖，先畫示意圖；實際路線按「Google 地圖」。" : "")+
    (MP.twHidden ? "台灣段不在圖上。" : "");
}
function mapZoom(dz,cx,cy){
  var box=$("#mapbox"); if(!box||!MP.view) return;
  var W=box.clientWidth, H=box.clientHeight;
  if(cx==null){ cx=W/2; cy=H/2; }
  var z=MP.view.z, nz=clamp(z+dz,4,18), c=prj(MP.view.c,z);
  var g=[c[0]-W/2+cx, c[1]-H/2+cy], ll=unprj(g,z), g2=prj(ll,nz);
  MP.view={c:unprj([g2[0]-cx+W/2, g2[1]-cy+H/2],nz), z:nz};
  mapDraw();
}
function mapWire(box){
  if(box._w) return; box._w=true;
  var pts={}, st=null;
  box.addEventListener("pointerdown",function(e){
    if(e.target.closest(".mzoom,.mgo")||box.classList.contains("gm")) return;   /* Google 地圖自己處理拖曳縮放 */
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    try{ box.setPointerCapture(e.pointerId); }catch(_){}
    var ks=Object.keys(pts);
    if(ks.length===1){ st={x:e.clientX,y:e.clientY,c:MP.view.c,z:MP.view.z,moved:false,target:e.target}; }
    else if(ks.length===2){
      var a=pts[ks[0]], b=pts[ks[1]];
      st={pinch:true,d0:Math.hypot(a.x-b.x,a.y-b.y)||1,c:MP.view.c,z:MP.view.z,moved:true,
          mx:(a.x+b.x)/2,my:(a.y+b.y)/2};
    }
  });
  box.addEventListener("pointermove",function(e){
    if(!pts[e.pointerId]||!st) return;
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var L=$("#mlayer");
    if(st.pinch){
      var ks=Object.keys(pts); if(ks.length<2) return;
      var a=pts[ks[0]], b=pts[ks[1]], d=Math.hypot(a.x-b.x,a.y-b.y);
      st.k=d/st.d0;
      var r=box.getBoundingClientRect();
      L.style.transformOrigin=(st.mx-r.left)+"px "+(st.my-r.top)+"px";
      L.style.transform="scale("+st.k+")";
      return;
    }
    var dx=e.clientX-st.x, dy=e.clientY-st.y;
    if(Math.abs(dx)+Math.abs(dy)>5) st.moved=true;
    if(st.moved){ L.style.transformOrigin="0 0"; L.style.transform="translate("+dx+"px,"+dy+"px)"; st.dx=dx; st.dy=dy; }
  });
  function end(e){
    if(!pts[e.pointerId]) return;
    delete pts[e.pointerId];
    if(!st) return;
    if(st.pinch){
      if(Object.keys(pts).length) return;
      var r=box.getBoundingClientRect();
      MP.view={c:st.c,z:st.z};
      if(st.k) mapZoom(Math.log2(st.k),st.mx-r.left,st.my-r.top); else mapDraw();
      st=null; return;
    }
    if(st.moved){
      var c=prj(st.c,st.z);
      MP.view={c:unprj([c[0]-(st.dx||0),c[1]-(st.dy||0)],st.z),z:st.z};
      mapDraw();
    } else {
      var m=st.target.closest&&st.target.closest("[data-mspot],[data-mseg]");
      if(m){
        if(m.dataset.mspot){ UI.mapMode="spot"; MP.sel=m.dataset.mspot; }
        else { UI.mapMode="seg"; MP.sel=m.dataset.mseg; }
        uiSave(); MP.view=null; mapRefresh();
      }
    }
    st=null;
  }
  box.addEventListener("pointerup",end);
  box.addEventListener("pointercancel",end);
  box.addEventListener("wheel",function(e){
    e.preventDefault();
    var r=box.getBoundingClientRect();
    mapZoom(e.deltaY<0?0.5:-0.5,e.clientX-r.left,e.clientY-r.top);
  },{passive:false});
  box.addEventListener("dblclick",function(e){
    var r=box.getBoundingClientRect(); mapZoom(1,e.clientX-r.left,e.clientY-r.top);
  });
}

    }).join("")+'</div>'+
    '<p class="hint">換成步行後，這一段就不套用時刻表；換回原本的交通方式時，原本的班次資料會還原。時長在交通卡上點「分」調整。</p>');

    f.it.legs.forEach(function(_,k){ delete S.pick[rideKey(tid,k)]; });

  }; });

var EXWIRED=false;

    var b;

      if(UI.mode!==b.dataset.vmode){ UI.mode=b.dataset.vmode; uiSave(); render(0); }

    if((b=e.target.closest("[data-maptog]"))){ UI.map=!UI.map; uiSave(); render(); return; }
    if((b=e.target.closest("[data-mmode]"))){ UI.mapMode=b.dataset.mmode; MP.sel=null; MP.view=null; uiSave(); mapRefresh(); return; }
    if((b=e.target.closest("[data-msel]"))){

    }
    if((b=e.target.closest("[data-mz]"))){ mapZoom(+b.dataset.mz); return; }
    if((b=e.target.closest("[data-trtog]"))){
      if(EDIT) return;
      var id=b.dataset.trtog; trOpen[id]=!trOpen[id];
      var row=b.closest(".row"), y0=row?row.getBoundingClientRect().top:0;

      return;

/* iPhone 的 App 內頁捲到底時會多讓出一段空白（記帳本按鈕下面空出來）。
   捲動停下來時量一次：按鈕離底部比設定的遠＝多出來的空白，就從頁尾留白扣掉；
   反過來按鈕壓到「新增一站」就加回去。量到的值記在這台手機上 */
var BINT=0, BIN=0;
var BINKEY="okayama-shinshun-binset2";   /* 換新名字：舊的值可能是彈跳時量錯的，重新量 */
try{ BIN=Math.max(0,Math.min(120,+localStorage.getItem(BINKEY)||0)); }catch(e){}
function binApply(){ view.style.setProperty("--binset",BIN+"px"); }
/* 量兩次（間隔 0.4 秒、捲動位置沒變、數值一樣）才算數，避免彈跳時量錯 */
function binFix(){
  var y=window.scrollY, m1=binMeasure();
  if(m1==null) return;
  setTimeout(function(){
    if(Math.abs(window.scrollY-y)>0.5) return;
    var m2=binMeasure(); if(m2==null||Math.abs(m2-m1)>1) return;
    if(m2!==BIN){ BIN=m2; try{ localStorage.setItem(BINKEY,String(BIN)); }catch(e){} binApply(); }
  },400);
}
function binMeasure(){
  if(document.body.classList.contains("hidebars")) return null;
  var K=view.lastElementChild;
  if(!K || !(K.classList.contains("fabrow")||K.classList.contains("mfabs"))) return null;
  var fr=K.getBoundingClientRect(), a=K.previousElementSibling;
  var stick=parseFloat(getComputedStyle(K).bottom)||86;
  var d=window.innerHeight-fr.bottom, nb=BIN;
  if(d>stick+1) nb=BIN+Math.round(d-stick);                       /* 按鈕底下多了空白 */
  else if(a && window.scrollY+window.innerHeight>=document.documentElement.scrollHeight-2){ var ar=a.getBoundingClientRect();
    if(ar.bottom>0 && ar.bottom<window.innerHeight && fr.top-ar.bottom<17) nb=BIN-Math.round(18-(fr.top-ar.bottom)); }  /* 壓到上面的內容 */
  return Math.max(0,Math.min(120,nb));
}
