/* ---------- Page 3: 花費 ---------- */
function viewMoney(){
  var g=grand(), n=S.expenses.length;
  var head='<div class="sechead"><h2>花費紀錄</h2><span class="rule"></span><span class="cnt">'+n+' 筆</span></div>'+
   '<div class="total"><span class="tlb">總計</span>'+
     '<span class="amt"><b>'+amtMain(g)+'</b><small>'+amtSub(g)+'</small></span>'+
     '<button class="curtog" data-curtog aria-label="切換主要幣別">'+ico("swap")+'</button></div>'+
   '<button class="bigbtn" id="mAdd">＋ 新增花費</button>';
  if(!n) return head+'<div class="empty">還沒有任何紀錄。<br>按上面的「新增花費」，或右下角的記帳本。</div>';

  var seg='<div class="seg" role="tablist">'+
    '<button role="tab" data-g="day" aria-selected="'+(S.mgroup!=="cat"&&S.mgroup!=="who")+'">依日期</button>'+
    '<button role="tab" data-g="cat" aria-selected="'+(S.mgroup==="cat")+'">依類別</button>'+
    '<button role="tab" data-g="who" aria-selected="'+(S.mgroup==="who")+'">依人</button></div>';

  /* 類別長條 */
  var cs={}; S.expenses.forEach(function(e){ cs[e.c||"etc"]=(cs[e.c||"etc"]||0)+(+e.a||0); });
  var mx=1; Object.keys(cs).forEach(function(k){ if(cs[k]>mx) mx=cs[k]; });
  var bars='<div class="bars">'+allCats().filter(function(C){return cs[C.k];}).sort(function(a,b){return cs[b.k]-cs[a.k];})
    .map(function(C){ return '<div class="bar"><span class="bl">'+esc(C.n)+'</span>'+
      '<span class="bt"><span class="bfill" style="width:'+Math.max(3,cs[C.k]/mx*100)+'%;background:'+catColor(C)+'"></span></span>'+
      '<span class="bv">'+amtMain(cs[C.k])+'</span></div>'; }).join("")+'</div>';

  var groups="";
  if(S.mgroup==="cat"){
    groups=allCats().filter(function(C){return cs[C.k];}).sort(function(a,b){return cs[b.k]-cs[a.k];}).map(function(C){
      var rows=S.expenses.filter(function(e){return (e.c||"etc")===C.k;}).map(function(e){ return mrow(e,true); }).join("");
      return '<div class="mgrp"><h3><span class="sw" style="background:'+catColor(C)+'"></span>'+esc(C.n)+
        '<small>'+amtLine(cs[C.k])+'</small></h3>'+rows+'</div>';
    }).join("");
  } else if(S.mgroup==="who"){
    groups=WHOS().map(function(W){
      var list=S.expenses.filter(function(e){ return whoOf(e)===W.k; });
      if(!list.length) return "";
      var sum=0; list.forEach(function(e){ sum+=+e.a||0; });
      return '<div class="mgrp"><h3><span class="sw" style="background:'+W.c+'"></span>'+esc(W.n)+
        '<small>'+amtLine(sum)+'</small></h3>'+
        list.map(function(e){ return mrow(e,true); }).join("")+'</div>';
    }).join("");
  } else {
    groups=S.days.map(function(d){
      var list=S.expenses.filter(function(e){return e.day===d.id;});
      if(!list.length) return "";
      var sum=0; list.forEach(function(e){ sum+=+e.a||0; });
      return '<div class="mgrp"><h3>'+esc(d.date)+'（'+esc(d.dow)+'）'+
        '<small>'+amtLine(sum)+'</small></h3>'+list.map(function(e){return mrow(e,false);}).join("")+'</div>';
    }).join("");
    var un=S.expenses.filter(function(e){ return !dayById(e.day); });
    if(un.length){ var s2=0; un.forEach(function(e){s2+=+e.a||0;});
      groups+='<div class="mgrp"><h3>未指定日期<small>'+amtLine(s2)+'</small></h3>'+un.map(function(e){return mrow(e,false);}).join("")+'</div>'; }
  }
  return head+seg+(S.mgroup==="cat"?bars:"")+groups;
}
var WHOPAL=["#C04C36","#4E7A8C","#9C7A2E","#6B5C9E","#B4557E","#A8683F"];
function people(){ return (S.people&&S.people.length)?S.people:[{id:"a",n:"我"}]; }
function whoOf(e){
  var w=e.w||"both";
  return people().some(function(x){ return x.id===w; }) ? w : "both";
}
/* 共同排最前面，其他人照設定順序 */
function WHOS(){
  var L=[{k:"both",n:"共同",c:"#5C7A56"}];
  people().forEach(function(x,i){ L.push({k:x.id,n:x.n,c:WHOPAL[i%WHOPAL.length]}); });
  return L;
}
function whoName(k){ var L=WHOS(); for(var i=0;i<L.length;i++) if(L[i].k===k) return L[i].n; return "共同"; }
function newPersonId(){ var k; do{ k="p"+uid().slice(0,4); }while(people().some(function(x){return x.id===k;})); return k; }
function mrow(e,byCat){
  var C=cat(e.c), d=dayById(e.day);
  var sub = byCat ? (d?d.date+"（"+d.dow+"）":"未指定日期") : C.n;
  sub = sub+"　"+whoName(whoOf(e));
  return '<div class="mrow">'+
    '<button class="mhit" data-editex="'+e.id+'" aria-label="編輯這筆">'+
      '<span class="dot" style="background:'+catColor(C)+'"></span>'+
      '<span class="mn"><b>'+esc(e.n||C.n)+'</b><small>'+esc(sub)+'</small></span>'+
      '<span class="mv"><b>'+amtMain(+e.a||0)+'</b><small>'+amtSub(+e.a||0)+'</small></span>'+
    '</button>'+
    '<button class="mx" data-delex="'+e.id+'">✕</button></div>';
}

/* 時間欄位：轉滑輪的過程不動，等離開欄位（按完成／點別處）才套用一次 */
function onTime(inp,apply){
  var start=inp.value, done=false;
  function commit(){
    if(done) return;
    if(inp.value===start) return;
    done=true; apply(inp.value);
  }
  inp.addEventListener("blur",commit);
  inp.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); inp.blur(); } });
}

/* ================= 拖曳排序 ================= */
function sortable(box,sel,onEnd,holdMs){
  var el=null,sy=0,hold=null,py=0,auto=null;
  function items(){ return $$(sel,box); }
  /* 拖到畫面上下緣時自動捲動，這樣才能從最底下一路拉到最上面 */
  function autoScroll(){
    if(!el){ auto=null; return; }
    var top=90, bot=window.innerHeight-120, sp=0;
    if(py<top) sp=-Math.min(26,Math.ceil((top-py)/4)+4);
    else if(py>bot) sp= Math.min(26,Math.ceil((py-bot)/4)+4);
    if(sp){
      var y0=window.scrollY;
      window.scrollBy(0,sp);
      var moved=window.scrollY-y0;
      if(moved){ sy-=moved; el.style.transform="translateY("+(py-sy)+"px)"; reorder(); }
    }
    auto=requestAnimationFrame(autoScroll);
  }
  box.addEventListener("pointerdown",function(e){
    var t=e.target.closest(sel); if(!t) return;
    if(e.target.closest("[data-grip]")){ e.preventDefault(); begin(t,e.clientY); return; }
    if(holdMs==null) return;
    if(e.target.closest("[contenteditable],button,a,input,summary,details")) return;
    hold=setTimeout(function(){ begin(t,e.clientY); },holdMs);
    var clr=function(){ clearTimeout(hold); };
    document.addEventListener("pointerup",clr,{once:true});
    document.addEventListener("pointercancel",clr,{once:true});
    document.addEventListener("pointermove",clr,{once:true});
  });
  function begin(t,y){
    el=t; sy=y; py=y; el.classList.add("dragging");
    el.style.position="relative"; el.style.zIndex="30"; el.style.transition="none";
    document.body.style.userSelect="none";
    if(navigator.vibrate) navigator.vibrate(10);
    document.addEventListener("pointermove",move,{passive:false});
    document.addEventListener("pointerup",up,{once:true});
    document.addEventListener("pointercancel",up,{once:true});
    if(!auto) auto=requestAnimationFrame(autoScroll);
  }
  function reorder(){
    var r=el.getBoundingClientRect(), mid=r.top+r.height/2, list=items();
    for(var i=0;i<list.length;i++){
      var o=list[i]; if(o===el) continue;
      var q=o.getBoundingClientRect();
      if(mid>q.top&&mid<q.bottom){
        var before=list.indexOf(o)<list.indexOf(el);
        var he=el.closest(".row")||el, ho=o.closest(".row")||o;
        if(before) ho.parentNode.insertBefore(he,ho); else ho.parentNode.insertBefore(he,ho.nextSibling);
        sy=py; el.style.transform="translateY(0px)";
        if(navigator.vibrate) navigator.vibrate(6);
        break;
      }
    }
  }
  function move(e){
    if(!el) return; e.preventDefault();
    py=e.clientY;
    el.style.transform="translateY("+(py-sy)+"px)";
    reorder();
  }
  function up(){
    if(!el) return;
    document.removeEventListener("pointermove",move);
    if(auto){ cancelAnimationFrame(auto); auto=null; }
    el.classList.remove("dragging");
    el.style.transform=""; el.style.position=""; el.style.zIndex=""; el.style.transition="";
    document.body.style.userSelect="";
    var order=items().map(function(n){return n.dataset.id;});
    el=null; onEnd(order);
  }
}

function noEnter(sel){ $$(sel).forEach(function(n){ n.addEventListener("keydown",function(e){ if(e.key==="Enter"){ e.preventDefault(); n.blur(); } }); }); }
function secById(id){ for(var i=0;i<S.info.sections.length;i++) if(S.info.sections[i].id===id) return S.info.sections[i]; return null; }
function memoById(id){ for(var i=0;i<S.memo.length;i++) if(S.memo[i].id===id) return S.memo[i]; return null; }

function wire(){
  /* 行程卡：標題 / 地點 */
  onBlur("[data-ed]",function(n){
    var f=findItem(n.dataset.id); if(!f) return;
    var was=f.it[n.dataset.ed];
    f.it[n.dataset.ed]=txt(n);
    if(was===f.it[n.dataset.ed]){ save(); return; }
    /* 站名或地點改了，前後兩段交通要跟著換，能查到路線就直接帶入 */
    syncTransits(f.d); save(); render();
  });
  noEnter("[data-ed]");
  /* 頁首大標 */
  onBlur("[data-meta]",function(n){ S.meta[n.dataset.meta]=txt(n); save(); });
  noEnter('[data-meta="title"]');
  /* 日標題 */
  onBlur("[data-day]",function(n){ S.days[di][n.dataset.day]=txt(n); save(); });
  noEnter('[data-day="title"]');
  /* 註解：Enter 新增一行、空白 Backspace 刪除 */
  $$("[data-note]").forEach(function(n){
    n.addEventListener("blur",function(){
      var p=n.dataset.note.split(":"), f=findItem(p[0]); if(!f) return;
      var old=f.it.notes[+p[1]]||"", pre=(old.charAt(0)==="!"||old.charAt(0)===":")?old.charAt(0):"";
      f.it.notes[+p[1]]=pre+txt(n); save();
    });
    n.addEventListener("input",function(){
      var box=n.closest("li")||n;
      if(txt(n).trim()) box.classList.remove("blank"); else box.classList.add("blank");
    });
    n.addEventListener("keydown",function(e){
      var p=n.dataset.note.split(":"), f=findItem(p[0]); if(!f) return;
      if(e.key==="Enter"){ e.preventDefault(); n.blur();
        f.it.notes.splice(+p[1]+1,0,""); save(); render();
        var next=$('[data-note="'+p[0]+':'+(+p[1]+1)+'"]'); if(next) next.focus(); }
      if(e.key==="Backspace"&&!txt(n).trim()&&f.it.notes.length>1){ e.preventDefault();
        f.it.notes.splice(+p[1],1); save(); render();
        var prev=$('[data-note="'+p[0]+':'+Math.max(0,+p[1]-1)+'"]'); if(prev) prev.focus(); }
    });
  });
  $$("[data-delnote]").forEach(function(b){ b.onclick=function(){
    var q=b.dataset.delnote.split(":"), f=findItem(q[0]); if(!f) return;
    f.it.notes.splice(+q[1],1); save(); render(); }; });
  $$("[data-addnote]").forEach(function(b){ b.onclick=function(){
    var f=findItem(b.dataset.addnote); if(!f) return;
    f.it.notes=f.it.notes||[]; f.it.notes.push(""); save(); render();
    setTimeout(function(){ var el=$('[data-note="'+f.it.id+':'+(f.it.notes.length-1)+'"]');
      if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60); }; });
  /* 交通卡 */
  onBlur("[data-tnote]",function(n){ var f=findItem(n.dataset.tnote); if(f){ f.it.note=txt(n); save(); } });
  onBlur("[data-leg]",function(n){ var p=n.dataset.leg.split(":"), f=findItem(p[0]);
    if(f){ f.it.legs[+p[1]][p[2]]=txt(n); save(); } });
  noEnter("[data-leg]");
  onBlur("[data-tr]",function(n){ var p=n.dataset.tr.split(":"), f=findItem(p[0]);
    if(f){ f.it[p[1]]=txt(n); save(); } });
  noEnter("[data-tr]");
  $$("[data-legmin]").forEach(function(b){ b.onclick=function(){
    var p=b.dataset.legmin.split(":"), f=findItem(p[0]); if(!f) return;
    askInput("這一段抓幾分鐘？","", f.it.legs[+p[1]].min, function(v){
      f.it.legs[+p[1]].min=Math.max(0,parseInt(v,10)||0); save(); render(); }, {type:"number",mode:"numeric"}); }; });
  /* 登機證 */
  onBlur("[data-fl]",function(n){ var p=n.dataset.fl.split(":"); S.flights[p[0]][p[1]]=txt(n); save(); });
  noEnter("[data-fl]");
  onBlur("[data-flm]",function(n){ var p=n.dataset.flm.split(":"); S.flights[p[0]].meta[+p[1]][1]=txt(n); save(); });
  noEnter("[data-flm]");
  /* 行前 */
  onBlur("[data-kvk]",function(n){ var q=n.dataset.kvk.split(":"), sec=secById(q[0]); if(sec){ sec.rows[+q[1]][0]=txt(n); save(); } });
  noEnter("[data-kvk]");
  $$("[data-delrow]").forEach(function(b){ b.onclick=function(){
    var q=b.dataset.delrow.split(":"), sec=secById(q[0]); if(!sec) return;
    var arr = q[1]==="after" ? sec.after : sec.rows, i=+q[2];
    if(!arr) return;
    if(sec.type==="check" && q[1]==="rows"){
      var n0=arr.length;
      for(var k=i;k<n0-1;k++){ if(S.done[sec.id+":"+(k+1)]) S.done[sec.id+":"+k]=1; else delete S.done[sec.id+":"+k]; }
      delete S.done[sec.id+":"+(n0-1)];
    }
    arr.splice(i,1); save(); render(); }; });
  $$("[data-addrow]").forEach(function(b){ b.onclick=function(){
    var sec=secById(b.dataset.addrow); if(!sec) return;
    if(sec.type==="kv") sec.rows.push(["項目","內容"]);
    else if(sec.type==="table") sec.rows.push(sec.head.map(function(){ return ""; }));
    else sec.rows.push("");
    save(); render();
    setTimeout(function(){
      var sel = sec.type==="kv" ? '[data-kv="'+sec.id+':'+(sec.rows.length-1)+'"]'
              : sec.type==="table" ? '[data-td="'+sec.id+':'+(sec.rows.length-1)+':0"]'
              : '[data-li="'+sec.id+':'+(sec.rows.length-1)+'"]';
      var el=$(sel); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60);
  }; });
  $$("[data-delbul]").forEach(function(b){ b.onclick=function(){
    var q=b.dataset.delbul.split(":"), m=memoById(q[0]); if(!m) return;
    m.b.splice(+q[1],1); if(m.g) m.g.splice(+q[1],1);
    if(!m.b.length){ m.b=[""]; m.g=[""]; } save(); render(); }; });
  $$("[data-addbul]").forEach(function(b){ b.onclick=function(){
    var m=memoById(b.dataset.addbul); if(!m) return;
    m.b.push(""); (m.g=m.g||[]).push(""); save(); render();
    setTimeout(function(){ var box=$('[data-memo="'+m.id+'"]'); if(box){ var xs=$$(".x",box); var last=xs[xs.length-1];
      if(last){ last.scrollIntoView({block:"center"}); last.focus(); } } },60); }; });
  onBlur("[data-kv]",function(n){ var p=n.dataset.kv.split(":"), s=secById(p[0]); if(s){ s.rows[+p[1]][1]=txt(n); save(); } });
  onBlur("[data-li]",function(n){ var p=n.dataset.li.split(":"), s=secById(p[0]); if(s){ s.rows[+p[1]]=txt(n); save(); } });
  onBlur("[data-af]",function(n){ var p=n.dataset.af.split(":"), s=secById(p[0]); if(s){ s.after[+p[1]]=txt(n); save(); } });
  onBlur("[data-td]",function(n){ var p=n.dataset.td.split(":"), s=secById(p[0]); if(s){ s.rows[+p[1]][+p[2]]=txt(n); save(); } });
  noEnter("[data-td]");
  onBlur("[data-sech]",function(n){ var s=secById(n.dataset.sech); if(s){ s.t=txt(n); save(); } });
  noEnter("[data-sech]");
  onBlur("[data-memoh]",function(n){ var m=memoById(n.dataset.memoh); if(m){ m.h=txt(n); save(); } });
  noEnter("[data-memoh]");
  $$("[data-chk]").forEach(function(b){ b.onclick=function(){
    S.done[b.dataset.chk]=!S.done[b.dataset.chk]; save(); render(); }; });

  /* 備忘錄圓點 */
  $$("[data-memo]").forEach(function(box){
    var m=memoById(box.dataset.memo);
    function sync(){
      m.b=$$(".x",box).map(function(x){return txt(x);});
      m.g=$$(".bul",box).map(function(n){return n.dataset.geo||"";});
      save(); }
    box.addEventListener("input",function(e){
      var b=e.target.closest(".bul");
      if(b) b.classList.toggle("blank", !txt(e.target).trim());
      sync();
    });
    box.addEventListener("keydown",function(e){
      var x=e.target.closest(".x"); if(!x) return;
      if(e.key==="Enter"){ e.preventDefault();
        var row=document.createElement("div"); row.className="bul";
        row.setAttribute("data-geo","");
        row.innerHTML='<span class="d">・</span><div class="x" contenteditable="true"></div>';
        x.closest(".bul").after(row); row.querySelector(".x").focus(); sync(); }
      if(e.key==="Backspace"&&!txt(x).trim()&&$$(".x",box).length>1){ e.preventDefault();
        var prev=x.closest(".bul").previousElementSibling; x.closest(".bul").remove();
        if(prev){ var p=prev.querySelector(".x"); p.focus();
          var r=document.createRange(); r.selectNodeContents(p); r.collapse(false);
          var s=getSelection(); s.removeAllRanges(); s.addRange(r); }
        sync(); }
    });
  });
  $$("[data-setg]").forEach(function(b){ b.onclick=function(){
    var q=b.dataset.setg.split(":"), m=memoById(q[0]); if(!m) return;
    var i=+q[1];
    m.g=m.g||m.b.map(function(){return "";});
    var cur=m.g[i]||String(m.b[i]||"").split(/[（(・、，,—－]/)[0].trim();
    askInput("地圖連結","要用什麼字去 Google Maps 搜尋？留空＝不加連結。",cur,function(v){
      m.g[i]=String(v||"").trim(); save(); render(); });
  }; });
  if($("#addMemo")) $("#addMemo").onclick=function(){ S.memo.push({id:uid(),h:"新標題",b:[""]}); save(); render(); };
  $$("[data-delmemo]").forEach(function(b){ b.onclick=function(){
    ask("刪除這則備忘？","裡面的內容會一起刪掉。",function(){
      S.memo=S.memo.filter(function(x){ return x.id!==b.dataset.delmemo; }); save(); render(); },"刪除",true); }; });
  $$("[data-addmemo]").forEach(function(b){ b.onclick=function(){
    var at=S.memo.length; S.memo.forEach(function(x,i){ if(x.id===b.dataset.addmemo) at=i+1; });
    var m={id:uid(),h:"新標題",b:[""]};
    S.memo.splice(at,0,m); save(); render();
    setTimeout(function(){ var el=$('[data-memoh="'+m.id+'"]'); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60); }; });
  var ml=$("#memoList");
  if(ml) sortable(ml,".memo",function(order){
    S.memo.sort(function(a,b){ return order.indexOf(a.id)-order.indexOf(b.id); }); save(); render(); },null);

  /* 行前拖曳 */
  var il=$("#infoList");
  if($("#addSec0")) $("#addSec0").onclick=function(){
    S.info.sections.push({id:uid(),t:"新項目",type:"list",rows:[""]}); save(); render(); };
  if(il){
    $$("[data-delsec]").forEach(function(b){ b.onclick=function(){
      ask("刪除這個區塊？","裡面的內容會一起刪掉。",function(){
        S.info.sections=S.info.sections.filter(function(x){ return x.id!==b.dataset.delsec; }); save(); render(); },"刪除",true); }; });
    $$("[data-addsec]").forEach(function(b){ b.onclick=function(){
      var at=0; S.info.sections.forEach(function(x,i){ if(x.id===b.dataset.addsec) at=i+1; });
      var ns={id:uid(),t:"新項目",type:"list",rows:[""]};
      S.info.sections.splice(at,0,ns); save(); render();
      setTimeout(function(){ var el=$('[data-sech="'+ns.id+'"]'); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60); }; });
  }
  if(il) sortable(il,".sec",function(order){
    S.info.sections.sort(function(a,b){ return order.indexOf(a.id)-order.indexOf(b.id); }); save(); render(); },null);

  /* 行程互動 */
  var tl=$("#tl");
  if(tl){
    sortable(tl,".card[data-drag]",function(order){
      var d=S.days[di], slots=[], spots=[];
      d.items.forEach(function(it,i){ if(it.k==="spot"){ slots.push(i); spots.push(it); } });
      spots.sort(function(a,b){ return order.indexOf(a.id)-order.indexOf(b.id); });
      slots.forEach(function(s,k){ d.items[s]=spots[k]; });
      syncTransits(d);
      save(); render(); flag("順序已更新，請確認交通"); },380);

    $$("[data-pick]").forEach(function(b){ b.onclick=function(){
      S.pick[b.dataset.pick]=b.dataset.t;
      var tid=b.dataset.pick.split(":")[0], d=S.days[di], idx=-1;
      d.items.forEach(function(x,i){ if(x.id===tid) idx=i; });
      clearAfter(d,idx); save(); render(); }; });
    /* 出發：時間滑輪（轉完、關掉滑輪離開欄位才套用，中途不會一直跳） */
    $$("[data-dep]").forEach(function(b){ onTime(b,function(v){
      if(!v) delete S.pick[b.dataset.dep]; else S.pick[b.dataset.dep]=v;
      var tid=b.dataset.dep.split(":")[0], d=S.days[di], idx=-1;
      d.items.forEach(function(x,i){ if(x.id===tid) idx=i; });
      clearAfter(d,idx); save(); render(); }); });
    $$("[data-cleardep]").forEach(function(b){ b.onclick=function(){
      delete S.pick[b.dataset.cleardep];
      var tid=b.dataset.cleardep.split(":")[0], d=S.days[di], idx=-1;
      d.items.forEach(function(x,i){ if(x.id===tid) idx=i; });
      clearAfter(d,idx); save(); render(); }; });
    /* 抵達：釘住這一站 */
    /* 設抵達：先把「目前的離開時間」釘住，這樣調整的是可停留，不是離開 */
    $$("[data-arr]").forEach(function(b){ onTime(b,function(v){
      var id=b.dataset.arr, c0=compute(S.days[di])[id];
      if(c0 && !S.leave[id]) S.leave[id]=hm(c0.leave);
      if(!v) delete S.anchor[id]; else S.anchor[id]=v;
      save(); render(); }); });
    /* 離開：換算成停留長度，並讓後面那段交通重新抓班次（不然離開時間會彈回去） */
    /* 設離開：直接釘住這個時間，抵達不動，可停留自己算 */
    $$("[data-lv]").forEach(function(b){ onTime(b,function(v){
      var id=b.dataset.lv, d=S.days[di];
      if(!v) delete S.leave[id]; else S.leave[id]=v;
      var idx=-1; d.items.forEach(function(x,i){ if(x.id===id) idx=i; });
      clearAfter(d,idx);
      save(); render(); }); });
    $$("[data-unlv]").forEach(function(b){ b.onclick=function(){
      delete S.leave[b.dataset.unlv]; save(); render(); }; });
    $$("[data-unanchor]").forEach(function(b){ b.onclick=function(){
      delete S.anchor[b.dataset.unanchor]; save(); render(); }; });
    /* 去過了 */
    $$("[data-tick]").forEach(function(b){ b.onclick=function(){
      var id=b.dataset.tick;
      if(S.visited[id]) delete S.visited[id]; else S.visited[id]=1;
      save(); render(); }; });
    $$("[data-addphoto]").forEach(function(b){ b.onclick=function(){ pickPhoto(b.dataset.addphoto); }; });
    $$("[data-photo]").forEach(function(b){ b.onclick=function(){ openLb(b.dataset.photo); }; });
    $$("[data-insert]").forEach(function(b){ b.onclick=function(){ addStop(S.days[di], b.dataset.insert); }; });
    $$("[data-delspot]").forEach(function(b){ b.onclick=function(){
      var f=findItem(b.dataset.delspot), id=b.dataset.delspot;
      ask("刪除「"+((f&&f.it.t)||"這一站")+"」？","前後的交通會自動接起來。",function(){
        delSpot(S.days[di], id); },"刪除",true); }; });
    $$("[data-icopen]").forEach(function(b){ b.onclick=function(){ if(EDIT) sheetIcon(b.dataset.icopen); }; });
    $$("[data-addleg]").forEach(function(b){ b.onclick=function(){
      var f=findItem(b.dataset.addleg); if(!f) return;
      f.it.legs.push({k:"walk",ic:"walk",text:"步行",min:5}); save(); render(); }; });
    $$("[data-delleg]").forEach(function(b){ b.onclick=function(){
      var p=b.dataset.delleg.split(":"), f=findItem(p[0]); if(!f||f.it.legs.length<2) return;
      f.it.legs.splice(+p[1],1);
      f.it.legs.forEach(function(lg,i){ delete S.pick[rideKey(f.it.id,i)]; });
      save(); render(); }; });
    $$("[data-expandtr]").forEach(function(b){ b.onclick=function(){
      var id=b.dataset.expandtr;
      if(expandTr[id]) delete expandTr[id]; else expandTr[id]=1;
      render(); }; });
    $$("[data-alt]").forEach(function(b){ b.onclick=function(){
      var q=b.dataset.alt.split(":"); switchAlt(S.days[di],q[0],+q[1]); }; });
    $$("[data-restr]").forEach(function(b){ b.onclick=function(){ restoreOneTransit(S.days[di],b.dataset.restr); }; });
    $$("[data-okchk]").forEach(function(b){ b.onclick=function(){
      var f=findItem(b.dataset.okchk); if(f){ delete f.it.chk; save(); render(); } }; });
    $$("[data-hush]").forEach(function(b){ b.onclick=function(){
      S.hush[b.dataset.hush]=1; save(); render(); }; });
    /* 時刻表：把要搭的那班擺在最左邊，已過的往左滑才看得到 */
    $$(".times").forEach(function(box){
      var n=box.querySelector(".tb.now")||box.querySelector(".tb:not(.past)"); if(!n) return;
      box.scrollLeft += n.getBoundingClientRect().left - box.getBoundingClientRect().left - 2;
    });
    $$("[data-shift]").forEach(function(b){ b.onclick=function(){ shiftTransit(S.days[di],b.dataset.shift); }; });
    $$("[data-ext]").forEach(function(b){ b.onclick=function(){ extendSpot(S.days[di],b.dataset.ext); }; });
  }

  /* 花費頁 */
  if($("#addStop")) $("#addStop").onclick=function(){ addStop(S.days[di], null); };
  if($("#mAdd")) $("#mAdd").onclick=sheetAdd;
  $$(".seg [data-g]").forEach(function(b){ b.onclick=function(){ S.mgroup=b.dataset.g; save(); render(); }; });
  $$("[data-curtog]").forEach(function(b){ b.onclick=function(){
    S.mshow = S.mshow==="twd" ? "jpy" : "twd"; save(); render(); }; });
  $$("[data-editex]").forEach(function(b){ b.onclick=function(){ sheetAdd(b.dataset.editex); }; });
  $$("[data-delex]").forEach(function(b){ b.onclick=function(){
    S.expenses=S.expenses.filter(function(e){ return e.id!==b.dataset.delex; }); save(); render(); }; });

  wireMast();
}

var lbCur=null;
function openLb(key){
  var p=key.split(":"), arr=S.photos[p[0]]||[], im=arr[+p[1]];
  if(!im) return;
  lbCur=key; $("#lbImg").src=im.d; $("#lb").setAttribute("open","");
}
$("#lbClose").onclick=function(){ $("#lb").removeAttribute("open"); $("#lbImg").src=""; lbCur=null; };
$("#lbDel").onclick=function(){
  if(!lbCur) return;
  var p=lbCur.split(":");
  if(S.photos[p[0]]) S.photos[p[0]].splice(+p[1],1);
  if(S.photos[p[0]] && !S.photos[p[0]].length) delete S.photos[p[0]];
  $("#lb").removeAttribute("open"); $("#lbImg").src=""; lbCur=null;
  save(); render();
};

$$(".tab").forEach(function(t){ t.onclick=function(){
  scrollMem[pageKey()]=window.scrollY; page=t.dataset.p;
  if(!EDITPAGES[page] && EDIT){ EDIT=false; vpUnlock(); }
  render(scrollMem[pageKey()]||0); }; });
$("#editBtn").onclick=function(){ setEdit(!EDIT); };
$("#daystrip").addEventListener("click",function(e){ var c=e.target.closest("[data-d]"); if(c){
  scrollMem[pageKey()]=window.scrollY; di=+c.dataset.d; render(scrollMem[pageKey()]||0); } });
$("#fab").onclick=sheetAdd;

fbLoad();
render();
var FBjoined = fbIncomingLink();
if(!FBjoined) shareIncoming();
if(fbOn()){ fbStamp(); if(!FBjoined) fbStart(); }
})();
</script>

<script>
/* 離線化：把整個 App 存進瀏覽器，之後沒網路也能開 */
(function(){
  if(!("serviceWorker" in navigator) || location.protocol==="file:" || !window.caches) return;
  var CORE="core-2027-okayama-v4"; window.OFFCORE=CORE;
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
    var el=null, shown=false;
    function pill(){
      if(el) return el;
      el=document.createElement("div");
      el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);"+
        "bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;padding:8px 15px;"+
        "border-radius:999px;font:500 13.5px/1.4 -apple-system,system-ui,sans-serif;"+
        "color:#fff;background:#4A4340;box-shadow:0 6px 18px rgba(0,0,0,.2);"+
        "opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap";
      document.body.appendChild(el); return el;
    }
    function say(t,bg,hide){
      var e=pill(); e.textContent=t; e.style.background=bg; e.style.opacity="1";
      if(hide) setTimeout(function(){ e.style.opacity="0"; },hide);
    }
    function ready(){
      return caches.open(CORE).then(function(c){ return c.match("./index.html"); });
    }
    ready().then(function(hit){
      if(hit) return;                       /* 早就存好了，不用吵使用者 */
      shown=true; say("離線內容下載中…","#4A4340",0);
      var n=0, t=setInterval(function(){
        n++;
        ready().then(function(h){
          if(h){ clearInterval(t); say("離線就緒，可以測飛航模式了 ✓","#4E7B5E",4000); }
          else if(n>60){ clearInterval(t); say("離線內容還沒存好，請保持連線重新整理","#A8442F",6000); }
        }).catch(function(){});
      },500);
    }).catch(function(){});
  });
})();
</script>
