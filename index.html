<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C04C36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="初春手帖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>岡山倉敷🍑初春手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 單一淺色主題 */
:root{
  color-scheme:light;
  --ground:#FAF6F3; --surface:#FFFDFC; --surface-2:#F2EBE7;
  --line:#E7DBD4; --line-2:#D8C4B6; --line-soft:#F1E9E4;
  --ink:#2E2521; --ink-2:#61524B; --muted:#96857D;
  --shu:#C04C36; --shu-2:#D4715B; --shu-wash:#FAEBE6;
  --clay:#9A8279; --clay-wash:#F3ECE8;
  --matsu:#5C7A56; --matsu-wash:#EBF1E9;
  --alert:#8E2C4E; --alert-wash:#FAE4EA; --red:#D6402F;
  --sora:#3E6E86;
  --shadow:0 1px 2px rgba(46,37,33,.045), 0 10px 22px -14px rgba(46,37,33,.26);
  --shadow-lg:0 12px 44px -12px rgba(46,37,33,.4);
  --r:16px; --r-sm:10px;
  --c-food:#C25A3E; --c-tran:#4E7A8C; --c-tkt:#6B5C9E; --c-gift:#A8683F;
  --c-shop:#B4557E; --c-omam:#9C7A2E; --c-misc:#6E7B72; --c-etc:#8A7C75;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.mono{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
svg{display:block}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--ground);position:relative;
  box-shadow:0 0 0 1px var(--line)}
@media (min-width:520px){body{background:var(--surface-2)}}

/* ---------- masthead：青海波 + 水引 ---------- */
.mast{position:relative;padding:22px 16px 0;overflow:hidden;border-bottom:1px solid var(--line)}
.mast::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;
  background-image:
    radial-gradient(circle at 50% 100%,
      transparent 23%, var(--clay) 23%, var(--clay) 25.2%, transparent 25.2%,
      transparent 39%, var(--clay) 39%, var(--clay) 41.2%, transparent 41.2%,
      transparent 55%, var(--clay) 55%, var(--clay) 57.2%, transparent 57.2%,
      transparent 71%, var(--clay) 71%, var(--clay) 73.2%, transparent 73.2%),
    radial-gradient(circle at 50% 100%,
      transparent 23%, var(--clay) 23%, var(--clay) 25.2%, transparent 25.2%,
      transparent 39%, var(--clay) 39%, var(--clay) 41.2%, transparent 41.2%,
      transparent 55%, var(--clay) 55%, var(--clay) 57.2%, transparent 57.2%,
      transparent 71%, var(--clay) 71%, var(--clay) 73.2%, transparent 73.2%);
  background-size:56px 28px;
  background-position:0 0, 28px 14px;
}
.mast>*{position:relative}
.eyebrow{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--clay);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.titlewrap{display:inline-block;max-width:100%;margin:7px 0 9px}
.mast h1{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:900;font-size:25px;line-height:1.25;
  margin:0;letter-spacing:.03em}
.mast p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.mast h1:focus,.mast p:focus{outline:none;background:var(--clay-wash);border-radius:5px}
.mizu{display:block;width:100%;margin:9px 0 0;height:8px;position:relative}
.mizu i{display:block;position:absolute}
.mizu .g{inset:0;border-radius:4px;background:#BFA492}
.mizu .rw{inset:1px;border-radius:3px;overflow:hidden;
  background:repeating-linear-gradient(118deg,var(--shu) 0 7px,#FFFFFF 7px 14px)}
.mtools{display:flex;gap:7px;padding:10px 0 12px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.pill svg{width:13px;height:13px}
.pill.live{background:var(--matsu-wash);border-color:color-mix(in srgb,var(--matsu) 45%,var(--line));color:var(--matsu);font-weight:500}
.pill.down{background:var(--surface);border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red);font-weight:500}
#saveflag{margin-left:auto;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted);transition:color .2s}

/* ---------- day strip ---------- */
.daystrip{display:flex;gap:6px;padding:11px 16px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:30}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:6px 12px;display:flex;flex-direction:column;min-width:0}
.dchip b{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12.5px;font-weight:500;letter-spacing:.02em}
.dchip span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.dchip[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.dchip[aria-selected="true"] span{color:rgba(255,255,255,.82)}

main{padding:16px 14px 128px;}
main.pg-itin{padding-left:10px;padding-right:10px}
main{display:flex;flex-direction:column;gap:16px;
  -webkit-user-select:text;user-select:text}   /* 內容可以長按選字複製 */
main button,main .grip,main .mk,main .tick,main .chkbox{-webkit-user-select:none;user-select:none}

/* ---------- headings ---------- */
.dayhead{padding:2px 2px 0}
.dayhead .kick{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--clay);display:flex;gap:9px;align-items:baseline}
.dayhead h2{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:700;font-size:21px;margin:6px 0 5px;letter-spacing:.03em;text-wrap:balance}
.dayhead h2:focus,.dayhead p:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.dayhead p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.prog{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;box-shadow:var(--shadow)}
.prog .pl{font-size:11px;letter-spacing:.1em;color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;flex:none}
.prog .pt{flex:1;display:block;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:0}
.prog .pf{display:block;height:100%;border-radius:5px;background:var(--matsu);transition:width .25s}
.prog .pn{flex:none;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12px;font-weight:500;color:var(--matsu)}
.prog.full .pf{background:var(--shu)}
.prog.full .pn{color:var(--shu)}
.sechead{display:flex;align-items:center;gap:10px}
.sechead h2{margin:0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;white-space:nowrap}
.sechead .rule{flex:1;height:1px;background:var(--line)}
.sechead .cnt{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted)}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:stretch}
.row[data-k="flight"]{gap:0}
.gutter{flex:none;width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px;position:relative;--mh:0px}
.row[data-k="spot"] .gutter{--mh:38px}
/* 連接線：每一列只畫「往下」那一段，離圖標固定 6px、跨越列距時上下各留 4px，
   所以每個圖標上下的留白完全一致 */
.gutter::before{content:"";position:absolute;left:calc(50% - 1px);width:0;
  border-left:2px dashed #F0E7E1;z-index:0;
  top:calc(2px + var(--mh) + 6px);bottom:-4px}
.row[data-ln="none"] .gutter::before,
.row[data-ln="end"] .gutter::before{display:none}
.row[data-ln="mid"] .gutter::before,
.row[data-ln="start"] .gutter::before{display:block}
.row:not([data-k="spot"]) .gutter::before{top:-4px}
.mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--shu)}
.mark svg{width:19px;height:19px}
.row[data-k="transit"] .mark{width:30px;height:30px;border-radius:10px;border-style:dashed;
  box-shadow:none;background:transparent;color:var(--clay)}
.row[data-k="transit"] .mark svg{width:15px;height:15px}
.gutter .gt{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10px;color:var(--muted);letter-spacing:-.02em}
.col{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px}
.card.dragging{opacity:.35}
.card.star{border-color:color-mix(in srgb,var(--shu) 45%,var(--line))}
.chead{display:flex;gap:9px;align-items:flex-start}
.chead .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.h3{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:700;font-size:16px;line-height:1.35;margin:0;
  word-break:break-word;text-wrap:balance}
.h3:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.place{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:baseline;gap:4px}
.place svg{width:11px;height:11px;flex:none;color:var(--clay);align-self:center}
.place .pv{flex:1;min-width:0;word-break:break-word}
.place .pv:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.place .pgo{flex:none;color:var(--clay);text-decoration:none;font-size:11px}

.tick{flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:2px;background:var(--ground)}
.card.done .tick{background:var(--matsu);border-color:var(--matsu);color:#fff}
.card.done{opacity:.62}
.card.done .h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rt .lv{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);
  font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;letter-spacing:.04em}
.rt .stay{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11px;font-weight:500;white-space:nowrap;
  background:var(--matsu-wash);color:var(--matsu);border-radius:6px;padding:3px 8px;border:1px dashed color-mix(in srgb,var(--matsu) 38%,transparent)}
.rt .stay:active{border-color:currentColor}
.rt .leave{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted);white-space:nowrap}
.rt .leave b{color:var(--ink-2);font-weight:500}
.rt.tight .stay{background:var(--alert-wash);color:var(--alert);border-color:color-mix(in srgb,var(--alert) 38%,transparent)}

.span{display:flex;align-items:center;gap:8px}
.span .lbl{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;text-transform:uppercase}
.span .clr{margin-left:auto;font-size:10.5px;color:var(--shu);font-weight:400}
/* 時間欄位：外觀自己畫，原生 time input 透明疊在上面 → 點下去跳出滑輪 */
.tw{position:relative;display:inline-flex;align-items:center;
  font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:14px;font-weight:500;line-height:1.25;
  background:var(--surface-2);border:1px dashed var(--shu);border-radius:8px;padding:5px 10px;color:var(--shu)}
.tw::after{content:"▾";font-size:9px;margin-left:5px;opacity:.65}
.tw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;
  background:transparent;-webkit-appearance:none;appearance:none;font-size:16px;cursor:pointer}
.tw input::-webkit-calendar-picker-indicator{opacity:0;width:100%;height:100%;position:absolute;inset:0;padding:0;margin:0}
.tw:focus-within{border-style:solid;outline:2px solid color-mix(in srgb,var(--shu) 35%,transparent);outline-offset:1px}
.tw.sm{font-size:12px;padding:3px 8px;border-color:var(--line-2);color:var(--ink-2);background:var(--surface)}
.tw.anch{border-style:solid}
.tw.bad{border-color:var(--alert);color:var(--alert);border-style:solid}

.notes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.notes li{font-size:12.5px;color:var(--ink-2);line-height:1.6;
  word-break:break-word;min-height:24px;display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
/* 行首符號：點一下可以切換（編輯模式），☐ 平常也能直接打勾 */
/* 行首符號：圓點、方框、勾勾都用 CSS 畫，按鈕裡不放文字（放了 grid 會多一格） */
.mk{flex:none;align-self:flex-start;position:relative;width:18px;height:24px;padding:0;border:0;
  background:none;display:grid;place-items:center;font-size:12px;line-height:1;color:var(--ink);
  font-family:inherit;cursor:default}
.editmode .mk{cursor:pointer}
.mk::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.mknone>.mk::before{display:none}
.mkwarn{color:var(--alert)!important}
.mkwarn>.mk{color:var(--alert);font-size:12px}
.mkwarn>.mk::before{display:none}
/* ☐：小框、垂直對齊該行文字的中線 */
.mkchk{color:var(--sora)!important}
.mkchk>.mk{cursor:pointer}
.mkchk>.mk::before{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--sora);background:none}
.mkchk.mkon{color:var(--ink)!important}
.mkchk.mkon>.mk::before{border-color:var(--ink)}
.mkchk.mkon>.mk::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;line-height:1;color:var(--ink)}
.notes li>.nt:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.notes li.blank>.mk{visibility:hidden}
.bpnotes li.blank::before{content:""}
/* 文字框的高度跟按鈕一樣，整列垂直置中 */
.notes li>.nt{flex:1;min-width:0;min-height:24px;display:flex;align-items:center;padding:1px 5px;
  -webkit-user-select:text;user-select:text}
.notes li>.grip{margin-left:0;padding:0;width:24px;height:24px;display:none;place-items:center;flex:none}
.editmode .notes li>.grip{display:grid}
.notes li>.grip svg{width:14px;height:14px}


.lnk{display:inline-flex;align-items:center;gap:4px;max-width:132px;font-size:11.5px;height:24px;
  color:var(--matsu);text-decoration:none;border:1px solid color-mix(in srgb,var(--matsu) 30%,var(--line));
  background:var(--matsu-wash);border-radius:999px;padding:0 9px;flex:none}
.lnk svg{width:11px;height:11px;flex:none}
.lnk .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 內容被清空的行，完成編輯後就不留白 */
body:not(.editmode) .notes li.blank,
body:not(.editmode) .bpnotes li.blank{display:none}
body:not(.editmode) .bul.blank{display:none}

/* ---------- 方框右下角的 ＋／✕（只在編輯模式出現） ---------- */
.boxfoot{display:none;justify-content:flex-end;align-items:center;gap:8px;margin-top:11px;padding-top:9px;
  border-top:1px dashed var(--line)}
.editmode .boxfoot{display:flex}
.bf{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  line-height:1;border:1px solid var(--line-2);background:var(--surface);color:var(--clay);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bf:active{filter:brightness(.94)}
.bf.add{color:var(--matsu);border-color:color-mix(in srgb,var(--matsu) 40%,var(--line))}
.bf.del{color:#fff;background:var(--red);border-color:var(--red)}
.boxfoot .bl{margin-right:auto;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ftrow{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-soft)}
.ftrow>svg{width:12px;height:12px;flex:none;color:var(--clay)}
.ftrow .mv{flex:none;max-width:calc(100% - 92px);font-size:12.5px;color:var(--matsu);text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--matsu) 35%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:1px}
.ftrow .mv.plain{color:var(--muted);border-bottom:0}
.ftrow .mv[contenteditable]{color:var(--ink-2);border-bottom:1px dashed var(--kin,var(--clay))}
.ftrow .mv:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.iconb{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--muted);background:var(--ground);font-size:12px}
.iconb.del{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 28%,var(--line))}
.iconb svg{width:12px;height:12px}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
.mini{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);background:var(--ground);
  display:inline-flex;align-items:center;gap:5px}
.mini svg{width:12px;height:12px}
.grip{color:var(--muted);padding:4px 2px;touch-action:none;cursor:grab;flex:none}
.ftrow .iconb{margin-left:auto}
.ftrow .grip{margin-left:6px}
.memo>.grip,.sec>.grip{margin-left:auto}
.grip svg{width:15px;height:15px}

/* ---------- transit ---------- */
.tr{background:var(--clay-wash);border:1px dashed var(--line);border-radius:13px;padding:10px 12px}
.tr .th{font-size:11.5px;color:var(--muted)}
.tr .th b{color:var(--ink-2);font-weight:500;font-size:12px;line-height:1.45;word-break:break-word}
.tr .main .fare{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;color:var(--clay);font-weight:500;white-space:nowrap}
.tr .main{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:14px;font-weight:500}
.tr .main .ar{color:var(--muted);font-size:10px}
.tr .main .tot{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:400;text-align:right;white-space:nowrap}
.legs{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}
.legs li>svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--clay)}
.legs .lg{flex:1;min-width:0}
.legs .lg b{font-weight:500;color:var(--ink)}
.legs .lg .m{color:var(--muted);font-size:11px;display:block;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.legs .lg .tm{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;color:var(--shu);font-weight:500}
.legs .lg .em{border-bottom:1px dashed var(--clay);cursor:pointer;color:var(--ink-2)}

.depbar{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.depbar.more{border-top:0;padding-top:2px;margin-top:7px}
.depbar .tlb{font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.depbar .clr{font-size:10.5px;color:var(--shu)}
.depbar .why{margin-left:auto;font-size:10.5px;color:var(--muted);text-align:right;line-height:1.35}

.times{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.times::-webkit-scrollbar{display:none}
.tb{flex:none;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12px;padding:4px 8px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.tb[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500}
.tb.past{opacity:.38;text-decoration:line-through}
.tb.now{box-shadow:0 0 0 1px var(--shu) inset}
.times.synth .tb{border-style:dashed}
.tb[aria-pressed="true"].past{opacity:1;background:var(--alert);border-color:var(--alert);color:#fff}

.conf{margin-top:9px;background:var(--alert-wash);border:1px solid color-mix(in srgb,var(--alert) 32%,transparent);
  border-radius:10px;padding:9px 10px;font-size:11.5px;color:var(--alert);line-height:1.55}
.conf{position:relative}
.conf .cx{position:absolute;top:6px;right:7px;width:22px;height:22px;border-radius:7px;display:grid;
  place-items:center;font-size:11px;color:inherit;opacity:.6;background:rgba(255,255,255,.5)}
.conf.warn2{background:var(--clay-wash);border-color:var(--line-2);color:var(--ink-2)}
.conf.warn2 .cb{background:var(--clay)}
.conf .cb{margin-top:7px;display:inline-block;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:8px;
  background:var(--alert);color:var(--surface)}

.tnote{margin-top:8px;font-size:11.5px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;
  border-left:2px solid var(--line);padding-left:9px}
.tnote:focus{outline:none;background:var(--clay-wash);border-radius:0 4px 4px 0}
.photos{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.photos::-webkit-scrollbar{display:none}
.photos .ph{flex:none;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);line-height:0}
.photos .ph img{height:82px;width:auto;max-width:150px;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:95;background:rgba(24,16,12,.95);display:none;flex-direction:column}
.lb[open]{display:flex}
.lb .lbtop{display:flex;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
.lb .lbtop button{color:#F3EAE5;font-size:13px;padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:transparent}
.lb .lbtop .rm{color:#FFB3A6;border-color:rgba(255,140,120,.5)}
.lb .lbbody{flex:1;display:grid;place-items:center;padding:6px 12px calc(18px + env(safe-area-inset-bottom));overflow:auto}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.evt{margin-top:10px;background:var(--shu-wash);border:1px solid color-mix(in srgb,var(--shu) 22%,transparent);
  border-radius:10px;padding:9px 11px}
.evt summary{font-size:11.5px;color:var(--shu);cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px;font-weight:500}
.evt summary::-webkit-details-marker{display:none}
.evt summary::before{content:"▸";font-size:9px;transition:transform .15s}
.evt[open] summary::before{transform:rotate(90deg)}
.evt ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.evt li{display:flex;gap:8px;font-size:12px;line-height:1.55;align-items:flex-start}
.evt li .et{flex:none;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11px;color:var(--shu);min-width:56px}
.evt li .en{flex:1;min-width:0;color:var(--ink-2)}
.evt li .en b{color:var(--ink);font-weight:500;display:block}
.evt .esrc{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.5}
.evt .esrc a{color:var(--clay)}
.disc{margin-top:9px}
.disc summary{font-size:11.5px;color:var(--clay);cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px}
.disc summary::-webkit-details-marker{display:none}
.disc summary::before{content:"▸";font-size:9px;transition:transform .15s}
.disc[open] summary::before{transform:rotate(90deg)}
.ttbox{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.ttbox h4{margin:0 0 7px;font-size:12px;font-weight:700;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;letter-spacing:.03em}
.ttgrid{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow:auto}
.ttr{display:flex;gap:9px;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11.5px;line-height:1.7}
.ttr .hh{flex:none;width:22px;color:var(--clay);text-align:right}
.ttr .mm{flex:1;color:var(--ink-2);word-spacing:.28em}
.ttr.hi{background:var(--shu-wash);border-radius:4px}
.ttbox .src{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.55;white-space:pre-wrap}
.ttbox .src a{color:var(--clay)}

/* ---------- 交通方案切換 ---------- */
.alts{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.alts::-webkit-scrollbar{display:none}
.altb{flex:none;min-width:132px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  padding:8px 11px;display:flex;flex-direction:column;gap:1px;text-align:left}
.altb b{font-size:12.5px;font-weight:500;color:var(--ink)}
.altb span{font-size:10.5px;color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.altb[aria-pressed="true"]{background:var(--shu-wash);border-color:var(--shu)}
.altb[aria-pressed="true"] b{color:var(--shu);font-weight:700}
.altb[aria-pressed="true"] span{color:color-mix(in srgb,var(--shu) 72%,var(--muted))}

/* 已完成的交通：收成一行 */
.trmini{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:11.5px}
.trmini>svg{width:14px;height:14px;flex:none;opacity:.7}
.trmini .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trmini .t{flex:none;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11px}
.trmini .ex{flex:none;font-size:10.5px;color:var(--clay);border:1px solid var(--line);
  border-radius:7px;padding:2px 7px}

/* ---------- boarding pass ---------- */
.bp{border-radius:var(--r);overflow:hidden;background:#fff;color:#2B2320;border:1px solid var(--line);box-shadow:var(--shadow)}
.bp .band{background:linear-gradient(100deg,#C04C36,#D4715B);color:#fff;padding:9px 14px;
  display:flex;align-items:center;justify-content:space-between;font-size:12.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:500}
.bp .band .ln{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;letter-spacing:.1em}
.bp .grid{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:17px 4px 7px}
.bp .col{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:0 2px;min-width:0}
.bp .iata{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:29px;font-weight:500;letter-spacing:.04em;line-height:1.1;color:#2B2320}
.bp .apname{font-size:12.5px;color:#8A7469;line-height:1.35}
.bp .tm{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:19px;font-weight:500;color:#C04C36;margin-top:3px}
.bp .plane{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
/* 航線：dot －虛線－ 飛機 －虛線－ 箭頭。--rg 就是「虛線與兩側的留白」，
   左右兩端往機場資訊那側各溢出 --rov，讓四段留白看起來一樣寬 */
.bp .route{--rg:13px;--rov:28px;
  display:flex;align-items:center;gap:var(--rg);
  width:calc(100% + var(--rov) * 2);margin:0 calc(var(--rov) * -1)}
.bp .rdot{flex:none;width:6px;height:6px;border-radius:50%;background:#DCCCC1}
.bp .rdash{flex:1;min-width:8px;height:2px;border-radius:1px;
  background:repeating-linear-gradient(90deg,#DCCCC1 0 2.6px,transparent 2.6px 7.4px)}
.bp .rpl{flex:none;width:31px;height:31px;display:block;color:#C04C36}
.bp .rarw{flex:none;width:9px;height:14px;display:block;color:#DCCCC1}
.bp .fno{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:15px;letter-spacing:.14em;color:#2B2320;font-weight:500}
.bp .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-top:1px dashed #DCC9BA;margin:11px 12px 0;padding:10px 0 12px}
.bp .meta div{text-align:center}
.bp .meta dt{font-size:11.5px;letter-spacing:.14em;color:#A08D81;text-transform:uppercase;margin:0}
.bp .meta dd{margin:2px 0 0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:14.5px;color:#2B2320}
.bp .foot{background:#FBF1EA;border-top:1px solid #EDDBCC;padding:10px 14px;font-size:13.5px;color:#7B6A60;line-height:1.6}
.bp [contenteditable]:focus{outline:none;background:#FBEEE6;border-radius:4px}
.bpnotes{margin:0;padding:10px 14px 13px;list-style:none;display:flex;flex-direction:column;gap:3px;
  background:#FBF1EA;border-top:1px dashed #E3CFC0}
.bpnotes li{font-size:12.5px;color:#6E5D54;line-height:1.6;padding-left:14px;position:relative;min-height:1.6em}
.bpnotes li::before{content:"・";position:absolute;left:0;color:#B79C8C}
.bpnotes li:focus{outline:none;background:#F6E4D8;border-radius:4px}

/* ---------- info page ---------- */
.info{display:flex;flex-direction:column;gap:10px}
.memolist{display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 13px;display:flex;gap:9px;align-items:flex-start}
.sec.dragging{opacity:.35}
.sec{position:relative}
.sec>.grip{position:absolute;right:11px;top:12px;margin:0;order:2}
.sec .sc{flex:1;min-width:0}
.sec h3{margin:0 0 8px;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-weight:700;font-size:14.5px;letter-spacing:.05em}
.sec h3:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.kv{display:flex;flex-direction:column;gap:5px}
.kv .r{display:flex;gap:6px;font-size:12.5px;line-height:1.6;align-items:center;min-height:24px;flex-wrap:nowrap}
.kv .r>.grip{padding:0;width:24px;height:24px;display:none;place-items:center;flex:none}
.editmode .kv .r>.grip{display:grid}
.kv .r>.grip svg{width:14px;height:14px}
.kv .r>.k{flex:none;width:52px;color:var(--muted);font-size:11.5px;word-break:break-word}
.kv .r>.k:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.kv .r>.v{flex:1;min-width:0;color:var(--ink-2);word-break:break-word}
.kv .r>.v:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;letter-spacing:.08em;
  padding:0 8px 5px 0;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:top}
.tbl td.num{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;white-space:nowrap}
.tbl td.x,.tbl th.x{width:26px;padding-right:0;text-align:right}
.tbl td:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
/* 逐列的 ✕／＋ 平常收起來，按頁首的「編輯」才出現 */
.rowx{flex:none;flex-shrink:0;width:24px;height:24px;border-radius:8px;display:none;place-items:center;
  color:var(--red);font-size:11px;line-height:1;padding:0;
  border:1px solid color-mix(in srgb,var(--red) 32%,var(--line));
  background:var(--ground);margin:0}
.rowx svg{width:11px;height:11px}
.rowx.ed{color:var(--clay);border-color:var(--line-2)}
/* ＋ 跟 ✕ 一樣大、置中 */
.addrow{display:none;justify-content:center;gap:8px;margin-top:9px}
.editmode .addrow{display:flex}
.rowadd{flex:none;width:24px;height:24px;border-radius:8px;display:none;place-items:center;
  color:var(--matsu);font-size:11px;line-height:1;padding:0;
  border:1px solid color-mix(in srgb,var(--matsu) 32%,var(--line));
  background:var(--ground);margin:0}
.rowadd svg{width:11px;height:11px}
.rowadd.lk{color:var(--clay);border-color:var(--line-2)}
.editmode .rowx{display:grid}
.bmap{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;margin:0;
  color:var(--matsu);border:1px solid color-mix(in srgb,var(--matsu) 35%,var(--line));background:var(--surface)}
.bmap svg{width:12px;height:12px}
.bmapset svg{width:11px;height:11px}
.bmapset{color:var(--muted)!important;border-color:var(--line)!important}
.bmapset.on{color:var(--matsu)!important;border-color:color-mix(in srgb,var(--matsu) 45%,var(--line))!important}
.editmode .rowadd{display:grid}
.dayfoot{display:none}
.editmode .dayfoot{display:flex}
[data-addleg],[data-delleg]{display:none}
.editmode [data-addleg]{display:inline-flex}
.editmode [data-delleg]{display:inline}
.tbl td.x,.tbl th.x{width:0;padding:0;border-bottom-color:transparent}
.editmode .tbl td.x,.editmode .tbl th.x{width:29px;padding:6px 0 6px 3px;text-align:right;border-bottom-color:var(--line-soft)}

/* ---------- 編輯模式 ---------- */
.grip{display:none}
.editmode .grip{display:block}
/* 可編輯的地方在編輯模式下給一個很淡的底，讓人知道哪裡能改 */
.editmode [contenteditable="true"]{background:color-mix(in srgb,var(--clay-wash) 55%,transparent);border-radius:4px}
.editmode .bp [contenteditable="true"]{background:#FCF3EE}
/* 時間欄位隨時都能調（含非編輯模式），所以一律保持可按的樣子 */
.mv.empty::before{content:"點這裡填地點";color:var(--muted)}
.editmode .mv[contenteditable="true"]{min-width:96px;display:inline-block}
/* 圖標：編輯模式可點著換 */
.editmode .mark[data-icopen]{border-style:dashed;border-color:var(--shu-2);cursor:pointer}
.editmode .mark[data-icopen]::after{content:"✎";position:absolute;right:-3px;bottom:-4px;font-size:9px;
  width:14px;height:14px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center}
/* 圖標選擇盤 */
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.icgrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2)}
.icgrid button svg{width:21px;height:21px}
.icgrid button[aria-pressed="true"]{background:var(--shu-wash);border-color:var(--shu);color:var(--shu)}
.after{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.after li{font-size:11.5px;color:var(--muted);line-height:1.6;display:flex;gap:4px;align-items:center;min-height:24px;flex-wrap:nowrap}
.after li>.tx{flex:1;min-width:0;min-height:24px;display:flex;align-items:center;padding:1px 5px;
  -webkit-user-select:text;user-select:text}
.after li>.grip{padding:0;width:24px;height:24px;display:none;place-items:center;flex:none}
.editmode .after li>.grip{display:grid}
.after li>.grip svg{width:14px;height:14px}
.after li .tx{flex:1;min-width:0;word-break:break-word}
.after li:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.chk{display:flex;flex-direction:column;gap:2px}
.chkrow{display:flex;gap:4px;align-items:center;font-size:12.5px;line-height:1.6;min-height:24px;flex-wrap:nowrap}
.chkbox{flex:none;align-self:flex-start;margin-top:4px;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);margin:0;
  display:grid;place-items:center;color:transparent;font-size:10px}
.chkrow.done .chkbox{background:var(--matsu);border-color:var(--matsu);color:#fff}
.chkrow.done .ct{color:var(--muted);text-decoration:line-through}
.ct{flex:1;min-width:0;color:var(--ink-2);word-break:break-word}
.ct:focus{outline:none;background:var(--clay-wash);border-radius:4px}

/* ---------- money page ---------- */
.total{position:relative;background:var(--surface-2);border-radius:12px;padding:11px 56px 13px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.total .tlb{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.total .amt{display:flex;flex-direction:column;align-items:center;gap:1px}
.total .amt b{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:23px;font-weight:500;color:var(--ink)}
.total .amt small{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12.5px;color:var(--ink-2)}
.curtog{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--clay);display:grid;place-items:center}
.curtog svg{width:19px;height:19px}
.curtog:active{background:var(--surface-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:8px 6px;font-size:12.5px;text-align:center;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--shu);color:#fff;font-weight:500}
.mgrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mgrp>h3{margin:0;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:13px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.mgrp>h3 .sw{width:9px;height:9px;border-radius:3px;flex:none}
.mgrp>h3 small{margin-left:auto;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11.5px;color:var(--ink-2);font-weight:400;letter-spacing:0}
.mrow{display:flex;gap:9px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow .dot{width:8px;height:8px;border-radius:3px;flex:none}
.mrow .mn{flex:1;min-width:0}
.mrow .mn b{display:block;font-size:13px;font-weight:400;word-break:break-word}
.mrow .mn small{font-size:10.5px;color:var(--muted)}
.mrow .mv{text-align:right;flex:none}
.mrow .mv b{display:block;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:13.5px;font-weight:500}
.mrow .mv small{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted)}
.mrow .mx{flex:none;color:var(--muted);font-size:13px;padding:2px 3px}
.bars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:13px}
.bar{display:flex;align-items:center;gap:9px;font-size:12px}
.bar .bl{flex:none;width:76px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{flex:1;display:block;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .bfill{display:block;height:100%;border-radius:5px}
.flh{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.curin{display:flex;gap:6px}
.curin button{flex:1;font-size:12.5px;padding:8px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);text-align:center}
.curin button[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.mhit{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:0}
.mhit:active{opacity:.6}
.split{display:flex;gap:8px;margin-top:10px}
.split .sp{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.split .sp .n{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .sp b{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:14px;font-weight:500}
.split .sp small{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10px;color:var(--matsu)}
.split .sp.co b{color:var(--clay)}
.bar .bv{flex:none;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11.5px;width:64px;text-align:right}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}

/* ---------- memo ---------- */
.memo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;position:relative}
.memo>.grip{position:absolute;right:11px;top:12px;margin:0}
.memo h2{margin:0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:19px;font-weight:900;letter-spacing:.04em;
  border-bottom:2px solid var(--shu);padding-bottom:6px;display:inline-block;line-height:1.35}
.memo h2:focus{outline:none;background:var(--clay-wash)}
.buls{margin:11px 0 0;display:flex;flex-direction:column;gap:1px}
.bul{display:flex;gap:4px;align-items:center;min-height:24px;flex-wrap:nowrap}
.bul .rowx{margin:0}
.bul>.grip,.chkrow>.grip,.tbl .grip{padding:0;width:24px;height:24px;display:none;place-items:center;flex:none}
.editmode .bul>.grip,.editmode .chkrow>.grip,.editmode .tbl .grip{display:grid}
.bul>.grip svg,.chkrow>.grip svg,.tbl .grip svg{width:14px;height:14px}
.tbl td.x{white-space:nowrap}
.editmode .tbl td.x{width:58px;display:flex;gap:4px;align-items:center;justify-content:flex-end}

.bul .x{flex:1;font-size:13.5px;line-height:1.6;min-height:24px;display:flex;align-items:center;
  -webkit-user-select:text;user-select:text;
  padding:1px 5px;word-break:break-word}
.bul .x:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.bul .x:empty::before{content:"輸入重點，按 Enter 換下一點";color:var(--muted)}

/* ---------- overview ---------- */
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ov>h3{margin:0;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:13.5px;letter-spacing:.05em;display:flex;gap:8px;align-items:baseline}
.ov>h3 small{margin-left:auto;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.ovr{display:flex;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line-soft);align-items:center}
.ovr:last-child{border-bottom:0}
.ovr .i{flex:none;width:16px;color:var(--shu)}
.ovr .i svg{width:14px;height:14px}
.ovr .t{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12px;flex:none;width:92px;letter-spacing:-.02em}
.ovr .n{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr.mv{background:var(--clay-wash)}
.ovr.mv .i{color:var(--clay)}
.ovr.mv .n,.ovr.mv .t{color:var(--muted);font-size:11.5px}

/* ---------- fab / sheet / tabbar ---------- */
.fabrow{position:fixed;right:calc(50% - 240px + 14px);bottom:calc(86px + env(safe-area-inset-bottom));z-index:45;
  display:flex;align-items:center;gap:8px}
.fab{height:46px;padding:0 16px;border-radius:999px;background:var(--shu);color:#fff;font-weight:700;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:6px;touch-action:manipulation}
.fab-ed{width:46px;height:46px;padding:0;justify-content:center;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
.fab-ed svg{width:22px;height:22px}
.fab-ed.on{background:var(--matsu);border-color:var(--matsu);color:#fff}
@media (max-width:511px){.fabrow{right:14px}}

/* ---------- 自製對話框（Artifact 沙箱擋掉原生 confirm／prompt） ---------- */
.dlg{position:fixed;inset:0;z-index:95;display:none}
.dlg[open]{display:block}
.dlg .scrim{position:absolute;inset:0;background:rgba(30,20,16,.5)}
.dlg .dpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 44px);max-width:340px;
  background:var(--ground);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:16px;font-weight:700;letter-spacing:.03em}
.dlg p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.dlg p:empty,.dlg #dlgF:empty{display:none}
.dlg .dbtns{display:flex;gap:8px;margin-top:4px}
.dlg .dbtns .bigbtn{flex:1}
.dlg.noCancel .dbtns [data-dclose]{display:none}
.dlg .bigbtn.danger{background:var(--red)}

.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet[open]{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(30,20,16,.5)}
.sheet .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--ground);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);border:1px solid var(--line);border-bottom:0;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translate(-50%,20px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .ph h3{margin:0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:16px;font-weight:700;letter-spacing:.04em;flex:1}
.sheet .pb{padding:14px 16px calc(20px + env(safe-area-inset-bottom));overflow:auto;display:flex;flex-direction:column;gap:12px}
.icb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface);flex:none;font-size:13px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);letter-spacing:.08em}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.inp.bk{min-height:150px;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12px;line-height:1.5;word-break:break-all;resize:vertical}
.inp:focus{outline:none;border-color:var(--shu)}
.bigjpy{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:24px;font-weight:500}
.twdline{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12.5px;color:var(--matsu)}
.catsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cs.newc{color:var(--clay);border-style:dashed}
.cs.mgc{color:var(--red);border-color:color-mix(in srgb,var(--red) 32%,var(--line))}
.seg.wrap{flex-wrap:wrap;border:0;background:none;gap:6px}
.seg.wrap>button{border:1px solid var(--line);border-radius:999px;background:var(--surface);
  padding:6px 14px;font-size:12.5px;flex:none}
.seg.wrap>button[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.whoset{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.whoset .wlb{font-size:11px;color:var(--muted);letter-spacing:.08em;flex:none}
.wc{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);padding:4px 6px 4px 12px}
.wc .wn{font-size:12.5px;color:inherit;font-weight:500}
.wc .wx{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;color:var(--muted);background:var(--surface-2)}
.wadd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  border:1px dashed var(--line-2);color:var(--clay);background:transparent}
.cs .csx{display:none;margin-left:3px;margin-right:-4px;width:16px;height:16px;border-radius:50%;
  background:var(--red);color:#fff;font-size:9px;line-height:16px;text-align:center;flex:none}
.catsel.mg .cs .csx{display:inline-block}
.cs{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);
  background:var(--surface);display:inline-flex;align-items:center;gap:5px}
.cs .dot{width:7px;height:7px;border-radius:2px}
.cs[aria-pressed="true"]{border-color:currentColor;font-weight:500}
.bigbtn{width:100%;background:var(--shu);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-align:center}
.bigbtn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(2px + env(safe-area-inset-bottom));z-index:50;
  width:calc(100% - 24px);max-width:456px;padding:6px;border-radius:999px;
  background:rgba(255,253,252,.82);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
  border:1px solid rgba(231,219,212,.7);box-shadow:0 10px 30px -10px rgba(46,37,33,.28),0 2px 6px rgba(46,37,33,.06);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;color:var(--ink);border-radius:999px;
  transition:background .16s ease-out}
.tab svg{width:21px;height:21px}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:.02em}
.tab[aria-selected="true"]{background:rgba(46,37,33,.07);color:var(--shu)}

.hint,.perhead{font-size:11.5px;color:var(--muted);line-height:1.65;padding:0 2px}
.perhead b{color:var(--ink-2);font-weight:500}
.hint b{color:var(--ink-2);font-weight:500}
.addb{width:100%;border:1px dashed var(--line);border-radius:var(--r-sm);padding:11px;color:var(--muted);
  font-size:12.5px;background:transparent;text-align:center}
.dayfoot{display:flex;gap:8px}
.dayfoot .addstop{flex:1}
.addstop{width:100%;border:1px dashed var(--line-2);border-radius:12px;padding:12px;color:var(--clay);
  font-size:12.5px;background:var(--surface);text-align:center;margin-top:2px}
.addstop:active{background:var(--clay-wash)}
.foot{font-size:11px;color:var(--muted);line-height:1.7;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}

/* ==================== 2026/11：插圖、行事曆、地圖、時間軸 ==================== */
/* 頁首：標題＋插圖 */
.brandrow{display:flex;align-items:flex-end;gap:8px}
.brandrow .titlewrap{flex:0 1 auto;min-width:0}
.brandrow .brandart{margin-left:auto}
.brandart{flex:none;width:48px;height:auto;margin:0 -4px 4px auto;overflow:hidden}
@media (max-width:380px){.brandart{width:42px}}
.ba-boat{animation:bobBig 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
/* 桃子船畫在縮小 0.74 倍的座標裡，位移 4.2＝實際約 3px */
@keyframes bobBig{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(4.2px) rotate(2deg)}}
.ba-waves{animation:wave 4s linear infinite}
.ba-water{animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
.ba-crane{animation:glide 8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(3px) rotate(1deg)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(12px)}}
@keyframes glide{0%,100%{transform:translate(0,0)}50%{transform:translate(-2px,1.5px)}}

/* 頁首：太陽慢慢轉；桃太郎一行人由左走到右（約 18 秒走完一趟） */
.mt-rays{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes spin{to{transform:rotate(360deg)}}
/* （舊的走路隊伍樣式已移除：.pt、.lg 等通用名稱會讓「今日進度」進度條和交通卡跟著晃） */
/* 登機證左右滑 */
.fcar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  padding:2px 0 10px;margin-bottom:-8px;overscroll-behavior-x:contain}
.fcar::-webkit-scrollbar{display:none}
.fslide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.fdots{display:flex;justify-content:flex-end;gap:6px;padding:0 12px 11px;background:#FBF1EA}
.bpnotes+.fdots{margin-top:-4px}
.fdot{font-size:11px;line-height:1;padding:5px 11px;border-radius:999px;border:1px solid #E3CFC0;color:#8A7469;background:#FFFDFB}
.fdot[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500}

/* 日期列：小圖＋水道＋滑動的小船 */
.daystrip{padding:11px 16px}
.dchip{flex-direction:row;align-items:center;gap:7px;padding:5px 12px 5px 6px}
.dchip .dayart{width:36px;height:27px;flex:none;background:#FFFDFC;border-radius:8px}
/* 日期列：三個按鈕平均撐滿整排、內容置中 */
.daystrip{overflow-x:visible}
.daystrip .dchip{flex:1 1 0;min-width:0;justify-content:center;padding:5px 6px}
.daystrip .dtx{min-width:0}
@media (max-width:400px){.daystrip .dchip .dayart{width:30px;height:23px}.daystrip .dchip{gap:5px}.daystrip .dtx span{font-size:9.5px}}
/* 今日進度：桃子跟著進度往前 */
.prog .ptw{flex:1;position:relative;display:block;min-width:0;margin:0 4px 0 2px}
.prog .ptw .pt{display:block;width:100%}
.prog .peachmk{position:absolute;top:50%;transform:translate(-50%,-54%);width:23px;height:23px;line-height:0;transition:left .35s ease-out;
  filter:drop-shadow(0 1px 1px rgba(46,37,33,.2));pointer-events:none}
.prog .peachsvg{width:23px;height:23px;display:block}
.dtx{display:flex;flex-direction:column;min-width:0}
.dchip.bounce{animation:dbounce .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes dbounce{0%{transform:none}40%{transform:translateY(-3px) scale(1.04)}100%{transform:none}}
.dwater{position:absolute;left:0;bottom:3px;height:9px;pointer-events:none;
  background:linear-gradient(#D7EAF3,#D7EAF3) 0 100%/100% 3px no-repeat}
.dboat{position:absolute;left:0;bottom:-1px;width:28px;height:16px;will-change:transform}
.dboat.go{transition:transform .55s cubic-bezier(.34,1.25,.64,1)}
.miniboat{width:28px;height:16px;animation:bob 4s ease-in-out infinite;transform-origin:50% 100%}

/* 行程頁工具列 */
.itbar{display:flex;align-items:center;gap:8px}
.seg2,.seg3{display:inline-flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px}
.seg2 button,.seg3 button{padding:5px 14px;border-radius:8px;font-size:12.5px;color:var(--ink-2);text-align:center}
.seg3{display:flex}.seg3 button{flex:1;padding:5px 6px}
.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{background:var(--surface);color:var(--shu);font-weight:700;box-shadow:var(--shadow)}
.maptog{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.maptog svg{width:14px;height:14px;color:var(--shu)}
.maptog[aria-expanded="true"]{border-color:color-mix(in srgb,var(--shu) 40%,var(--line));color:var(--shu)}
.chev{width:7px;height:7px;border-right:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);
  display:inline-block;flex:none;transition:transform .16s ease-out;opacity:.75}
[aria-expanded="true"]>.chev{transform:rotate(-135deg) translate(-2px,-2px)}
#mappanel:empty{display:none}

/* 地圖 */
.mapp{display:flex;flex-direction:column;gap:8px}
.mapbox{position:relative;height:250px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#EEECE9;
  touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.mapbox:active{cursor:grabbing}
.mlayer{position:absolute;inset:0;transform-origin:0 0}
.mlayer .tile{position:absolute;max-width:none;filter:saturate(1.9) brightness(1.02);pointer-events:none}
.msvg{position:absolute;left:0;top:0;overflow:visible}
.msvg path[data-mseg]{cursor:pointer}
.mspot{cursor:pointer}
.mnum{font:700 10px "Chiron GoRound TC","Noto Sans TC",sans-serif;fill:#fff;pointer-events:none}
.mlab{font:500 11.5px "Chiron GoRound TC","Noto Sans TC",sans-serif;fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none}
.town{font:700 12px "Chiron GoRound TC","Noto Sans TC",sans-serif;fill:#ADA29B;text-anchor:middle;letter-spacing:.25em;paint-order:stroke;stroke:#EEECE9;stroke-width:3px}
.mzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px}
.mzoom button{width:32px;height:32px;border-radius:9px;background:rgba(255,253,252,.95);border:1px solid var(--line-2);
  display:grid;place-items:center;font-size:17px;color:var(--ink-2);box-shadow:var(--shadow)}
.mgo{position:absolute;left:8px;bottom:8px;display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:5px 10px;
  border-radius:999px;background:rgba(255,253,252,.96);border:1px solid var(--line-2);color:var(--ink-2);text-decoration:none;box-shadow:var(--shadow)}
.mgo svg{width:12px;height:12px;color:var(--shu)}
.mattr{position:absolute;right:6px;bottom:5px;font-size:9px;color:#8A817C;background:rgba(255,255,255,.75);padding:0 4px;border-radius:3px;pointer-events:none}
.mchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px}
.mchips::-webkit-scrollbar{display:none}
.mchip{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px 5px 6px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.mchip i{width:18px;height:18px;border-radius:50%;color:#fff;font:700 10px/18px "Chiron GoRound TC","Noto Sans TC",sans-serif;text-align:center;font-style:normal}
.mchip svg{width:13px;height:13px;color:var(--sora)}
.mchip[aria-pressed="true"]{border-color:var(--shu);background:var(--shu-wash);color:var(--shu);font-weight:500}
.mfoot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11px;color:var(--muted)}
.mleg{display:flex;gap:10px;flex-wrap:wrap}
.mleg span{display:inline-flex;align-items:center;gap:5px}
.mleg i{width:18px;height:0;border-top:3.5px solid var(--lc);border-radius:2px}
.mleg i.dash{border-top-style:dotted}
.mnote{flex:1;min-width:0;text-align:right}

/* 交通卡：精簡／展開 */
.tr.compact{padding:0}
.trhead{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;text-align:left;border-radius:13px}
.tr.open>.trhead{padding:0 0 9px;margin-bottom:2px;border-bottom:1px dashed var(--line);border-radius:0}
.editmode .trhead{cursor:default}
.segs{display:flex;align-items:center;flex:none}
.sg{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--sora)}
.sg svg{width:14px;height:14px}
.sg-walk{color:var(--muted)} .sg-bus{color:#C9822B} .sg-tram{color:#8A5BA8} .sg-plane{color:var(--clay)}
.segs .sep{width:6px;height:0;border-top:1.5px dotted var(--line-2)}
.trw{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.trw .ft{font-size:12px;color:var(--ink-2);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trm{display:flex;gap:4px 9px;align-items:baseline;flex-wrap:wrap;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11px;color:var(--muted)}
.trm b{color:var(--ink);font-size:13px;font-weight:500}
.tr.walkonly .trm b{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:12.5px;color:var(--ink-2)}
.trm .fr{color:var(--clay);font-weight:500}
.trm em{font-style:normal;font-size:9.5px;border:1px solid currentColor;padding:0 3px;border-radius:4px;margin-left:4px;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif}
.trbody>.th{margin-top:8px}
.trbody>.alts,.trbody>.conf{margin-top:8px}
.modegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.modegrid button{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 4px 9px;
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.modegrid button svg{width:22px;height:22px}
.modegrid button[aria-pressed="true"]{background:var(--shu-wash);border-color:var(--shu);color:var(--shu);font-weight:500}

/* 單日：卡片單欄，左邊空出時間軸的位置 */
.tlx{margin-left:var(--axm,46px)}
.tlx .row[data-k="flight"]{margin-left:calc(var(--axm,46px) * -1);margin-top:8px;margin-bottom:8px}
.tlx .row[data-k="flight"]:first-child{margin-top:0}
.tlx .row[data-k="flight"]:last-child{margin-bottom:0}
.tline{display:flex;align-items:flex-start;gap:7px}
.cic{flex:none;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;margin-top:-1px;
  background:var(--shu-wash);color:var(--shu)}
.cic svg{width:14px;height:14px}
.editmode .cic{outline:1.5px dashed var(--shu-2);outline-offset:1px;cursor:pointer}
.tlx .row{position:relative}
.tlx .row::after{display:none;content:"";position:absolute;inset:-5px -3px;pointer-events:none;border-radius:16px;
  opacity:calc(var(--fz,0) * .78);transition:opacity .16s ease-out;
  background:linear-gradient(to bottom,rgba(250,246,243,.96),rgba(250,246,243,.5))}
.tlx .row.below::after{background:linear-gradient(to bottom,rgba(250,246,243,.5),rgba(250,246,243,.96))}
.tlx .row>.col{transition:transform .16s ease-out;transform-origin:50% 50%}
.tlx .row.focus{z-index:2}
.tlx .row.focus>.col{transform:scale(1.05)}
@media (max-width:600px){
  .tlx .row.focus>.col{transform:scaleY(1.05)}
  .tlx .row.focus>.col>*>*{transform:scaleY(.9524)}
}
.editmode .tlx .row{filter:none}
.editmode .tlx .row::after{display:none}
.editmode .tlx .row.focus>.col,.editmode .tlx .row.focus>.col>*>*{transform:none}

/* 左側固定時間軸 */
.tlx{position:relative}
/* 時間軸放在行程欄左邊，用 sticky 跟著捲動（不靠程式追位置，就不會延遲亂跑） */
.taxw{position:absolute;left:calc(var(--axm,46px) * -1);width:var(--axm,46px);pointer-events:none;z-index:3}
.taxis{position:sticky;top:var(--axt,120px);height:var(--axh,500px);width:100%;pointer-events:none}
.taxis .bar{position:absolute;left:var(--axb,37px);top:0;bottom:0;width:5px}
.taxis .sg2{position:absolute;left:0;width:5px;border-radius:3px;background:#DDD5CF;min-height:3px;transition:background .16s ease-out}
.taxis .sg2.on{background:#BDB1A9}
.taxis .track{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:3px;background:#DDD5CF}
.taxis .grow{position:absolute;left:0;top:0;width:5px;height:0;border-radius:3px;background:#CFC4BC;transition:height .16s ease-out}
.taxis .tk.ahead,.taxis .hl.ahead{opacity:0}
.taxis .tk,.taxis .hl{transition:opacity .2s ease-out}
.taxis .lab.en{opacity:1}
.taxis .tk{position:absolute;left:-3px;width:11px;height:0;margin-top:-.6px;border-top:1.2px solid #8C807A;border-radius:1px}
/* 時間數字：系統字體＋水平壓窄，變成瘦高的數字，不卡到旁邊 */
.taxis .hl,.taxis .lab,.taxis .now b{font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums;transform:none}
.taxis .hl{position:absolute;right:13px;margin-top:-7px;font-size:12px;line-height:14px;font-weight:500;color:#A0958F;white-space:nowrap;transform-origin:100% 50%}
.taxis .lab{position:absolute;right:13px;font-size:13px;line-height:15px;font-weight:600;color:var(--ink);white-space:nowrap;transform-origin:100% 50%}
.taxis .lab.st{top:-6px}.taxis .lab.en{bottom:-6px}
.taxis .dot{position:absolute;left:-5px;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;background:#fff;
  border:2.6px solid #3E3A39;box-shadow:0 1px 3px rgba(46,37,33,.18);transition:top .16s ease-out}
.taxis .now{position:absolute;left:-3px;width:11px;height:0;border-top:2px solid var(--red);border-radius:1px}
.taxis .hl.hit{color:var(--red);font-size:16px;font-weight:700;line-height:18px;margin-top:-9px}
.taxis .now b{position:absolute;left:-30px;top:-7px;font-size:10.5px;line-height:1;font-weight:600;transform-origin:100% 50%;color:#fff;background:var(--red);
  padding:2px 3px;border-radius:4px}

/* 週行事曆 */
.wk{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 6px 10px 2px;box-shadow:var(--shadow)}
.wkhead{display:grid;grid-template-columns:36px repeat(3,1fr);gap:4px;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
.wkd{text-align:center;display:flex;flex-direction:column;align-items:center;border-radius:9px;padding:3px 0}
.wkd b{font:500 13px "Chiron GoRound TC","Noto Sans TC",sans-serif;color:var(--ink)}
.wkd span{font-size:10px;color:var(--muted);white-space:nowrap}
.wkd.on{background:var(--shu-wash)}.wkd.on b{color:var(--shu)}
.wkbody{position:relative;display:grid;grid-template-columns:36px 1fr}
.wkhours{position:relative}
.wkhours span{position:absolute;right:5px;transform:translateY(-50%);font:9.5px/1 "Chiron GoRound TC","Noto Sans TC",sans-serif;color:var(--muted)}
.wkcols{position:relative;display:grid;grid-template-columns:repeat(3,1fr);
  background-image:linear-gradient(to bottom,var(--line-soft) 1px,transparent 1px);background-repeat:repeat-y}
.wkcol{position:relative;border-left:1px solid var(--line-soft)}
.wev{position:absolute;border-radius:6px;background:color-mix(in srgb,var(--cc) 13%,#FFFFFF);border-left:3px solid var(--cc);
  padding:2px 4px 2px 4px;font-size:10.5px;line-height:1.25;overflow:hidden;color:var(--ink);cursor:pointer;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-shadow:0 0 0 1px color-mix(in srgb,var(--cc) 18%,transparent) inset}
.wev.k-transit{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--cc) 9%,#FFF) 0 5px,#FFFFFF 5px 9px);border-left-style:dotted}
.wev.k-flight{background:color-mix(in srgb,var(--cc) 16%,#FFF)}
.wev.done{opacity:.55}
.wev .wt{display:block;font:500 9.5px/1.2 "Chiron GoRound TC","Noto Sans TC",sans-serif;color:color-mix(in srgb,var(--cc) 80%,var(--ink))}
.wev .wn{display:block;font-weight:500;word-break:break-word}
.wev.short{display:flex;align-items:center;gap:4px;padding-top:0;padding-bottom:0}
.wev.short .wt{display:inline}
.wev.short .wn{display:inline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wev.thin{padding:0;border-left-width:2px;border-radius:3px}
.wev.k-spot,.wev.k-flight{z-index:2}
.wrz{position:absolute;left:22%;right:22%;bottom:0;height:11px;cursor:ns-resize;touch-action:none}
.wrz::after{content:"";position:absolute;left:30%;right:30%;bottom:3px;height:2.5px;border-radius:2px;background:var(--cc);opacity:.55}
.wev:hover .wrz::after{opacity:1}
.wev.holding::before{content:"";position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--shu);animation:holdfill 3s linear forwards}
@keyframes holdfill{to{width:100%}}
.wev.dragging,.wev.resizing{z-index:6;box-shadow:var(--shadow-lg),0 0 0 2px var(--cc) inset;opacity:.95}
.wknow{position:absolute;left:0;right:0;height:0;border-top:1.6px solid var(--red);z-index:4;pointer-events:none}
.wknow b{position:absolute;left:-36px;top:-7px;font:500 9px/1 "Chiron GoRound TC","Noto Sans TC",sans-serif;color:#fff;background:var(--red);padding:2px 3px;border-radius:4px}
.wklegend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:10px 6px 0 8px;font-size:11px;color:var(--ink-2)}
.wklegend span{display:inline-flex;align-items:center;gap:5px}
.wklegend i{width:10px;height:10px;border-radius:3px}
.wpop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line-2);border-radius:13px;box-shadow:var(--shadow-lg);
  padding:10px 12px 11px;display:flex;flex-direction:column;gap:5px}
.wpop .wph{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.wpop .wph i{width:9px;height:9px;border-radius:3px}
.wpop .wpx{margin-left:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:11px;color:var(--muted)}
.wpop h4{margin:0;font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:14.5px;line-height:1.35}
.wpop .wtm{font:500 12.5px "Chiron GoRound TC","Noto Sans TC",sans-serif;color:var(--shu)}
.wpop .wtm span{color:var(--muted);font-family:"Chiron GoRound TC","Noto Sans TC",sans-serif;font-size:11px}
.wpop .wpl{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink-2)}
.wpop .wpl svg{width:13px;height:13px;color:var(--clay);flex:none}
.wpop ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--ink-2);line-height:1.55}
.wpop .wpb{display:flex;gap:6px;margin-top:3px}
.mini.pri{background:var(--shu);border-color:var(--shu);color:#fff}
.fl{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}

@media (prefers-reduced-motion:reduce){
  .troupe{animation:none!important;left:50%;transform:translateX(-50%)}
  .ba-boat,.ba-waves,.ba-water,.ba-crane,.mt-rays,.miniboat,.dchip.bounce{animation:none!important}
  .dboat.go,.tlx .row>.col,.taxis .dot,.tlx .row,.tlx .row::after{transition:none!important}
  html{scroll-behavior:auto}
}

/* 頁首：插圖滿版，標題與紅白繩疊在插圖正中央 */
.mhero2{position:relative;margin:8px -6px 0;container-type:inline-size}
.mhero2 .heroimg{display:block;width:100%;height:auto;opacity:.9}
/* 標題放在旗子和太陽之間的空白處（字級跟著插圖寬度縮放） */
.mtitle{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap}
.mtitle .titlewrap{margin:0;pointer-events:auto}
.mtitle h1{font-size:calc(8cqw - 4px);line-height:1.15;letter-spacing:.04em}
.mtitle h1 .emo{font-size:calc(8cqw - 6px);transform:none;vertical-align:-.04em}
.mtitle .mizu{display:none}

.mast .mtools{padding:8px 0 12px}
/* （舊）左右並排版本 */
.mhero{display:flex;align-items:center;gap:14px;margin-top:7px;padding-bottom:22px}
.mleft{flex:none;max-width:62%}
.mleft .titlewrap{margin-top:0}
.mleft .mtools{padding-bottom:0}
.mright{flex:1 1 auto;min-width:0;position:relative;margin-right:-2px}
.heroimg{display:block;width:100%;height:auto}
.mright #saveflag{position:absolute;right:0;top:100%;margin:4px 0 0;font-size:10.5px;text-align:right;white-space:nowrap}
/* 頁首右下角：桃太郎一行人（不動，已改用上面的整張圖） */
.mtools{align-items:flex-end}
.mtools .pill{margin-bottom:2px}
#saveflag{margin-bottom:8px}
.mtroupe{display:inline-flex;align-items:flex-end;gap:2px;margin-left:8px;margin-top:-22px;flex:none}
.mtroupe .mt-ch{display:block;height:auto}
/* 頁首場景（已停用） */
.parade.scene{position:relative;height:auto;aspect-ratio:100/47;margin:4px -16px 0;overflow:hidden;pointer-events:none}
.scene .sc-grass{position:absolute;left:2%;right:2%;bottom:2%;height:22%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#D5E8BE 0%,#CBE2B1 60%,#BFDAA3 100%)}
.scene .sc-crowd{position:absolute;inset:0;animation:scCrowd 40s linear infinite -17s}
@keyframes scCrowd{from{transform:translateX(-90%)}to{transform:translateX(100%)}}
.scene .sc-c{position:absolute}
.scene .sc-shd{position:absolute;left:12%;right:12%;bottom:-3%;height:9%;border-radius:50%;background:#B5D296;opacity:.8}
.scene .sc-body{position:relative;animation:scBob .3s ease-in-out infinite}
.scene .sc-up{display:block;width:100%;height:auto;clip-path:inset(0 0 var(--lg,0) 0)}
.scene .sc-up.whole{clip-path:none}
.scene .sc-lgL,.scene .sc-lgR{position:absolute;left:0;top:0;width:100%;height:auto;
  transform-origin:50% calc(100% - var(--lg));animation:scLeg .6s ease-in-out infinite}
.scene .sc-lgL{clip-path:inset(calc(100% - var(--lg)) 50% 0 0)}
.scene .sc-lgR{clip-path:inset(calc(100% - var(--lg)) 0 0 50%);animation-delay:-.3s}
@keyframes scLeg{0%,100%{transform:skewX(11deg)}50%{transform:skewX(-11deg)}}
@keyframes scBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
.scene .sc-dog .sc-body{animation-duration:.24s}.scene .sc-dog .sc-lgL,.scene .sc-dog .sc-lgR{animation-duration:.48s}
.scene .sc-dog .sc-lgR{animation-delay:-.24s}
.scene .sc-bird .sc-body{animation:scFly 1.4s ease-in-out infinite}
@keyframes scFly{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14%) rotate(3deg)}}
.scene .sc-pt{position:absolute;top:-6%;width:9px;height:9px;animation:scFall 8s linear infinite}
.scene .sc-pt i{display:block;width:9px;height:7px;background:#F8C6D1;border:1px solid #EAA3B5;border-radius:80% 0 80% 0;
  animation:scSpin 2.2s ease-in-out infinite alternate}
.scene .sc-pt.leaf i{background:#A9CF8B;border-color:#86B46A}
@keyframes scSpin{from{transform:rotate(-30deg) scaleX(1)}to{transform:rotate(50deg) scaleX(.6)}}
@keyframes scFall{0%{top:-6%;transform:translateX(0);opacity:0}8%{opacity:1}50%{transform:translateX(-14px)}85%{opacity:1}100%{top:82%;transform:translateX(6px);opacity:0}}
@media (prefers-reduced-motion:reduce){.scene .sc-crowd,.scene .sc-body,.scene .sc-lgL,.scene .sc-lgR,.scene .sc-pt,.scene .sc-pt i{animation:none!important}.scene .sc-pt{display:none}.scene .sc-crowd{transform:none}}

/* 全部統一用思源黑體；數字等寬對齊 */
body{font-variant-numeric:tabular-nums}

/* 2026/11 第二十七輪 */
.cic{display:none!important}                    /* 景點卡標題前的小圖標刪除 */
.bp .bpnotes{display:none!important}            /* 登機證下方備註刪除 */
.tlx .row.focus>.col,.tlx .row.focus>.col>*>*{transform:none!important}   /* 看到的行程不放大 */
.taxis .track{background:#ECE6E1}
.taxis .sg2{background:#D4CAC3}
/* 行程頁：✎／記帳本按鈕放進內容最後面、用 sticky 黏在底部。
   捲到最底時它就停在「新增一站」下方 18px（和上方行程到「新增一站」一樣），不受 iPhone 底部工具列影響 */
/* 每一頁：右下角按鈕放在內容最後面、sticky 黏在底部；捲到底時上下留白都一樣（18px） */
main,main.pg-itin,main.pg-money{padding-bottom:calc(86px + env(safe-area-inset-bottom) - var(--binset,0px))}
main>.fabrow,main>.mfabs{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom));right:auto;
  align-self:flex-end;margin:2px 0 0 0;z-index:45}
main.pg-itin>.fabrow{margin-right:4px}
main>*:nth-last-child(2){margin-bottom:0}   /* 按鈕上面那塊不要再多留白 */

/* 今日進度跟日期列一起固定在上方 */
main.pg-itin .prog{position:sticky;top:calc(var(--dsh,72px) + 8px);z-index:20}
main.pg-itin .prog.stuck{box-shadow:0 6px 16px -6px rgba(46,37,33,.28)}   /* 黏住時懸空：跟日期列之間不填色，看得到後面的內容 */
main.pg-itin{padding-top:12px}
main.pg-itin .itbar{margin-bottom:-4px}   /* 上方 12px 留白：用底色蓋住捲上來的卡片 */
/* 飛機段：點開後只留「出發」時間 */
.tr.fl .trbody>*:not(.depbar){display:none}
.tr.fl .trbody .depbar{border-top:0;margin-top:2px}
.tr.fl .trbody .depbar .why{display:none}
/* 花費頁：右下角「切換幣別」＋「新增」圓鈕，大小形狀跟行程頁的鉛筆一樣 */
.mfabs{display:flex;align-items:center;gap:8px}
.mfabs .fab-add{width:46px;padding:0;justify-content:center}
.mfabs .fab svg{width:22px;height:22px}
.mfabs .fab-add svg{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.total{padding-left:16px;padding-right:16px}
/* 店家選單 */
.shops{margin-top:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);overflow:hidden}
.shtog{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13.5px;color:var(--ink-2);text-align:left}
.shtog svg{width:17px;height:17px;flex:none;color:var(--clay)}
.shtog span:not(.chev){flex:1}
.shlist{list-style:none;margin:0;padding:0 10px;border-top:1px solid var(--line)}
.sh{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px dashed var(--line)}
.sh:last-child{border-bottom:0}
.shck{flex:none;width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line-2);background:var(--surface);color:transparent;font-size:13px;font-weight:700;display:grid;place-items:center}
.sh.done .shck{background:var(--matsu);border-color:var(--matsu);color:#fff}
.shm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.shm b{font-size:13.5px;font-weight:500;color:var(--ink)}
.shm small{font-size:11.5px;color:var(--muted);line-height:1.5}
.sh.done .shm b{color:var(--muted);text-decoration:line-through}
.shmap,.shx{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.shmap svg,.shx svg{width:16px;height:16px}
.shmap{color:var(--matsu)}
.shadd{display:block;width:calc(100% - 20px);margin:4px 10px 10px;padding:9px;border:1px dashed var(--line-2);border-radius:10px;font-size:12.5px;color:var(--clay);background:var(--surface)}
/* 左右滑換天的小動畫 */
@keyframes swl{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-26px);opacity:.4}to{transform:none;opacity:1}}
main.swl .tlx,main.swl .dayhead{animation:swl .28s ease-out}
main.swr .tlx,main.swr .dayhead{animation:swr .28s ease-out}
/* 花費頁：地點與交通方式之間少 2px；底部留空到右下角按鈕上方 */
.mrow .mn small,.mrow .mv small{display:block;margin-top:-2px}
/* 店家選單：右邊的拖曳把手 */
.shgrip{flex:none;width:28px;height:30px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab}
.shgrip svg{width:16px;height:16px}
.sh.dragging{background:var(--surface);box-shadow:var(--shadow-lg);border-radius:10px;position:relative;z-index:5}
/* 不要左右晃：整頁不能橫向捲動（overflow:clip 不會影響 sticky） */
html,body{overflow-x:clip}
main{touch-action:pan-y pinch-zoom}
/* 行程內文：條列之間少 2px */
.notes{gap:1px}
/* 今日進度：桃太郎往右走，鬼站在終點 */
.prog .ptw{padding-right:40px}
.prog .momomk{position:absolute;top:50%;height:32px;line-height:0;transform:translate(-50%,-55%);transition:left .35s ease-out;pointer-events:none}
.prog .oni{position:absolute;right:-4px;top:50%;height:32px;line-height:0;transform:translateY(-55%);pointer-events:none}
.prog .momomk img,.prog .oni img{height:32px;width:auto;display:block;opacity:.9}
.prog .momomk,.prog .oni{position:absolute}
.prog .hurt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* 時間條：目前位置的黑圈換成桃子 */
.taxis .dot{left:-9px;width:23px;height:23px;margin-top:-12px;border:0;border-radius:0;background:none;box-shadow:none;line-height:0}
.taxis .dot svg{width:23px;height:23px;display:block;filter:drop-shadow(0 1px 1.5px rgba(46,37,33,.25))}
/* 日期鈕：動物頭像 */
.dchip .dayani{flex:none;width:42px;height:40px;display:grid;place-items:center;line-height:0}
.dchip .dayani img{max-width:42px;max-height:40px;width:auto;height:auto;display:block;opacity:.9}   /* 圓潤的 2px 白框已經畫在圖上 */
.daystrip .dchip{gap:4px;padding-left:4px;padding-right:4px}
@media (max-width:400px){.dchip .dayani{width:36px;height:34px}.dchip .dayani img{max-width:36px;max-height:34px}}
/* 交通卡：圖標在上、文字在下，圖標大 4px */
.trhead{display:grid;grid-template-columns:1fr auto;grid-template-areas:"segs chev" "trw trw";row-gap:7px;align-items:center}
.trhead>.segs{grid-area:segs}
.trhead>.trw{grid-area:trw}
.trhead>.chev{grid-area:chev;margin-right:4px}
.trhead .sg{width:29px;height:29px;border-radius:9px}
.trhead .sg svg{width:18px;height:18px}
.trhead .segs .sep{width:8px}
/* 時間條：整點的小橫線改成實心小圓點 */
.taxis .tk{left:-0.5px;width:6px;height:6px;margin-top:-3px;border:0;border-radius:50%;background:#8C807A}
/* 滑過頭不要彈出白色 */
html{background:var(--ground)}
html,body{overscroll-behavior:none}
/* 時間條：桃子到了的那段改淡朱紅 */
.taxis .sg2.on{background:#B4664F}
/* 行程內文左右對齊 */
.notes li>.nt,.tnote{text-align:justify;text-justify:inter-character}
.notes li>.nt{display:block}
/* 店家選單：地圖、刪除、拖曳三個圖示之間只留 4px，字可以寫寬一點 */
.sh .shmap,.sh .shx,.sh .shgrip{width:16px;height:30px}
.sh .shx,.sh .shgrip{margin-left:-5px}
.sh .shmap svg,.sh .shx svg,.sh .shgrip svg{width:16px;height:16px}
/* 整份手帖的文字左右對齊（兩邊切齊），標題也是；原本特別設定置中／靠右的不動 */
body,button,.mhit,.trhead,.shtog{text-align:justify;text-justify:inter-character}
/* 往下滑時收起日期列與底部分頁列 */
.daystrip{transition:transform .25s ease}
.tabbar{transition:transform .25s ease}
body.hidebars .daystrip{position:relative}   /* 往下滑：日期鈕不再黏著，直接跟內容捲走 */
body.hidebars .tabbar{transform:translate(-50%,calc(100% + 40px + env(safe-area-inset-bottom)))}   /* 整條藏到畫面外，不露邊 */
main.pg-itin .prog{transition:top .25s ease,transform .25s ease}
body.hidebars main.pg-itin .prog{position:relative;top:auto}   /* 今日進度也一樣跟內容捲走 */
@keyframes barin{from{transform:translateY(-100%);opacity:0}to{transform:none;opacity:1}}
body.barsin .daystrip,body.barsin main.pg-itin .prog.stuck{animation:barin .22s ease-out}
main>.fabrow{transition:bottom .25s ease}
body.hidebars main>.fabrow{bottom:calc(-12px + env(safe-area-inset-bottom))}
/* 時間條的桃子可以拖 */
.taxis .dot{pointer-events:auto;touch-action:none;cursor:grab}
.taxis .dot::before{content:"";position:absolute;inset:-12px -14px}
.taxis .dot.drag{transition:none!important}
.taxis .dot.drag svg{transform:scale(1.2)}
/* 行程內文：條列之間只留 2px */
.notes{gap:2px}
body:not(.editmode) .notes li>.nt{padding:0 5px;min-height:0}
.notes li{line-height:1.5}
/* 行程卡：所有上下間隙都是 2px（邊框到標題、標題到時間、時間到內文、內文到分隔線、分隔線到地點） */
main.pg-itin .card{padding-top:8px;padding-bottom:8px}   /* 上：可停留按鈕到邊框 8px；下：相機框到邊框 8px */
main.pg-itin .chead .mid{gap:2px}
main.pg-itin .rt{gap:2px}
main.pg-itin .notes{margin-top:2px}
main.pg-itin .evt,main.pg-itin .shops,main.pg-itin .photos{margin-top:2px}
main.pg-itin .ftrow{margin-top:2px;padding-top:2px}
main.pg-itin .tr{padding-top:2px;padding-bottom:2px}
main.pg-itin .trhead{padding-top:2px;padding-bottom:2px;row-gap:2px}
main.pg-itin .tr.open>.trhead{padding-bottom:2px}
main.pg-itin .trw{gap:0}
/* 時間條跟著工具列一起平順移動，不要分兩段跳 */
.taxis{transition:top .25s ease,height .25s ease}
/* 交通卡：恢復原本的樣子；上（邊框到圖示）補到跟下（文字到邊框）一樣，約 8px */
main.pg-itin .trhead{padding-top:6px}
/* 「可停留」與「離開」框之間 6px */
main.pg-itin .rt{gap:6px}
/* 有邊框的東西（正月行事框、店家選單、照片、連結框、相機框）上下都留 8px */
main.pg-itin .evt,main.pg-itin .shops,main.pg-itin .photos{margin-top:8px}
main.pg-itin .ftrow{margin-top:8px;padding-top:8px}
/* 交通卡展開時，標題區上下間距跟收起時一樣（上 8px、文字到分隔線 4px） */
main.pg-itin .trhead{padding-bottom:1px}
main.pg-itin .tr.open>.trhead{padding-top:6px;padding-bottom:3px}
/* ↑ 票價那行文字到下框（或展開時的虛線）看起來 8px，跟上面圖示框到邊框一樣 */
/* 交通卡展開時：最下面的按鈕到下框 8px，跟上面圖示到上框一樣 */
main.pg-itin .tr.open{padding-bottom:8px}
main.pg-itin .tr.open .trbody>:last-child{margin-bottom:0}
/* 內文上下的間距都跟「標題→抵達框」一樣（看起來約 7px）：
   上方區塊→第一行字、最後一行字→分隔線、分隔線→相機框 */
main.pg-itin .card .notes{margin-top:4px;margin-bottom:0}
main.pg-itin .card .ftrow{padding-top:7px;margin-top:5px}
main.pg-itin .card .evt,main.pg-itin .card .shops{margin-top:4px}
main.pg-itin .card .evt~.ftrow,main.pg-itin .card .shops~.ftrow,main.pg-itin .card .photos~.ftrow{margin-top:9px}
/* 不再用紅框標重點行程；改成「捲到哪一站就框哪一站」（景點卡與交通卡都算） */
.card.star{border-color:var(--line)}
main.pg-itin .tlx .row.focus>.col>.card,main.pg-itin .tlx .row.focus>.col>.tr{border-color:var(--shu);box-shadow:0 0 0 1px var(--shu),var(--shadow)}
main.pg-itin .tlx .row.focus>.col>.tr{border-style:solid}
.tlx .row>.col>.card,.tlx .row>.col>.tr{transition:border-color .2s,box-shadow .2s}
.wev.holding::before{animation-duration:.5s!important}
.wkcol.droptg{background:color-mix(in srgb,var(--shu) 7%,transparent)}
/* Google 地圖（離線版） */
.mapbox.gm .mzoom{display:none}
.mapbox.gm .mlayer{transform:none!important}
