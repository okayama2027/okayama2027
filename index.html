    sg.parts.forEach(function(pt){
      var path = (!pt.rail && (GPATH[rkey(pt)]||ROUTEC[rkey(pt)])) || pt.pts;
      if(!pt.rail && pt.m!=="plane" && !GPATH[rkey(pt)]) gmPathQueue(pt);
      var w=(mode==="seg"&&sel===sg.id)?6:4;
      var line=new google.maps.Polyline({map:GM.map,path:path.map(function(p){ return {lat:p[0],lng:p[1]}; }),
        strokeColor:MCOL[pt.m],strokeOpacity:pt.m==="walk"?0:(on?1:.3),strokeWeight:w,
        icons:pt.m==="walk"?[{icon:{path:google.maps.SymbolPath.CIRCLE,scale:1.6,fillColor:MCOL.walk,fillOpacity:on?1:.35,strokeOpacity:0},offset:"0",repeat:"9px"}]:null});
      line.addListener("click",function(){ UI.mapMode="seg"; MP.sel=sg.id; uiSave(); MP.view=null; mapRefresh(); });
      GM.ov.push(line);
      if(!(mode==="spot"&&sel) && (!(mode==="seg"&&sel)||sel===sg.id)) path.forEach(addB);
    });
  });
  MP.feat.spots.forEach(function(s){
    var on=(mode==="spot"&&sel===s.key), r=on?13:10, C=WCAT[s.cat].c;
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(r*2+4)+'" height="'+(r*2+4)+'"><circle cx="'+(r+2)+'" cy="'+(r+2)+'" r="'+r+'" fill="'+C+'" stroke="#fff" stroke-width="2.5"/></svg>';
    var m=new google.maps.Marker({map:GM.map,position:{lat:s.ll[0],lng:s.ll[1]},
      icon:{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),anchor:new google.maps.Point(r+2,r+2)},
      label:{text:String(s.nums[0]),color:"#fff",fontSize:"11px",fontWeight:"700"},
      title:s.lab,zIndex:on?99:10});
    m.addListener("click",function(){ UI.mapMode="spot"; MP.sel=s.key; uiSave(); MP.view=null; mapRefresh(); });
    GM.ov.push(m);
    if(!(mode==="seg"&&sel) && (!(mode==="spot"&&sel)||on)) addB(s.ll);
  });
  if(nb===1){ GM.map.setCenter(B.getCenter()); GM.map.setZoom(16); }
  else if(nb>1) GM.map.fitBounds(B,30);
  /* 外部連結、註記沿用原本的做法 */
  var go=$("#mgo"); if(go&&!go.href) go.href="https://www.google.com/maps";
  var at=$("#mattr"); if(at) at.textContent="";
  var nt=$("#mnote"); if(nt) nt.textContent = MP.twHidden ? "台灣段不在圖上。" : "";
  gmLinkFix();
};
/* Google 地圖模式下，「Google 地圖」按鈕的連結照原本規則算一次 */
function gmLinkFix(){
  var go=$("#mgo"); if(!go) return;
  var F=MP.feat, sel=MP.sel, mode=UI.mapMode, url;
  if(mode==="spot"&&sel){ F.spots.forEach(function(s){ if(s.key===sel) url=mapGo(s.place); }); }
  else if(mode==="seg"&&sel){ F.segs.forEach(function(sg){ if(sg.id===sel){ var walk=sg.parts.every(function(p){ return p.m==="walk"; });
      url=mapDir(sg.it.from,sg.it.to)+(walk?"&travelmode=walking":""); } }); }
  if(url) go.href=url;
}
mapZoom=function(dz,cx,cy){
  if(GMKEY&&GM.state==="ok"&&GM.map&&$("#mapbox.gm")){ GM.map.setZoom(GM.map.getZoom()+(dz>0?1:-1)); return; }
  return _mapZoom(dz,cx,cy);
};

/* 地圖上的步行／巴士線：用 Google 算實際走的路，存起來下次不用再算 */
function gmPathQueue(pt){
  var k=rkey(pt); if(GM.busy["p"+k]) return;
  var a=pt.pts[0], b=pt.pts[pt.pts.length-1];
  if(gdist(a,b)>0.6||gdist(a,b)<0.0008) return;
  GM.busy["p"+k]=1;
  gmRoute({lat:a[0],lng:a[1]},{lat:b[0],lng:b[1]},pt.m==="walk"?"WALKING":"DRIVING").then(function(r){
    if(!r||!r.path) return;
    GPATH[k]=r.path; try{ localStorage.setItem(GPKEY,JSON.stringify(GPATH)); }catch(e){}
    clearTimeout(GM.redraw); GM.redraw=setTimeout(function(){ if(UI.map&&page==="itin") mapDraw(); },300);
  });
}

/* 呼叫 Google 算路線（一次最多兩個，排隊） */
function gmRoute(o,d,mode){
  return new Promise(function(done){
    GM.q.push(function(){
      var R=google.maps.routes&&google.maps.routes.Route;
      if(!R||!R.computeRoutes){ done(null); return Promise.resolve(); }
      return R.computeRoutes({origin:o,destination:d,travelMode:mode,fields:["durationMillis","distanceMeters","path"]})
        .then(function(res){
          var r=res&&res.routes&&res.routes[0]; if(!r){ done(null); return; }
          var p=(r.path||[]).map(function(q){ return [+(typeof q.lat==="function"?q.lat():q.lat).toFixed(5),+(typeof q.lng==="function"?q.lng():q.lng).toFixed(5)]; });
          var step=Math.max(1,Math.floor(p.length/160));
          done({min:Math.max(1,Math.round((r.durationMillis||0)/60000)),m:r.distanceMeters||0,
                path:p.filter(function(_,i){ return i%step===0||i===p.length-1; })});
        }).catch(function(){ done(null); });
    });
    gmPump();
  });
}
function gmPump(){
  while(GM.running<2 && GM.q.length){
    var job=GM.q.shift(); GM.running++;
    Promise.resolve(job()).then(function(){ GM.running--; gmPump(); },function(){ GM.running--; gmPump(); });
  }
}

/* ---------- 改行程後：只有步行的交通段自動算時間 ---------- */
function gmPlace(name){ var g=geoOf(name); return g?{lat:g[0],lng:g[1]}:name+" 日本"; }
function gmAutoWalk(){
  if(!GMKEY) return;
  var todo=[];
  S.days.forEach(function(d){ d.items.forEach(function(it){
    if(it.k!=="transit"||!it.legs||!it.legs.length) return;
    if(!it.legs.every(function(lg){ return lg.k!=="ride"; })) return;   /* 有搭車的段落不動 */
    var pair=it.from+"|"+it.to;
    if(it.gw===pair) return;
    var fresh = it.legs.length===1 && it.legs[0].min===10 && !it.note;     /* 剛新增、還是預設「步行 10 分」的段落 */
    if(it.gw==null && !it.chk && !fresh){ it.gw=pair; return; }            /* 原本查好的步行段：記下來，不重算 */
    if(GM.busy["w"+it.id+pair]) return;
    todo.push({it:it,pair:pair});
  }); });
  if(!todo.length) return;
  gmLoad().then(function(){
    todo.forEach(function(t){
      var it=t.it; GM.busy["w"+it.id+t.pair]=1;
      gmRoute(gmPlace(it.from),gmPlace(it.to),"WALKING").then(function(r){
        if(!r) return;
        var km=r.m/1000;
        it.gw=t.pair;
        /* 記下新地點的座標，地圖上就畫得出來 */
        [[it.from,r.path[0]],[it.to,r.path[r.path.length-1]]].forEach(function(x){
          if(x[1] && !geoOf(x[0]) && !GEO[x[0]]){ GEO[x[0]]=[x[1][0],x[1][1],String(x[0]).split(" ")[0]]; GGEO[x[0]]=GEO[x[0]]; }
        });
        try{ localStorage.setItem(GGKEY,JSON.stringify(GGEO)); }catch(e){}
        if(km>2.5){
          /* 太遠就不硬改成走路，提醒去查車 */
          it.chk=1;
          it.note="Google 算出步行約 "+r.min+" 分（"+km.toFixed(1)+" 公里），建議搭車：按「Google Maps 路線」查好後，用「換交通方式」改成電車或巴士。";
        } else {
          it.legs=[{k:"walk",ic:"walk",text:it.from+" → "+it.to,min:r.min}];
          delete it.chk;
          it.note="步行時間由 Google 地圖自動計算（約 "+(r.m>=1000?km.toFixed(1)+" 公里":Math.round(r.m)+" 公尺")+"）。";
        }
        save(); NOSCROLL=true; render(); NOSCROLL=false;
      });
    });
  },function(){});
}
var _afterRender=afterRender;
afterRender=function(){
  _afterRender();
  if(GMKEY){ clearTimeout(GM.aw); GM.aw=setTimeout(gmAutoWalk,700); }
};

/* ---------- 開機 ---------- */

fbLoad();
wireMarkers();
render();
var FBjoined = fbIncomingLink();
if(!FBjoined) shareIncoming();
if(fbOn()){ fbStamp(); if(!FBjoined) fbStart(); }
})();
</script>

<script>
/* 離線化：把整個 App 存進瀏覽器，之後沒網路也能開 */
(function(){
  if(!("serviceWorker" in navigator) || location.protocol==="file:" || !window.caches) return;
  var CORE="core-2027-okayama-v10-2611"; window.OFFCORE=CORE;
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
    var el=null, shown=false;
    function pill(){
      if(el) return el;
      el=document.createElement("div");
      el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);"+
        "bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;padding:8px 15px;"+
        "border-radius:999px;font:500 13.5px/1.4 -apple-system,system-ui,sans-serif;"+
        "color:#fff;background:#4A4340;box-shadow:0 6px 18px rgba(0,0,0,.2);"+
        "opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap";
      document.body.appendChild(el); return el;
    }
    function say(t,bg,hide){
      var e=pill(); e.textContent=t; e.style.background=bg; e.style.opacity="1";
      if(hide) setTimeout(function(){ e.style.opacity="0"; },hide);
    }
    function ready(){
      return caches.open(CORE).then(function(c){ return c.match("./index.html"); });
    }
    ready().then(function(hit){
      if(hit) return;                       /* 早就存好了，不用吵使用者 */
      shown=true; say("離線內容下載中…","#4A4340",0);
      var n=0, t=setInterval(function(){
        n++;
        ready().then(function(h){
          if(h){ clearInterval(t); say("離線就緒，可以測飛航模式了 ✓","#4E7B5E",4000); }
          else if(n>60){ clearInterval(t); say("離線內容還沒存好，請保持連線重新整理","#A8442F",6000); }
        }).catch(function(){});
      },500);
    }).catch(function(){});
  });
})();
</script>
