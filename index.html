<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C04C36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="初春手帖">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>岡山倉敷 初春手帖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* 單一淺色主題 */
:root{
  color-scheme:light;
  --ground:#FAF6F3; --surface:#FFFDFC; --surface-2:#F2EBE7;
  --line:#E7DBD4; --line-2:#D8C4B6; --line-soft:#F1E9E4;
  --ink:#2E2521; --ink-2:#61524B; --muted:#96857D;
  --shu:#C04C36; --shu-2:#D4715B; --shu-wash:#FAEBE6;
  --clay:#9A8279; --clay-wash:#F3ECE8;
  --matsu:#5C7A56; --matsu-wash:#EBF1E9;
  --alert:#8E2C4E; --alert-wash:#FAE4EA; --red:#D6402F;
  --shadow:0 1px 2px rgba(46,37,33,.045), 0 10px 22px -14px rgba(46,37,33,.26);
  --shadow-lg:0 12px 44px -12px rgba(46,37,33,.4);
  --r:16px; --r-sm:10px;
  --c-food:#C25A3E; --c-tran:#4E7A8C; --c-tkt:#6B5C9E; --c-gift:#A8683F;
  --c-shop:#B4557E; --c-omam:#9C7A2E; --c-misc:#6E7B72; --c-etc:#8A7C75;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"Noto Sans TC","Hiragino Sans","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
svg{display:block}

#app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--ground);position:relative;
  box-shadow:0 0 0 1px var(--line)}
@media (min-width:520px){body{background:var(--surface-2)}}

/* ---------- masthead：青海波 + 水引 ---------- */
.mast{position:relative;padding:22px 16px 0;overflow:hidden;border-bottom:1px solid var(--line)}
.mast::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.08;
  background-image:
    radial-gradient(circle at 50% 100%,
      transparent 23%, var(--clay) 23%, var(--clay) 25.2%, transparent 25.2%,
      transparent 39%, var(--clay) 39%, var(--clay) 41.2%, transparent 41.2%,
      transparent 55%, var(--clay) 55%, var(--clay) 57.2%, transparent 57.2%,
      transparent 71%, var(--clay) 71%, var(--clay) 73.2%, transparent 73.2%),
    radial-gradient(circle at 50% 100%,
      transparent 23%, var(--clay) 23%, var(--clay) 25.2%, transparent 25.2%,
      transparent 39%, var(--clay) 39%, var(--clay) 41.2%, transparent 41.2%,
      transparent 55%, var(--clay) 55%, var(--clay) 57.2%, transparent 57.2%,
      transparent 71%, var(--clay) 71%, var(--clay) 73.2%, transparent 73.2%);
  background-size:56px 28px;
  background-position:0 0, 28px 14px;
}
.mast>*{position:relative}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--clay);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.titlewrap{display:inline-block;max-width:100%;margin:7px 0 9px}
.mast h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:25px;line-height:1.25;
  margin:0;letter-spacing:.03em}
.mast p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.6}
.mast h1:focus,.mast p:focus{outline:none;background:var(--clay-wash);border-radius:5px}
.mizu{display:block;width:100%;margin:9px 0 0;height:8px;position:relative}
.mizu i{display:block;position:absolute}
.mizu .g{inset:0;border-radius:4px;background:#BFA492}
.mizu .rw{inset:1px;border-radius:3px;overflow:hidden;
  background:repeating-linear-gradient(118deg,var(--shu) 0 7px,#FFFFFF 7px 14px)}
.mtools{display:flex;gap:7px;padding:10px 0 12px;align-items:center;flex-wrap:wrap}
.pill{font-size:11.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.pill svg{width:13px;height:13px}
.pill.live{background:var(--matsu-wash);border-color:color-mix(in srgb,var(--matsu) 45%,var(--line));color:var(--matsu);font-weight:500}
.pill.down{background:var(--surface);border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red);font-weight:500}
#saveflag{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);transition:color .2s}

/* ---------- day strip ---------- */
.daystrip{display:flex;gap:6px;padding:11px 16px;overflow-x:auto;scrollbar-width:none;
  border-bottom:1px solid var(--line);background:var(--ground);position:sticky;top:0;z-index:30}
.daystrip::-webkit-scrollbar{display:none}
.dchip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  padding:6px 12px;display:flex;flex-direction:column;min-width:0}
.dchip b{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:500;letter-spacing:.02em}
.dchip span{font-size:10.5px;color:var(--muted);white-space:nowrap}
.dchip[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.dchip[aria-selected="true"] span{color:rgba(255,255,255,.82)}

main{padding:16px 14px 128px;display:flex;flex-direction:column;gap:16px}

/* ---------- headings ---------- */
.dayhead{padding:2px 2px 0}
.dayhead .kick{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--clay);display:flex;gap:9px;align-items:baseline}
.dayhead h2{font-family:"Noto Serif TC",serif;font-weight:700;font-size:21px;margin:6px 0 5px;letter-spacing:.03em;text-wrap:balance}
.dayhead h2:focus,.dayhead p:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.dayhead p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.65}
.prog{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 13px;box-shadow:var(--shadow)}
.prog .pl{font-size:11px;letter-spacing:.1em;color:var(--muted);font-family:"IBM Plex Mono",monospace;flex:none}
.prog .pt{flex:1;display:block;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden;min-width:0}
.prog .pf{display:block;height:100%;border-radius:5px;background:var(--matsu);transition:width .25s}
.prog .pn{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:500;color:var(--matsu)}
.prog.full .pf{background:var(--shu)}
.prog.full .pn{color:var(--shu)}
.sechead{display:flex;align-items:center;gap:10px}
.sechead h2{margin:0;font-family:"Noto Serif TC",serif;font-weight:700;font-size:16px;letter-spacing:.06em;white-space:nowrap}
.sechead .rule{flex:1;height:1px;background:var(--line)}
.sechead .cnt{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}

/* ---------- timeline ---------- */
.tl{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:stretch}
.row[data-k="flight"]{gap:0}
.gutter{flex:none;width:38px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px;position:relative;--mh:0px}
.row[data-k="spot"] .gutter{--mh:38px}
/* 連接線：每一列只畫「往下」那一段，離圖標固定 6px、跨越列距時上下各留 4px，
   所以每個圖標上下的留白完全一致 */
.gutter::before{content:"";position:absolute;left:calc(50% - 1px);width:0;
  border-left:2px dashed #F0E7E1;z-index:0;
  top:calc(2px + var(--mh) + 6px);bottom:-4px}
.row[data-ln="none"] .gutter::before,
.row[data-ln="end"] .gutter::before{display:none}
.row[data-ln="mid"] .gutter::before,
.row[data-ln="start"] .gutter::before{display:block}
.row:not([data-k="spot"]) .gutter::before{top:-4px}
.mark{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;position:relative;z-index:1;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--shu)}
.mark svg{width:19px;height:19px}
.row[data-k="transit"] .mark{width:30px;height:30px;border-radius:10px;border-style:dashed;
  box-shadow:none;background:transparent;color:var(--clay)}
.row[data-k="transit"] .mark svg{width:15px;height:15px}
.gutter .gt{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--muted);letter-spacing:-.02em}
.col{flex:1;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 13px}
.card.dragging{opacity:.35}
.card.star{border-color:color-mix(in srgb,var(--shu) 45%,var(--line))}
.chead{display:flex;gap:9px;align-items:flex-start}
.chead .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.h3{font-family:"Noto Serif TC",serif;font-weight:700;font-size:16px;line-height:1.35;margin:0;
  word-break:break-word;text-wrap:balance}
.h3:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.place{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;align-items:baseline;gap:4px}
.place svg{width:11px;height:11px;flex:none;color:var(--clay);align-self:center}
.place .pv{flex:1;min-width:0;word-break:break-word}
.place .pv:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.place .pgo{flex:none;color:var(--clay);text-decoration:none;font-size:11px}

.tick{flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line-2);
  display:grid;place-items:center;color:transparent;font-size:12px;font-weight:700;margin-top:2px;background:var(--ground)}
.card.done .tick{background:var(--matsu);border-color:var(--matsu);color:#fff}
.card.done{opacity:.62}
.card.done .h3{text-decoration:line-through;text-decoration-color:var(--muted)}
.rt{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.rt .lv{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);
  font-family:"IBM Plex Mono",monospace;letter-spacing:.04em}
.rt .stay{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;white-space:nowrap;
  background:var(--matsu-wash);color:var(--matsu);border-radius:6px;padding:3px 8px;border:1px dashed color-mix(in srgb,var(--matsu) 38%,transparent)}
.rt .stay:active{border-color:currentColor}
.rt .leave{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);white-space:nowrap}
.rt .leave b{color:var(--ink-2);font-weight:500}
.rt.tight .stay{background:var(--alert-wash);color:var(--alert);border-color:color-mix(in srgb,var(--alert) 38%,transparent)}

.span{display:flex;align-items:center;gap:8px}
.span .lbl{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-family:"IBM Plex Mono",monospace;text-transform:uppercase}
.span .clr{margin-left:auto;font-size:10.5px;color:var(--shu);font-weight:400}
/* 時間欄位：外觀自己畫，原生 time input 透明疊在上面 → 點下去跳出滑輪 */
.tw{position:relative;display:inline-flex;align-items:center;
  font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500;line-height:1.25;
  background:var(--surface-2);border:1px dashed var(--shu);border-radius:8px;padding:5px 10px;color:var(--shu)}
.tw::after{content:"▾";font-size:9px;margin-left:5px;opacity:.65}
.tw input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;margin:0;padding:0;
  background:transparent;-webkit-appearance:none;appearance:none;font-size:16px;cursor:pointer}
.tw input::-webkit-calendar-picker-indicator{opacity:0;width:100%;height:100%;position:absolute;inset:0;padding:0;margin:0}
.tw:focus-within{border-style:solid;outline:2px solid color-mix(in srgb,var(--shu) 35%,transparent);outline-offset:1px}
.tw.sm{font-size:12px;padding:3px 8px;border-color:var(--line-2);color:var(--ink-2);background:var(--surface)}
.tw.anch{border-style:solid}
.tw.bad{border-color:var(--alert);color:var(--alert);border-style:solid}

.notes{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.notes li{font-size:12.5px;color:var(--ink-2);line-height:1.6;padding-left:14px;position:relative;
  word-break:break-word;min-height:1.6em;display:flex;align-items:flex-start;gap:6px}
.notes li>.nt{flex:1;min-width:0}
.notes li::before{content:"・";position:absolute;left:0;color:var(--clay)}
.notes li.warn{color:var(--alert)}
.notes li.warn::before{content:"⚠";font-size:10px;top:1px}
.notes li.sub{font-weight:700;color:var(--ink);padding-left:0;margin-top:4px}
.notes li.sub::before{content:""}
.notes li>.nt:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.notes li.blank::before,.bpnotes li.blank::before{content:""}
/* 內容被清空的行，完成編輯後就不留白 */
body:not(.editmode) .notes li.blank,
body:not(.editmode) .bpnotes li.blank{display:none}
body:not(.editmode) .bul.blank{display:none}

/* ---------- 方框右下角的 ＋／✕（只在編輯模式出現） ---------- */
.boxfoot{display:none;justify-content:flex-end;align-items:center;gap:8px;margin-top:11px;padding-top:9px;
  border-top:1px dashed var(--line)}
.editmode .boxfoot{display:flex}
.bf{flex:none;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;
  line-height:1;border:1px solid var(--line-2);background:var(--surface);color:var(--clay);
  touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bf:active{filter:brightness(.94)}
.bf.add{color:var(--matsu);border-color:color-mix(in srgb,var(--matsu) 40%,var(--line))}
.bf.del{color:#fff;background:var(--red);border-color:var(--red)}
.boxfoot .bl{margin-right:auto;font-size:11px;color:var(--muted);letter-spacing:.04em}
.ftrow{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-soft)}
.ftrow>svg{width:12px;height:12px;flex:none;color:var(--clay)}
.ftrow .mv{flex:none;max-width:calc(100% - 92px);font-size:12.5px;color:var(--matsu);text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--matsu) 35%,transparent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:1px}
.ftrow .mv.plain{color:var(--muted);border-bottom:0}
.ftrow .mv[contenteditable]{color:var(--ink-2);border-bottom:1px dashed var(--kin,var(--clay))}
.ftrow .mv:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.iconb{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--muted);background:var(--ground);font-size:12px}
.iconb.del{color:var(--alert);border-color:color-mix(in srgb,var(--alert) 28%,var(--line))}
.iconb svg{width:12px;height:12px}
.acts{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;align-items:center}
.mini{font-size:11.5px;padding:5px 10px;border-radius:8px;border:1px solid var(--line);color:var(--ink-2);background:var(--ground);
  display:inline-flex;align-items:center;gap:5px}
.mini svg{width:12px;height:12px}
.grip{margin-left:auto;color:var(--muted);padding:4px 2px;touch-action:none;cursor:grab;flex:none}
.grip svg{width:15px;height:15px}

/* ---------- transit ---------- */
.tr{background:var(--clay-wash);border:1px dashed var(--line);border-radius:13px;padding:10px 12px}
.tr .th{font-size:11.5px;color:var(--muted)}
.tr .th b{color:var(--ink-2);font-weight:500;font-size:12px;line-height:1.45;word-break:break-word}
.tr .main .fare{font-family:"IBM Plex Mono",monospace;color:var(--clay);font-weight:500;white-space:nowrap}
.tr .main{display:flex;align-items:center;gap:8px;margin-top:6px;font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500}
.tr .main .ar{color:var(--muted);font-size:10px}
.tr .main .tot{margin-left:auto;font-size:10.5px;color:var(--muted);font-family:"Noto Sans TC",sans-serif;font-weight:400;text-align:right;white-space:nowrap}
.legs{margin:9px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.legs li{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}
.legs li>svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--clay)}
.legs .lg{flex:1;min-width:0}
.legs .lg b{font-weight:500;color:var(--ink)}
.legs .lg .m{color:var(--muted);font-size:11px;display:block;font-family:"IBM Plex Mono",monospace}
.legs .lg .tm{font-family:"IBM Plex Mono",monospace;color:var(--shu);font-weight:500}
.legs .lg .em{border-bottom:1px dashed var(--clay);cursor:pointer;color:var(--ink-2)}

.depbar{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.depbar.more{border-top:0;padding-top:2px;margin-top:7px}
.depbar .tlb{font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
.depbar .clr{font-size:10.5px;color:var(--shu)}
.depbar .why{margin-left:auto;font-size:10.5px;color:var(--muted);text-align:right;line-height:1.35}

.times{display:flex;gap:5px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.times::-webkit-scrollbar{display:none}
.tb{flex:none;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:4px 8px;border-radius:7px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.tb[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:500}
.tb.past{opacity:.38;text-decoration:line-through}
.tb.now{box-shadow:0 0 0 1px var(--shu) inset}
.times.synth .tb{border-style:dashed}
.tb[aria-pressed="true"].past{opacity:1;background:var(--alert);border-color:var(--alert);color:#fff}

.conf{margin-top:9px;background:var(--alert-wash);border:1px solid color-mix(in srgb,var(--alert) 32%,transparent);
  border-radius:10px;padding:9px 10px;font-size:11.5px;color:var(--alert);line-height:1.55}
.conf{position:relative}
.conf .cx{position:absolute;top:6px;right:7px;width:22px;height:22px;border-radius:7px;display:grid;
  place-items:center;font-size:11px;color:inherit;opacity:.6;background:rgba(255,255,255,.5)}
.conf.warn2{background:var(--clay-wash);border-color:var(--line-2);color:var(--ink-2)}
.conf.warn2 .cb{background:var(--clay)}
.conf .cb{margin-top:7px;display:inline-block;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:8px;
  background:var(--alert);color:var(--surface)}

.tnote{margin-top:8px;font-size:11.5px;color:var(--ink-2);line-height:1.6;white-space:pre-wrap;
  border-left:2px solid var(--line);padding-left:9px}
.tnote:focus{outline:none;background:var(--clay-wash);border-radius:0 4px 4px 0}
.photos{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.photos::-webkit-scrollbar{display:none}
.photos .ph{flex:none;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);line-height:0}
.photos .ph img{height:82px;width:auto;max-width:150px;object-fit:cover;display:block}
.lb{position:fixed;inset:0;z-index:95;background:rgba(24,16,12,.95);display:none;flex-direction:column}
.lb[open]{display:flex}
.lb .lbtop{display:flex;justify-content:space-between;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 14px 10px}
.lb .lbtop button{color:#F3EAE5;font-size:13px;padding:7px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.3);background:transparent}
.lb .lbtop .rm{color:#FFB3A6;border-color:rgba(255,140,120,.5)}
.lb .lbbody{flex:1;display:grid;place-items:center;padding:6px 12px calc(18px + env(safe-area-inset-bottom));overflow:auto}
.lb img{max-width:100%;max-height:100%;border-radius:8px}
.evt{margin-top:10px;background:var(--shu-wash);border:1px solid color-mix(in srgb,var(--shu) 22%,transparent);
  border-radius:10px;padding:9px 11px}
.evt summary{font-size:11.5px;color:var(--shu);cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px;font-weight:500}
.evt summary::-webkit-details-marker{display:none}
.evt summary::before{content:"▸";font-size:9px;transition:transform .15s}
.evt[open] summary::before{transform:rotate(90deg)}
.evt ul{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.evt li{display:flex;gap:8px;font-size:12px;line-height:1.55;align-items:flex-start}
.evt li .et{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--shu);min-width:56px}
.evt li .en{flex:1;min-width:0;color:var(--ink-2)}
.evt li .en b{color:var(--ink);font-weight:500;display:block}
.evt .esrc{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.5}
.evt .esrc a{color:var(--clay)}
.disc{margin-top:9px}
.disc summary{font-size:11.5px;color:var(--clay);cursor:pointer;list-style:none;display:flex;align-items:center;gap:5px}
.disc summary::-webkit-details-marker{display:none}
.disc summary::before{content:"▸";font-size:9px;transition:transform .15s}
.disc[open] summary::before{transform:rotate(90deg)}
.ttbox{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.ttbox h4{margin:0 0 7px;font-size:12px;font-weight:700;font-family:"Noto Serif TC",serif;letter-spacing:.03em}
.ttgrid{display:flex;flex-direction:column;gap:1px;max-height:210px;overflow:auto}
.ttr{display:flex;gap:9px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.7}
.ttr .hh{flex:none;width:22px;color:var(--clay);text-align:right}
.ttr .mm{flex:1;color:var(--ink-2);word-spacing:.28em}
.ttr.hi{background:var(--shu-wash);border-radius:4px}
.ttbox .src{margin-top:8px;font-size:10.5px;color:var(--muted);line-height:1.55;white-space:pre-wrap}
.ttbox .src a{color:var(--clay)}

/* ---------- 交通方案切換 ---------- */
.alts{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.alts::-webkit-scrollbar{display:none}
.altb{flex:none;min-width:132px;border:1px solid var(--line);border-radius:11px;background:var(--surface);
  padding:8px 11px;display:flex;flex-direction:column;gap:1px;text-align:left}
.altb b{font-size:12.5px;font-weight:500;color:var(--ink)}
.altb span{font-size:10.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.altb[aria-pressed="true"]{background:var(--shu-wash);border-color:var(--shu)}
.altb[aria-pressed="true"] b{color:var(--shu);font-weight:700}
.altb[aria-pressed="true"] span{color:color-mix(in srgb,var(--shu) 72%,var(--muted))}

/* 已完成的交通：收成一行 */
.trmini{width:100%;display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;
  border:1px dashed var(--line);background:transparent;color:var(--muted);font-size:11.5px}
.trmini>svg{width:14px;height:14px;flex:none;opacity:.7}
.trmini .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trmini .t{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11px}
.trmini .ex{flex:none;font-size:10.5px;color:var(--clay);border:1px solid var(--line);
  border-radius:7px;padding:2px 7px}

/* ---------- boarding pass ---------- */
.bp{border-radius:var(--r);overflow:hidden;background:#fff;color:#2B2320;border:1px solid var(--line);box-shadow:var(--shadow)}
.bp .band{background:linear-gradient(100deg,#C04C36,#D4715B);color:#fff;padding:9px 14px;
  display:flex;align-items:center;justify-content:space-between;font-size:10.5px;letter-spacing:.2em;
  text-transform:uppercase;font-weight:500}
.bp .band .ln{font-family:"IBM Plex Mono",monospace;letter-spacing:.1em}
.bp .grid{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;padding:17px 4px 7px}
.bp .col{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:0 2px;min-width:0}
.bp .iata{font-family:"IBM Plex Mono",monospace;font-size:27px;font-weight:500;letter-spacing:.04em;line-height:1.1;color:#2B2320}
.bp .apname{font-size:10.5px;color:#8A7469;line-height:1.35}
.bp .tm{font-family:"IBM Plex Mono",monospace;font-size:17px;font-weight:500;color:#C04C36;margin-top:3px}
.bp .plane{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%}
/* 航線：dot －虛線－ 飛機 －虛線－ 箭頭。--rg 就是「虛線與兩側的留白」，
   左右兩端往機場資訊那側各溢出 --rov，讓四段留白看起來一樣寬 */
.bp .route{--rg:13px;--rov:28px;
  display:flex;align-items:center;gap:var(--rg);
  width:calc(100% + var(--rov) * 2);margin:0 calc(var(--rov) * -1)}
.bp .rdot{flex:none;width:6px;height:6px;border-radius:50%;background:#DCCCC1}
.bp .rdash{flex:1;min-width:8px;height:2px;border-radius:1px;
  background:repeating-linear-gradient(90deg,#DCCCC1 0 2.6px,transparent 2.6px 7.4px)}
.bp .rpl{flex:none;width:31px;height:31px;display:block;color:#C04C36}
.bp .rarw{flex:none;width:9px;height:14px;display:block;color:#DCCCC1}
.bp .fno{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.14em;color:#2B2320;font-weight:500}
.bp .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-top:1px dashed #DCC9BA;margin:11px 12px 0;padding:10px 0 12px}
.bp .meta div{text-align:center}
.bp .meta dt{font-size:9.5px;letter-spacing:.14em;color:#A08D81;text-transform:uppercase;margin:0}
.bp .meta dd{margin:2px 0 0;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:#2B2320}
.bp .foot{background:#FBF1EA;border-top:1px solid #EDDBCC;padding:10px 14px;font-size:11.5px;color:#7B6A60;line-height:1.6}
.bp [contenteditable]:focus{outline:none;background:#FBEEE6;border-radius:4px}
.bpnotes{margin:0;padding:10px 14px 13px;list-style:none;display:flex;flex-direction:column;gap:3px;
  background:#FBF1EA;border-top:1px dashed #E3CFC0}
.bpnotes li{font-size:12.5px;color:#6E5D54;line-height:1.6;padding-left:14px;position:relative;min-height:1.6em}
.bpnotes li::before{content:"・";position:absolute;left:0;color:#B79C8C}
.bpnotes li:focus{outline:none;background:#F6E4D8;border-radius:4px}

/* ---------- info page ---------- */
.info{display:flex;flex-direction:column;gap:10px}
.memolist{display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px 13px;display:flex;gap:9px;align-items:flex-start}
.sec.dragging{opacity:.35}
.sec>.grip{margin-left:0;margin-top:2px}
.sec .sc{flex:1;min-width:0}
.sec h3{margin:0 0 8px;font-family:"Noto Serif TC",serif;font-weight:700;font-size:14.5px;letter-spacing:.05em}
.sec h3:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.kv{display:flex;flex-direction:column;gap:5px}
.kv .r{display:flex;gap:8px;font-size:12.5px;line-height:1.6;align-items:flex-start}
.kv .r>.k{flex:none;width:52px;color:var(--muted);font-size:11.5px;word-break:break-word}
.kv .r>.k:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.kv .r>.v{flex:1;min-width:0;color:var(--ink-2);word-break:break-word}
.kv .r>.v:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:10.5px;letter-spacing:.08em;
  padding:0 8px 5px 0;border-bottom:1px solid var(--line);text-transform:uppercase}
.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:top}
.tbl td.num{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.tbl td.x,.tbl th.x{width:26px;padding-right:0;text-align:right}
.tbl td:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.tbl tr:last-child td{border-bottom:0}
.tblwrap{overflow-x:auto}
/* 逐列的 ✕／＋ 平常收起來，按頁首的「編輯」才出現 */
.rowx{flex:none;width:23px;height:23px;border-radius:7px;display:none;place-items:center;
  color:var(--red);font-size:11px;border:1px solid color-mix(in srgb,var(--red) 32%,var(--line));
  background:var(--ground);margin-top:1px}
.rowadd{margin-top:9px;font-size:11.5px;color:var(--clay);border:1px dashed var(--line-2);
  border-radius:8px;padding:6px 11px;background:transparent;display:none}
.editmode .rowx{display:grid}
.bmap{flex:none;width:23px;height:23px;border-radius:7px;display:grid;place-items:center;margin-top:1px;
  color:var(--matsu);border:1px solid color-mix(in srgb,var(--matsu) 35%,var(--line));background:var(--surface)}
.bmap svg{width:12px;height:12px}
.bmapset svg{width:11px;height:11px}
.bmapset{color:var(--muted)!important;border-color:var(--line)!important}
.bmapset.on{color:var(--matsu)!important;border-color:color-mix(in srgb,var(--matsu) 45%,var(--line))!important}
.editmode .rowadd{display:inline-block}
.dayfoot{display:none}
.editmode .dayfoot{display:flex}
[data-addleg],[data-delleg]{display:none}
.editmode [data-addleg]{display:inline-flex}
.editmode [data-delleg]{display:inline}
.tbl td.x,.tbl th.x{width:0;padding:0;border-bottom-color:transparent}
.editmode .tbl td.x,.editmode .tbl th.x{width:29px;padding:6px 0 6px 3px;text-align:right;border-bottom-color:var(--line-soft)}

/* ---------- 編輯模式 ---------- */
.grip{display:none}
.editmode .grip{display:block}
/* 可編輯的地方在編輯模式下給一個很淡的底，讓人知道哪裡能改 */
.editmode [contenteditable="true"]{background:color-mix(in srgb,var(--clay-wash) 55%,transparent);border-radius:4px}
.editmode .bp [contenteditable="true"]{background:#FCF3EE}
/* 時間欄位隨時都能調（含非編輯模式），所以一律保持可按的樣子 */
.mv.empty::before{content:"點這裡填地點";color:var(--muted)}
.editmode .mv[contenteditable="true"]{min-width:96px;display:inline-block}
/* 圖標：編輯模式可點著換 */
.editmode .mark[data-icopen]{border-style:dashed;border-color:var(--shu-2);cursor:pointer}
.editmode .mark[data-icopen]::after{content:"✎";position:absolute;right:-3px;bottom:-4px;font-size:9px;
  width:14px;height:14px;border-radius:50%;background:var(--shu);color:#fff;display:grid;place-items:center}
/* 圖標選擇盤 */
.icgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.icgrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:12px;background:var(--surface);
  display:grid;place-items:center;color:var(--ink-2)}
.icgrid button svg{width:21px;height:21px}
.icgrid button[aria-pressed="true"]{background:var(--shu-wash);border-color:var(--shu);color:var(--shu)}
.after{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
.after li{font-size:11.5px;color:var(--muted);line-height:1.6;padding-left:13px;position:relative;display:flex;gap:7px;align-items:flex-start}
.after li .tx{flex:1;min-width:0;word-break:break-word}
.after li::before{content:"・";position:absolute;left:0}
.after li:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.chk{display:flex;flex-direction:column;gap:2px}
.chkrow{display:flex;gap:7px;align-items:flex-start;font-size:12.5px;line-height:1.6;padding:3px 0}
.chkbox{flex:none;width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);margin-top:3px;
  display:grid;place-items:center;color:transparent;font-size:10px}
.chkrow.done .chkbox{background:var(--matsu);border-color:var(--matsu);color:#fff}
.chkrow.done .ct{color:var(--muted);text-decoration:line-through}
.ct{flex:1;min-width:0;color:var(--ink-2);word-break:break-word}
.ct:focus{outline:none;background:var(--clay-wash);border-radius:4px}

/* ---------- money page ---------- */
.total{position:relative;background:var(--surface-2);border-radius:12px;padding:11px 56px 13px;
  display:flex;flex-direction:column;align-items:center;gap:2px}
.total .tlb{font-size:10.5px;letter-spacing:.12em;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.total .amt{display:flex;flex-direction:column;align-items:center;gap:1px}
.total .amt b{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;color:var(--ink)}
.total .amt small{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-2)}
.curtog{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  width:38px;height:38px;border-radius:11px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--clay);display:grid;place-items:center}
.curtog svg{width:19px;height:19px}
.curtog:active{background:var(--surface-2)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;padding:8px 6px;font-size:12.5px;text-align:center;color:var(--ink-2)}
.seg button[aria-selected="true"]{background:var(--shu);color:#fff;font-weight:500}
.mgrp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.mgrp>h3{margin:0;padding:9px 13px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"Noto Serif TC",serif;font-size:13px;letter-spacing:.04em;display:flex;gap:8px;align-items:center}
.mgrp>h3 .sw{width:9px;height:9px;border-radius:3px;flex:none}
.mgrp>h3 small{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-2);font-weight:400;letter-spacing:0}
.mrow{display:flex;gap:9px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:0}
.mrow .dot{width:8px;height:8px;border-radius:3px;flex:none}
.mrow .mn{flex:1;min-width:0}
.mrow .mn b{display:block;font-size:13px;font-weight:400;word-break:break-word}
.mrow .mn small{font-size:10.5px;color:var(--muted)}
.mrow .mv{text-align:right;flex:none}
.mrow .mv b{display:block;font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:500}
.mrow .mv small{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted)}
.mrow .mx{flex:none;color:var(--muted);font-size:13px;padding:2px 3px}
.bars{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);padding:13px}
.bar{display:flex;align-items:center;gap:9px;font-size:12px}
.bar .bl{flex:none;width:76px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .bt{flex:1;display:block;height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar .bfill{display:block;height:100%;border-radius:5px}
.flh{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.curin{display:flex;gap:6px}
.curin button{flex:1;font-size:12.5px;padding:8px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);text-align:center}
.curin button[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:700}
.mhit{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:0}
.mhit:active{opacity:.6}
.split{display:flex;gap:8px;margin-top:10px}
.split .sp{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:9px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.split .sp .n{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.split .sp b{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:500}
.split .sp small{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--matsu)}
.split .sp.co b{color:var(--clay)}
.bar .bv{flex:none;font-family:"IBM Plex Mono",monospace;font-size:11.5px;width:64px;text-align:right}
.empty{text-align:center;color:var(--muted);font-size:12.5px;padding:26px 10px;line-height:1.7}

/* ---------- memo ---------- */
.memo{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 15px;position:relative}
.memo>.grip{position:absolute;right:11px;top:12px;margin:0}
.memo h2{margin:0;font-family:"Noto Serif TC",serif;font-size:19px;font-weight:900;letter-spacing:.04em;
  border-bottom:2px solid var(--shu);padding-bottom:6px;display:inline-block;line-height:1.35}
.memo h2:focus{outline:none;background:var(--clay-wash)}
.buls{margin:11px 0 0;display:flex;flex-direction:column;gap:1px}
.bul{display:flex;gap:7px;align-items:flex-start}
.bul .rowx{margin-top:5px}
.bul .d{color:var(--shu);font-size:14px;line-height:1.75;flex:none;font-weight:700}
.bul .x{flex:1;font-size:13.5px;line-height:1.8;min-height:1.8em;word-break:break-word}
.bul .x:focus{outline:none;background:var(--clay-wash);border-radius:4px}
.bul .x:empty::before{content:"輸入重點，按 Enter 換下一點";color:var(--muted)}

/* ---------- overview ---------- */
.ov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.ov>h3{margin:0;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);
  font-family:"Noto Serif TC",serif;font-size:13.5px;letter-spacing:.05em;display:flex;gap:8px;align-items:baseline}
.ov>h3 small{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:0}
.ovr{display:flex;gap:9px;padding:8px 14px;border-bottom:1px solid var(--line-soft);align-items:center}
.ovr:last-child{border-bottom:0}
.ovr .i{flex:none;width:16px;color:var(--shu)}
.ovr .i svg{width:14px;height:14px}
.ovr .t{font-family:"IBM Plex Mono",monospace;font-size:12px;flex:none;width:92px;letter-spacing:-.02em}
.ovr .n{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr.mv{background:var(--clay-wash)}
.ovr.mv .i{color:var(--clay)}
.ovr.mv .n,.ovr.mv .t{color:var(--muted);font-size:11.5px}

/* ---------- fab / sheet / tabbar ---------- */
.fabrow{position:fixed;right:calc(50% - 240px + 14px);bottom:calc(76px + env(safe-area-inset-bottom));z-index:45;
  display:flex;align-items:center;gap:8px}
.fab{height:46px;padding:0 16px;border-radius:999px;background:var(--shu);color:#fff;font-weight:700;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:6px;touch-action:manipulation}
.fab-ed{width:46px;height:46px;padding:0;justify-content:center;
  background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2)}
.fab-ed svg{width:22px;height:22px}
.fab-ed.on{background:var(--matsu);border-color:var(--matsu);color:#fff}
@media (max-width:511px){.fabrow{right:14px}}

/* ---------- 自製對話框（Artifact 沙箱擋掉原生 confirm／prompt） ---------- */
.dlg{position:fixed;inset:0;z-index:95;display:none}
.dlg[open]{display:block}
.dlg .scrim{position:absolute;inset:0;background:rgba(30,20,16,.5)}
.dlg .dpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(100% - 44px);max-width:340px;
  background:var(--ground);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;letter-spacing:.03em}
.dlg p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.6}
.dlg p:empty,.dlg #dlgF:empty{display:none}
.dlg .dbtns{display:flex;gap:8px;margin-top:4px}
.dlg .dbtns .bigbtn{flex:1}
.dlg.noCancel .dbtns [data-dclose]{display:none}
.dlg .bigbtn.danger{background:var(--red)}

.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet[open]{display:block}
.sheet .scrim{position:absolute;inset:0;background:rgba(30,20,16,.5)}
.sheet .panel{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;
  background:var(--ground);border-radius:20px 20px 0 0;max-height:88dvh;display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);border:1px solid var(--line);border-bottom:0;animation:up .22s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{transform:translate(-50%,20px);opacity:.4}to{transform:translate(-50%,0);opacity:1}}
.sheet .ph{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .ph h3{margin:0;font-family:"Noto Serif TC",serif;font-size:16px;font-weight:700;letter-spacing:.04em;flex:1}
.sheet .pb{padding:14px 16px calc(20px + env(safe-area-inset-bottom));overflow:auto;display:flex;flex-direction:column;gap:12px}
.icb{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);
  color:var(--ink-2);background:var(--surface);flex:none;font-size:13px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);letter-spacing:.08em}
".inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--ink)}
.inp.bk{min-height:150px;font-family:"IBM Plex Mono",monospace;font-size:12px;line-height:1.5;word-break:break-all;resize:vertical}
.inp:focus{outline:none;border-color:var(--shu)}
.bigjpy{font-family:"IBM Plex Mono",monospace;font-size:24px;font-weight:500}
.twdline{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--matsu)}
.catsel{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cs.newc{color:var(--clay);border-style:dashed}
.cs.mgc{color:var(--red);border-color:color-mix(in srgb,var(--red) 32%,var(--line))}
.seg.wrap{flex-wrap:wrap;border:0;background:none;gap:6px}
.seg.wrap>button{border:1px solid var(--line);border-radius:999px;background:var(--surface);
  padding:6px 14px;font-size:12.5px;flex:none}
.seg.wrap>button[aria-selected="true"]{background:var(--shu);border-color:var(--shu);color:#fff}
.whoset{display:flex;flex-wrap:wrap;align-items:center;gap:7px}
.whoset .wlb{font-size:11px;color:var(--muted);letter-spacing:.08em;flex:none}
.wc{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;
  background:var(--surface);padding:4px 6px 4px 12px}
.wc .wn{font-size:12.5px;color:inherit;font-weight:500}
.wc .wx{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  font-size:9px;color:var(--muted);background:var(--surface-2)}
.wadd{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;
  border:1px dashed var(--line-2);color:var(--clay);background:transparent}
.cs .csx{display:none;margin-left:3px;margin-right:-4px;width:16px;height:16px;border-radius:50%;
  background:var(--red);color:#fff;font-size:9px;line-height:16px;text-align:center;flex:none}
.catsel.mg .cs .csx{display:inline-block}
.cs{font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);
  background:var(--surface);display:inline-flex;align-items:center;gap:5px}
.cs .dot{width:7px;height:7px;border-radius:2px}
.cs[aria-pressed="true"]{border-color:currentColor;font-weight:500}
.bigbtn{width:100%;background:var(--shu);color:#fff;border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-align:center}
.bigbtn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line)}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:50;
  background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;color:var(--muted)}
.tab svg{width:18px;height:18px}
.tab span{font-size:9.5px;letter-spacing:.02em}
.tab[aria-selected="true"]{color:var(--shu)}

.hint,.perhead{font-size:11.5px;color:var(--muted);line-height:1.65;padding:0 2px}
.perhead b{color:var(--ink-2);font-weight:500}
.hint b{color:var(--ink-2);font-weight:500}
".addb{width:100%;border:1px dashed var(--line);border-radius:var(--r-sm);padding:11px;color:var(--muted);
  font-size:12.5px;background:transparent;text-align:center}
.dayfoot{display:flex;gap:8px}
.dayfoot .addstop{flex:1}
.addstop{width:100%;border:1px dashed var(--line-2);border-radius:12px;padding:12px;color:var(--clay);
  font-size:12.5px;background:var(--surface);text-align:center;margin-top:2px}
.addstop:active{background:var(--clay-wash)}
.foot{font-size:11px;color:var(--muted);line-height:1.7;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
</style>

</head>

function toHM(m){ if(m==null||isNaN(m)) return "--:--"; m=Math.round(m); var d=Math.floor(m/1440); m=((m%1440)+1440)%1440;
  return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2)+(d>0?"+1":""); }
function dur(m){ if(m==null) return ""; if(m<0) return "−"+dur(-m); var h=Math.floor(m/60),n=m%60; return h?(h+"小時"+(n?n+"分":"")):(n+"分"); }
function hm(m){ return toHM(m).slice(0,5); }
function timeField(attr,id,val,cls){
  return '<span class="tw'+(cls?" "+cls:"")+'"><span class="tv">'+esc(val)+'</span>'+
    '<input type="time" lang="en-GB" step="60" data-'+attr+'="'+esc(id)+'" value="'+esc(val)+'" aria-label="選擇時間"></span>';
}

/* ---------- 自製對話框：Artifact 的 iframe 會擋掉原生 confirm/alert/prompt ---------- */
function dlgClose(){ var d=$("#dlg"); if(d){ d.removeAttribute("open"); d.classList.remove("noCancel"); } }
function bindDlg(){
  var d=$("#dlg"); if(!d||d._bound) return; d._bound=true;
  d.addEventListener("click",function(e){ if(e.target.closest("[data-dclose]")) dlgClose(); });
}
function dlgOpen(title,msg,fields,okLabel,onOk,danger){
  var d=$("#dlg"); bindDlg();
  $("#dlgT").textContent=title||"";
  $("#dlgM").textContent=msg||"";
  $("#dlgF").innerHTML=fields||"";
  var ok=$("#dlgOk");
  ok.textContent=okLabel||"確定";
  ok.classList.toggle("danger",!!danger);
  ok.onclick=function(){ var keep=onOk&&onOk(); if(!keep) dlgClose(); };
  d.classList.remove("noCancel");
  d.setAttribute("open","");
  setTimeout(function(){ var i=$("#dlgF input"); if(i){ i.focus(); i.select&&i.select(); } },50);
}
function ask(title,msg,onOk,okLabel,danger){ dlgOpen(title,msg,"",okLabel||"確定",onOk,danger); }
function tell(title,msg){ dlgOpen(title,msg,"","知道了",null); $("#dlg").classList.add("noCancel"); }
function askInput(title,msg,value,onOk,opts){
  opts=opts||{};
  dlgOpen(title,msg,'<input class="inp" id="dlgI" '+(opts.type?'type="'+opts.type+'" ':'')+
    (opts.mode?'inputmode="'+opts.mode+'" ':'')+'value="'+esc(value==null?"":value)+'">',
    opts.ok||"儲存", function(){ return onOk($("#dlgI").value); });
}
function askTime(cur){
  var v=prompt("輸入時間（HH:MM）；留空取消設定", cur||"");
  if(v===null) return undefined;
  v=v.trim(); if(v==="") return null;
  if(!/^\d{1,2}:\d{2}$/.test(v)){ alert("請用 HH:MM 格式，例如 08:36。"); return undefined; }
  var p=v.split(":"); if(+p[0]>47||+p[1]>59){ alert("時間不合法。"); return undefined; }
  return ("0"+p[0]).slice(-2)+":"+p[1];
}

function ttList(key){

  if(tt._flat) return tt._flat;
  var out=[];
  (tt.rows||[]).forEach(function(r){
    String(r[1]).trim().split(/\s+/).forEach(function(m){ if(/^\d{1,2}$/.test(m)) out.push(r[0]+":"+("0"+m).slice(-2)); });
  });
  tt._flat=out; return out;
}

/* ================= state ================= */
var S=load(), page="itin", di=0, saveT=null, flagT=null, scrollMem={};
function migrate(p){
  if(!p.visited) p.visited={};
  if(!p.anchor)  p.anchor={};
  if(!p.leave)   p.leave={};
  if(!p.photos)  p.photos={};
  if(!p.pick)    p.pick={};
  if(!p.done)    p.done={};
  if(!p.hush)    p.hush={};
  if(!p.expenses)p.expenses=[];
  if(!p.cats)    p.cats=[];
  if(!p.hidecat) p.hidecat={};
  if(typeof p.rev!=="number") p.rev=0;
  if(p.mshow!=="twd") p.mshow="jpy";
  if(!p.people || !p.people.length){
    p.people = p.who ? [{id:"a",n:p.who.a||"我"},{id:"b",n:p.who.b||"旅伴"}]
                     : [{id:"a",n:"我"},{id:"b",n:"旅伴"}];
  }
  delete p.who;
  /* 補上「家 出發」與它的交通（舊存檔沒有這兩筆） */
  try{
    var d0=p.days&&p.days[0];
    if(d0 && !d0.items.some(function(x){ return x.id==="a00"; })){
      var D0=DEFAULT().days[0], add=[];
      D0.items.forEach(function(x){ if(x.id==="a00"||x.id==="t10") add.push(JSON.parse(JSON.stringify(x))); });
      var at=-1;
      for(var i=0;i<d0.items.length;i++){ if(d0.items[i].id==="a0"){ at=i; break; } }
      if(at<0){ at=0; while(at<d0.items.length && d0.items[at].k==="flight") at++; }
      if(add.length) d0.items.splice.apply(d0.items,[at,0].concat(add));
      if(toMin(d0.start)>toMin("07:10")) d0.start="07:10";
    }
  }catch(e){}
  (p.memo||[]).forEach(function(m){
    if(!m.g || m.g.length!==m.b.length) m.g=m.b.map(function(_,i){ return (m.g&&m.g[i])||""; });
  });
  return p;
}
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&p.days&&p.days.length) return migrate(p); } }catch(e){}
  return migrate(DEFAULT());
}

/* ================= 時間鏈 ================= */
function rideKey(tid,i){ return tid+":"+i; }
function compute(day){
  var out={}, cursor=toMin(day.start);
  /* 第一站若被自己固定成更早的時間，就把當日起點往前挪，
     這樣「家 出發」這種插在最前面的站才調得動 */
  for(var q=0;q<day.items.length;q++){
    var f0=day.items[q];
    if(f0.k!=="spot") continue;
    var a0=S.anchor[f0.id];
    if(a0 && toMin(a0)<cursor) cursor=toMin(a0);
    break;
  }
  day.items.forEach(function(it,i){
    if(it.k==="flight"){
      var f=S.flights[it.dir];
      out[it.id]={dep:toMin(f.dep),arr:toMin(f.arr)}; cursor=toMin(f.arr);
    } else if(it.k==="transit"){
      var r=runTransit(it,cursor); out[it.id]=r; cursor=r.arr;
    } else {
      var a=S.anchor[it.id]||it.pin, nat=cursor, arr=a?toMin(a):cursor;
      /* 只有「前一格是交通」才算得上衝突；前面是登機證或另一站就不用警告 */
      var pv=day.items[i-1], chained=!!(pv&&pv.k==="transit");
      out[it.id]={arr:arr, nat:nat, anchored:!!S.anchor[it.id], chained:chained,
        early:!!S.anchor[it.id]&&arr<nat&&chained};
      /* 離開：使用者釘住的優先，否則抵達＋預計停留 */
      var lv=S.leave[it.id], lvm = lv ? toMin(lv) : (arr+(it.stay||0));
      var over = lvm < arr;                 /* 抵達晚於原本設定的離開 */
      if(over) lvm = arr;
      out[it.id].leave  = lvm;
      out[it.id].lvfix  = !!lv;
      out[it.id].over   = over;
      out[it.id].win    = lvm-arr;
      cursor = lvm;
    }
  });
  day.items.forEach(function(it,i){
    if(it.k!=="spot") return;
    var me=out[it.id], nx=day.items[i+1];
    me.need  = (nx&&nx.k==="transit") ? out[nx.id].leaveAt : null;   /* 趕上目前這班車最晚要走的時間 */
    me.tight = me.win<(it.min||0);
  });
  return out;
}
function runTransit(it,entry){
  var cursor=entry, pre=0, seen=false, legs=[], firstDep=null, leaveAt=entry;
  for(var i=0;i<it.legs.length;i++){
    var lg=it.legs[i];
    if(lg.k!=="ride"){ cursor+=lg.min||0; if(!seen) pre+=lg.min||0; legs.push({i:i,type:lg.k}); continue; }
    var ready=cursor, list=lg.tt?ttList(lg.tt):[], key=rideKey(it.id,i), picked=S.pick[key], dep, synth=false;
    /* 沒有公布時刻表、但屬於「隨到隨搭」的密集班次（班距 ≤15 分），
       就依班距推算一排可切換的班次，並標明是推算的 */
    /* 沒有可用時刻表、但知道班距時，就依班距推算一排可切換的班次。
       已知「有時刻表但尚未公布」（tt 存在但沒有資料）且班距很疏的，不推算，以免誤導。 */
    var ttEmpty = lg.tt && !list.length;
    if(!list.length && lg.freq && (!ttEmpty || lg.freq<=15)){
      synth=true;
      list=[];                                   /* 一定要新陣列，不能動到共用的時刻表 */
      var st=Math.max(0,Math.floor((ready-lg.freq*4)/lg.freq)*lg.freq);
      for(var z=0;z<16;z++) list.push(toHM(st+z*lg.freq).slice(0,5));
    } else { list=list.slice(); }
    if(picked){ dep=toMin(picked); }
    else if(lg.freq){ dep=ready+lg.freq; }
    else if(list.length){
      var auto=null;
      for(var j=0;j<list.length;j++){ if(toMin(list[j])>=ready){ auto=list[j]; break; } }
      dep=auto!=null?toMin(auto):toMin(list[list.length-1]);
    }
    else if(lg.dep){ dep=toMin(lg.dep); }
    else dep=ready;
    var arr=dep+(lg.min||0);
    legs.push({i:i,type:"ride",dep:dep,arr:arr,ready:ready,wait:dep-ready,list:list,key:key,late:dep<ready,synth:synth});
    if(!seen){ seen=true; firstDep=dep; leaveAt=dep-pre; }
    cursor=arr;
  }
  return {dep:seen?firstDep:entry, arr:cursor, entry:entry, pre:pre, legs:legs, leaveAt:seen?leaveAt:entry, total:cursor-entry};
}
function shiftTransit(day,tid){
  var idx=-1; for(var i=0;i<day.items.length;i++) if(day.items[i].id===tid) idx=i;
  var c=compute(day)[tid], target=null;
  for(var j=0;j<c.legs.length;j++){ var L=c.legs[j]; if(L.type==="ride"&&L.late){ target=L; break; } }
  if(!target) for(var j2=0;j2<c.legs.length;j2++){ var L2=c.legs[j2]; if(L2.type==="ride"&&L2.list.length){ target=L2; break; } }
  if(target){
    if(target.list.length){
      var need=target.late?target.ready:target.dep+1, nx=null;
      for(var q=0;q<target.list.length;q++){ if(toMin(target.list[q])>=need){ nx=target.list[q]; break; } }
      if(nx) S.pick[target.key]=nx; else delete S.pick[target.key];
    } else delete S.pick[target.key];
  }
  clearAfter(day,idx); save(); render();
}
function extendSpot(day,sid){
  var idx=-1; for(var i=0;i<day.items.length;i++) if(day.items[i].id===sid) idx=i;
  if(idx<0) return;
  var sp=day.items[idx];
  sp.stay=Math.max(sp.stay||0, sp.min||0);
  delete S.leave[sp.id];
  clearAfter(day,idx); save(); render(); flag("停留已拉長，後面順延");
}
function resetTransit(day){
  var def=null, D=DEFAULT();
  D.days.forEach(function(d){ if(d.id===day.id) def=d; });
  if(!def) return;
  var res=day.items.slice(), have={};
  res.forEach(function(x){ if(x.k==="transit") have[x.id]=1; });
  def.items.forEach(function(x,i){
    if(x.k!=="transit") return;
    var copy=JSON.parse(JSON.stringify(x));
    if(have[x.id]){
      for(var q=0;q<res.length;q++) if(res[q].id===x.id) res[q]=copy;
      return;
    }
    var nxt=null;
    for(var j=i+1;j<def.items.length;j++){ if(def.items[j].k!=="transit"){ nxt=def.items[j]; break; } }
    var at=res.length;
    if(nxt){ for(var k=0;k<res.length;k++){ if(res[k].id===nxt.id){ at=k; break; } } }
    res.splice(at,0,copy);
  });
  res.forEach(function(x){ if(x.k==="transit") x.legs.forEach(function(lg,i){ delete S.pick[rideKey(x.id,i)]; }); });
  day.items=res; save(); render();
}
/* ================= 內建路線庫 =================
   把預設行程裡已經查好的每一段交通，依「起點>終點」建成對照表。
   新增或重排站點時，只要兩端對得上就自動套用（反向會自動把時刻表方向對調）。 */
var PALIAS=[
 [P.OKJ,      ["岡山桃太郎空港","岡山空港","桃太郎空港","OKJ"]],
 [P.TPE,      ["桃園國際機場第一航廈","桃園國際機場","桃園機場","TPE"]],
 [P.WANLONG,  ["捷運萬隆站","萬隆站","萬隆"]],
 [P.HOTEL,    ["倉敷ステーションホテル","倉敷駅","倉敷站","倉敷車站","倉敷駅前"]],
 [P.BIKAN,    ["倉敷美観地区","倉敷美觀地區","美観地区","美觀地區"]],
 [P.ACHI,     ["阿智神社"]],
 [P.IVY,      ["倉敷アイビースクエア","アイビースクエア"]],
 [P.OHARA,    ["大原美術館"]],
 [P.FURUICHI, ["ぶっかけ庵ふるいち","ふるいち","阿知町"]],
 [P.GRECO,    ["喫茶エル・グレコ","エル・グレコ"]],
 [P.MIYAKE,   ["町家喫茶 三宅商店","三宅商店"]],
 [P.KIBITSU,  ["吉備津神社","吉備津"]],
 [P.KORAKUEN, ["岡山後楽園","後楽園","後樂園"]],
 [P.OKAJO,    ["岡山城"]],
 [P.OKAEKI,   ["岡山駅","岡山站","岡山車站","岡山駅前"]]
];
var PFLAT=(function(){
  var a=[]; PALIAS.forEach(function(r){ r[1].forEach(function(x){ a.push([x,r[0]]); }); });
  a.sort(function(x,y){ return y[0].length-x[0].length; });
  return a;
})();
function canonPlace(s){
  s=String(s||"").trim(); if(!s) return null;
  for(var i=0;i<PFLAT.length;i++){ if(s.indexOf(PFLAT[i][0])>=0) return PFLAT[i][1]; }
  return null;
}
var TTREV={kibiDown:"kibiUp",kibiUp:"kibiDown",sanyoUp:"sanyoDown",sanyoDown:"sanyoUp",
           busArr:"busDep",busDep:"busArr",tram:"tram"};
var ROUTES=(function(){
  var m={};
  DEFAULT().days.forEach(function(d){ d.items.forEach(function(x){
    if(x.k!=="transit") return;
    var a=canonPlace(x.from), b=canonPlace(x.to);
    if(!a||!b||a===b) return;
    if(!m[a+">"+b]) m[a+">"+b]=x;
  }); });
  return m;
})();
function reverseTransit(t){
  var c=JSON.parse(JSON.stringify(t));
  c.legs=(c.legs||[]).slice().reverse().map(function(lg){
    if(lg.k==="ride"){ var a=lg.a; lg.a=lg.b; lg.b=a; if(lg.tt) lg.tt=TTREV[lg.tt]||lg.tt; delete lg.dep; }
    else if(typeof lg.text==="string" && lg.text.indexOf("→")>=0){
      var pp=lg.text.split("→"); lg.text=pp[1].trim()+" → "+pp[0].trim();
    }
    return lg;
  });
  var f=c.from; c.from=c.to; c.to=f;
  return c;
}
function directRoute(a,b){
  if(ROUTES[a+">"+b]) return JSON.parse(JSON.stringify(ROUTES[a+">"+b]));
  if(ROUTES[b+">"+a]) return reverseTransit(ROUTES[b+">"+a]);
  return null;
}
function findRoute(from,to){
  var a=canonPlace(from), b=canonPlace(to);
  if(!a||!b||a===b) return null;
  var d=directRoute(a,b); if(d) return d;
  /* 沒有直達就找一個中繼點湊兩段（例如 飯店 → 岡山駅 → 後樂園） */
  for(var i=0;i<PALIAS.length;i++){
    var h=PALIAS[i][0];
    if(h===a||h===b) continue;
    var r1=directRoute(a,h), r2=directRoute(h,b);
    if(r1&&r2) return {from:from,to:to,fare:(+r1.fare||0)+(+r2.fare||0),
      note:[r1.note,r2.note].filter(Boolean).join("\n"),
      legs:r1.legs.concat(r2.legs)};
  }
  return null;
}
/* 把查到的路線套進這段交通；套不到回傳 false */
function applyRoute(tr){
  var r=findRoute(tr.from,tr.to);
  if(!r) return false;
  tr.legs=JSON.parse(JSON.stringify(r.legs));
  tr.fare=r.fare||0;
  tr.note=r.note||"";
  if(r.alts){ tr.alts=JSON.parse(JSON.stringify(r.alts)); tr.altI=r.altI||0; }
  else { delete tr.alts; delete tr.altI; }
  if(r.cur) tr.cur=r.cur; else delete tr.cur;
  (tr.legs||[]).forEach(function(lg,i){ delete S.pick[rideKey(tr.id,i)]; });
  delete tr.chk;
  return true;
}

/* 每一段交通的預設值（用 id 對照），給單獨還原用 */
var DEFTR=(function(){
  var m={}; DEFAULT().days.forEach(function(d){
    d.items.forEach(function(x){ if(x.k==="transit") m[x.id]=x; }); });
  return m;
})();
function switchAlt(day,tid,i){
  var idx=-1; for(var q=0;q<day.items.length;q++) if(day.items[q].id===tid) idx=q;
  if(idx<0) return;
  var it=day.items[idx];
  if(!it.alts || !it.alts[i]) return;
  var A=it.alts[i];
  it.legs=JSON.parse(JSON.stringify(A.legs));
  it.fare=A.fare||0;
  it.note=A.note||"";
  it.altI=i;
  it.legs.forEach(function(lg,k){ delete S.pick[rideKey(tid,k)]; });
  clearAfter(day,idx); save(); render(); flag("已換成「"+A.n+"」");
}
function restoreOneTransit(day,tid){
  var idx=-1; for(var i=0;i<day.items.length;i++) if(day.items[i].id===tid) idx=i;
  if(idx<0) return;
  var it=day.items[idx], def=DEFTR[tid], msg="";
  if(def && def.from===it.from && def.to===it.to){
    day.items[idx]=JSON.parse(JSON.stringify(def));
    day.items[idx].legs.forEach(function(lg,i){ delete S.pick[rideKey(tid,i)]; });
    msg="已還原這段交通";
  } else if(applyRoute(it)){
    msg="已套用查好的路線";
  } else if(def){
    day.items[idx]=JSON.parse(JSON.stringify(def));
    day.items[idx].legs.forEach(function(lg,i){ delete S.pick[rideKey(tid,i)]; });
    msg="已還原成原本的交通";
  } else {
    tell("沒有現成的路線","「"+it.from+"」到「"+it.to+"」不在已查好的路線裡。"+
      "按卡片下方的「Google Maps 路線」查好之後，直接在這張卡上改就可以了。");
    return;
  }
  clearAfter(day,idx); save(); render(); flag(msg);
}
function newSpot(){ return {id:uid(),k:"spot",ic:"camera",t:"新的一站",place:"",stay:60,min:30,notes:[""],events:[]}; }
function newTransit(a,b){ return {id:uid(),k:"transit",from:a||"上一站",to:b||"下一站",fare:0,note:"",
  legs:[{k:"walk",ic:"walk",text:(a||"上一站")+" → "+(b||"下一站"),min:10}]}; }
function prevSpotName(day,at){
  for(var i=at-1;i>=0;i--){ if(day.items[i].k==="spot") return day.items[i].place||day.items[i].t; }
  return "上一站";
}
function addStop(day,afterId){
  var at;
  if(afterId){ at=0; day.items.forEach(function(x,i){ if(x.id===afterId) at=i+1; }); }
  else { at=day.items.length; while(at>0 && day.items[at-1].k==="flight") at--; }
  var sp=newSpot(), tr=newTransit(prevSpotName(day,at), sp.t);
  day.items.splice(at,0,tr,sp);
  applyRoute(tr);
  syncTransits(day);
  save(); render();
  setTimeout(function(){ var el=$('[data-ed="t"][data-id="'+sp.id+'"]'); if(el){ el.scrollIntoView({block:"center"}); el.focus(); } },60);
}
function spotName(it){ return (it&&(it.place||it.t))||"上一站"; }
/* 每次新增／刪除／重排之後，把每段交通的起訖點接回真正的上下兩站；
   端點有變的那段標成「需確認」，班次資料先留著讓使用者自己判斷 */
function syncTransits(day){
  var prev=null;
  day.items.forEach(function(it,i){
    if(it.k==="spot"){ prev=it; return; }
    if(it.k!=="transit") return;
    var nxt=null;
    for(var j=i+1;j<day.items.length;j++){ if(day.items[j].k==="spot"){ nxt=day.items[j]; break; } }
    if(!prev || !nxt){ it.orphan=1; return; }
    delete it.orphan;
    var a=spotName(prev), b=spotName(nxt), changed=false;
    if(it.from!==a){ (it.legs||[]).forEach(function(lg){
        if(lg.k!=="ride"&&typeof lg.text==="string") lg.text=lg.text.split(it.from).join(a); });
      it.from=a; changed=true; }
    if(it.to!==b){ (it.legs||[]).forEach(function(lg){
        if(lg.k!=="ride"&&typeof lg.text==="string") lg.text=lg.text.split(it.to).join(b); });
      it.to=b; changed=true; }
    if(changed){
      (it.legs||[]).forEach(function(lg,k){ delete S.pick[rideKey(it.id,k)]; });
      if(!applyRoute(it)) it.chk=1;    /* 查得到就自動填好，查不到才標「需確認」 */
    }
  });
  /* 第一站前面若還掛著一段交通（重排後常見），直接拿掉 */
  for(var q=day.items.length-1;q>=0;q--) if(day.items[q].orphan){ day.items.splice(q,1); }
}
function delSpot(day,id){
  var i=-1; day.items.forEach(function(x,k){ if(x.id===id) i=k; });
  if(i<0) return;
  var start=i, del=1;
  if(i>0 && day.items[i-1].k==="transit"){ start=i-1; del=2; }
  day.items.splice(start,del);
  delete S.visited[id]; delete S.anchor[id]; delete S.leave[id];
  syncTransits(day);
  save(); render(); flag("已刪除，交通已接起");
}
function clearAfter(day,idx){
  for(var j=idx+1;j<day.items.length;j++){
    var t=day.items[j]; if(t.k!=="transit") continue;
    t.legs.forEach(function(lg,i){ delete S.pick[rideKey(t.id,i)]; });
  }
}

/* ================= 花費 ================= */
function twd(n){ return "NT$"+Math.round((n||0)*(+S.rate||0)).toLocaleString("en-US"); }
function twd2jpy(n){ var r=+S.rate||0.2006; return Math.round((+n||0)/r); }
/* 花費頁的日圓用 JPY 開頭（交通票價維持 ¥） */
function jpy(n){ return "JPY¥"+Math.round(n||0).toLocaleString("en-US"); }
/* 兩種幣別都顯示，mshow 只決定哪一個當主要（大字） */
function amtMain(n){ return S.mshow==="twd" ? twd(n) : jpy(n); }
function amtSub(n){  return S.mshow==="twd" ? jpy(n) : twd(n); }
function amtLine(n,sep){ return amtMain(n)+(sep||"　")+amtSub(n); }
function grand(){ var s=0; S.expenses.forEach(function(e){ s+=+e.a||0; }); return s; }
function dayById(id){ for(var i=0;i<S.days.length;i++) if(S.days[i].id===id) return S.days[i]; return null; }
function findItem(id){ for(var i=0;i<S.days.length;i++){ var its=S.days[i].items;
  for(var j=0;j<its.length;j++) if(its[j].id===id) return {d:S.days[i],it:its[j],j:j}; } return null; }

/* ================= 共享同步（把行程存進 Artifact 的資料檔） ================= */
/* ================= 即時同步（Firebase Realtime Database，REST + SSE） =================
   只在自己架的版本有效；claude.ai 的 Artifact 會被安全政策擋掉對外連線。 */
function now(){ return Date.now(); }
var FBKEY=KEY+":fb";
var FB={url:"",room:""};
var FBes=null, FBtimer=null, FBstate="off", FBlastTs=0;
var FBme=Math.random().toString(36).slice(2,8);
var FBwant=false;      /* 使用者是否要開著同步（跟連線狀態分開） */
var FBseen=0;          /* 最後一次真的收到雲端資料的時間 */
var FBretry=0;         /* 重連次數，用來拉長間隔 */
var FBpoll=null;       /* 備援輪詢：Safari 切到背景會把 SSE 斷掉且不自己接回來 */
var FBpending=null;    /* 對方的更新先收著，等使用者不在編輯狀態再套用 */
var FBdirty=false;     /* 本機有還沒推上去的修改 */

function fbLoad(){ try{ var r=localStorage.getItem(FBKEY); if(r) FB=JSON.parse(r)||FB; }catch(e){} }
function fbSaveCfg(){ try{ localStorage.setItem(FBKEY,JSON.stringify(FB)); }catch(e){} }
function fbOn(){ return !!(FB.url&&FB.room); }
function fbPath(){ return String(FB.url).replace(/\/+$/,"")+"/trips/"+encodeURIComponent(FB.room)+".json"; }
function fbRoom(){ var a="abcdefghijkmnpqrstuvwxyz23456789",o="";
  for(var i=0;i<22;i++) o+=a.charAt(Math.floor(Math.random()*a.length)); return o; }

/* 使用者正在打字、開著編輯模式或彈窗時，不要把畫面整個重畫掉 */
function fbBusy(){
  var a=document.activeElement;
  if(a && (a.isContentEditable || a.tagName==="INPUT" || a.tagName==="TEXTAREA")) return true;
  if(document.body.classList.contains("editmode")) return true;
  var d=$("#dlg"); if(d && d.hasAttribute("open")) return true;
  var sh=$("#sheet"); if(sh && sh.hasAttribute("open")) return true;
  return false;
}

function fbCut(){ if(FBes){ try{ FBes.close(); }catch(e){} FBes=null; } }
function fbStop(){
  FBwant=false; fbCut();
  if(FBpoll){ clearInterval(FBpoll); FBpoll=null; }
  FBpending=null; FBstate="off";
}

function fbStart(){
  if(!fbOn()) return;
  FBwant=true; fbCut();
  FBstate = (FBstate==="on") ? "on" : "connecting";
  renderMast();
  fbPull();                                   /* 先抓一次現況，SSE 掛掉也還有東西 */
  if(typeof EventSource!=="undefined"){
    try{
      FBes=new EventSource(fbPath());
      FBes.onopen=function(){ FBstate="on"; FBretry=0; FBseen=now(); renderMast(); fbFlushDirty(); };
      FBes.onerror=function(){ fbDrop(); };
      FBes.addEventListener("put",function(ev){ FBstate="on"; FBretry=0; fbIncoming(ev.data); renderMast(); });
      FBes.addEventListener("patch",function(ev){ FBstate="on"; FBretry=0; fbIncoming(ev.data); renderMast(); });
      FBes.addEventListener("keep-alive",function(){ FBseen=now(); });
    }catch(e){ fbDrop(); }
  }
  fbWatch();
}

/* 斷線了：標記狀態，隔一段時間自己接回來（間隔越接越長，最多 20 秒） */
function fbDrop(){
  fbCut();
  if(!FBwant) return;
  if(FBstate!=="err"){ FBstate="err"; renderMast(); }
  FBretry=Math.min(FBretry+1,8);
  setTimeout(function(){ if(FBwant && !FBes) fbStart(); }, Math.min(1500*FBretry,20000));
}

/* 備援：每 12 秒看一次，超過 35 秒沒收到東西就直接用一般連線抓一次 */
function fbWatch(){
  if(FBpoll) return;
  var n=0;
  FBpoll=setInterval(function(){
    if(!FBwant) return;
    /* 每 1.5 秒：使用者一離開編輯狀態就把對方的更新補上 */
    if(FBpending && !fbBusy()) fbApplyPending();
    if(++n < 8) return;                      /* 每 12 秒才檢查一次連線 */
    n=0;
    if(document.hidden) return;
    if(FBseen && (now()-FBseen)<35000) return;
    fbPull();
    if(!FBes || FBes.readyState===2) fbStart();
  },1500);
}

function fbPull(){
  if(!fbOn()) return;
  fetch(fbPath()+"?_="+now(),{cache:"no-store"})
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      FBseen=now(); FBretry=0;
      if(FBstate!=="on"){ FBstate="on"; renderMast(); }
      fbIncoming(JSON.stringify({path:"/",data:d}));
    })
    .catch(function(){});
}

function fbIncoming(raw){
  var m=null; try{ m=JSON.parse(raw); }catch(e){ return; }
  if(!m || (m.path && m.path!=="/")) return;
  var d=m.data;
  FBseen=now();
  if(!d || !d.days || !d.days.length) return;
  if(d.by===FBme) return;                       /* 自己剛送出去的，不用再套用 */
  if((+d.ts||0) <= (+FBlastTs||0)) return;
  FBlastTs=+d.ts||0;
  if(fbBusy()){                                 /* 正在打字/編輯：先收著，不要把畫面抽掉 */
    FBpending=d;
    flag("對方有更新，離開編輯後套用");
    return;
  }
  fbApply(d);
}

function fbApplyPending(){ var d=FBpending; FBpending=null; if(d) fbApply(d); }

function fbApply(d){
  var keep=S.photos;
  S=migrate(d);
  if(!S.photos || !Object.keys(S.photos).length) S.photos=keep||{};
  S.days.forEach(function(day){ day.items.forEach(function(x){
    if(x.k==="transit" && !x.alts && DEFTR[x.id] && DEFTR[x.id].alts)
      x.alts=JSON.parse(JSON.stringify(DEFTR[x.id].alts)); }); });
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  render(); flag("已同步對方的更新");
}

function fbPush(){
  if(!fbOn() || !FBwant) return;
  FBdirty=true;
  clearTimeout(FBtimer);
  FBtimer=setTimeout(fbSend,1200);
}
function fbFlushDirty(){ if(FBdirty) fbSend(); }
function fbSend(){
  if(!fbOn() || !FBwant) return;
  var d=JSON.parse(JSON.stringify(S));
  d.ts=now(); d.by=FBme;
  var body=JSON.stringify(d);
  if(body.length>3000000){ d.photos={}; body=JSON.stringify(d); }
  FBlastTs=d.ts;
  fetch(fbPath(),{method:"PUT",body:body,headers:{"Content-Type":"application/json"}})
    .then(function(r){ if(!r.ok) throw new Error(r.status);
      FBdirty=false; FBseen=now();
      if(FBstate!=="on"){ FBstate="on"; renderMast(); } })
    .catch(function(){
      FBdirty=true;                              /* 留著，連回來再送一次 */
      if(FBstate!=="err"){ FBstate="err"; renderMast(); flag("目前連不上，改動先存在手機裡"); }
    });
}

/* Safari 切到背景會把連線收掉而且不會自己接回來，回到前景時要重接 */
document.addEventListener("visibilitychange",function(){
  if(document.hidden || !FBwant) return;
  fbPull();
  if(!FBes || FBes.readyState===2) fbStart();
  else fbFlushDirty();
});
window.addEventListener("online",function(){ if(FBwant) fbStart(); });
window.addEventListener("pageshow",function(e){ if(FBwant && e.persisted) fbStart(); });

function baseUrl(){ return location.origin+location.pathname; }
function fbPayload(){
  return btoa(unescape(encodeURIComponent(JSON.stringify({u:FB.url,r:FB.room}))))
    .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function fbInvite(){ return baseUrl()+"?fb="+fbPayload(); }

/* 把房間寫進網址列。iPhone 的「加入主畫面」是另一個獨立的儲存空間，
   房間代號不會跟過去；寫進網址之後，主畫面圖示啟動時才認得出自己是哪一間。 */
function fbStamp(){
  if(!fbOn()) return;
  try{ history.replaceState(null,"",baseUrl()+"?fb="+fbPayload()); }catch(e){}
}
function fbClearUrl(){ try{ history.replaceState(null,"",baseUrl()); }catch(e){} }

function fbReadUrl(){
  var m=/^#fb=(.+)$/.exec(location.hash||"") || /[?&]fb=([^&]+)/.exec(location.search||"");
  return m?m[1]:"";
}
function fbIncomingLink(){
  var code=fbReadUrl();
  if(!code) return false;
  var b=code.replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  var cfg=null;
  try{ cfg=JSON.parse(decodeURIComponent(escape(atob(b)))); }catch(e){}
  if(!cfg||!cfg.u||!cfg.r){ fbClearUrl(); tell("這個同步邀請讀不出來","請對方重新複製一次。"); return true; }
  if(fbOn() && FB.url===cfg.u && FB.room===cfg.r){ fbStamp(); return false; }  /* 本來就在同一間，不用再問 */
  ask("加入共同編輯？","加入之後，你和對方任何一邊的修改都會即時同步。你目前這台裝置上的內容會被雲端那份取代。",
    function(){ FB={url:cfg.u,room:cfg.r}; fbSaveCfg(); fbStamp(); fbStart(); flag("已加入，正在同步…"); renderMast(); },"加入");
  return true;
}

/* ---------- 分享連結：把行程壓進網址（哪裡都能用，不需要權限） ---------- */
function u8ToB64(u8){
  var s="",CH=0x8000;
  for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64ToU8(b){
  b=String(b).replace(/-/g,"+").replace(/_/g,"/");
  while(b.length%4) b+="=";
  var raw=atob(b), u=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++) u[i]=raw.charCodeAt(i);
  return u;
}
function packState(){
  var d=JSON.parse(JSON.stringify(S));
  d.photos={};                                   /* 活動圖太大，不放進連結 */
  /* 交通方案是程式內建的資料，不用塞進連結，對方那邊會自己接回來 */
  (d.days||[]).forEach(function(day){ (day.items||[]).forEach(function(x){ delete x.alts; }); });
  var txt=JSON.stringify(d), bytes=new TextEncoder().encode(txt);
  if(typeof CompressionStream==="undefined") return Promise.resolve("r"+u8ToB64(bytes));
  var cs=new CompressionStream("gzip");
  return new Response(new Blob([bytes]).stream().pipeThrough(cs)).arrayBuffer()
    .then(function(ab){ return "z"+u8ToB64(new Uint8Array(ab)); })
    .catch(function(){ return "r"+u8ToB64(bytes); });
}
function unpackState(code){
  var tag=code.charAt(0), body=code.slice(1), u=b64ToU8(body);
  if(tag!=="z") return Promise.resolve(JSON.parse(new TextDecoder().decode(u)));
  var ds=new DecompressionStream("gzip");
  return new Response(new Blob([u]).stream().pipeThrough(ds)).arrayBuffer()
    .then(function(ab){ return JSON.parse(new TextDecoder().decode(new Uint8Array(ab))); });
}
function shareLink(){
  return packState().then(function(code){

function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(t).then(function(){return true;}).catch(function(){return false;});
  try{
    var ta=document.createElement("textarea");
    ta.value=t; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select();
    var ok=document.execCommand("copy"); document.body.removeChild(ta);
    return Promise.resolve(ok);
  }catch(e){ return Promise.resolve(false); }
}

/* ================= viewport（避免 iOS 編輯時自動放大） ================= */
var VP_LOOSE="width=device-width, initial-scale=1, viewport-fit=cover";
var VP_LOCK ="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
function vpSet(c){
  var vp=document.querySelector('meta[name="viewport"]');
  if(!vp){ vp=document.createElement("meta"); vp.name="viewport"; document.head.appendChild(vp); }
  if(vp.getAttribute("content")===c) return;
  vp.setAttribute("content",c);
  /* Safari 只有在 meta 節點本身變動時才重讀 viewport，所以整顆換掉 */
  var n=vp.cloneNode(true); vp.parentNode.replaceChild(n,vp);
}
function vpLock(){ vpSet(VP_LOCK); }
function vpUnlock(){ vpSet(VP_LOOSE); }

/* ================= render ================= */
var view=$("#view");
var EDIT=false;                    /* 全域編輯模式（不寫進存檔） */
var NOSCROLL=false;
var EDITPAGES={info:1,itin:1,memo:1};
/* 進出編輯模式時整顆換掉 viewport：必須在任何欄位取得焦點之前就設定好，
   iOS 才不會在編輯時自動放大 */
function setEdit(on){
  /* 進出編輯模式時每張卡都會長高／變矮，先記住畫面上第一張卡的位置，
     重畫完再把它放回原位，眼睛看到的東西才不會整個往下跑 */
  var anchor=null, off=0;
  $$(".card[data-id],.sec[data-id],.memo[data-id]",view).some(function(n){
    var r=n.getBoundingClientRect();
    if(r.bottom>70){ anchor=n.dataset.id; off=r.top; return true; }
    return false;
  });
  EDIT=!!on;
  if(EDIT) vpLock(); else vpUnlock();
  NOSCROLL=true; render(); NOSCROLL=false;
  if(anchor){
    var t=$('[data-id="'+anchor+'"]',view);
    if(t){
      var d=t.getBoundingClientRect().top-off;
      window.scrollTo(0,Math.max(0,window.scrollY+d));
      requestAnimationFrame(function(){
        var t2=$('[data-id="'+anchor+'"]',view);
        if(t2) window.scrollTo(0,Math.max(0,window.scrollY+(t2.getBoundingClientRect().top-off)));
      });
    }
  }
}

function viewItin(){
  var d=S.days[di], c=compute(d);
  var fi=-1, la=-1;
  d.items.forEach(function(it,i){ if(it.k==="spot"){ if(fi<0) fi=i; la=i; } });
  function lnOf(i){
    if(fi<0||la<=fi) return "none";
    if(i<fi||i>la) return "none";
    if(i===fi) return "start";
    if(i===la) return "end";
    return "mid";
  }
  var doneN=0, allN=0;
  d.items.forEach(function(it){ if(it.k==="spot"){ allN++; if(S.visited[it.id]) doneN++; } });
  var pct=allN?Math.round(doneN/allN*100):0;
  var prog='<div class="prog'+(allN&&doneN===allN?" full":"")+'"><span class="pl">今日進度</span>'+
    '<span class="pt"><span class="pf" style="width:'+pct+'%"></span></span>'+
    '<span class="pn">'+doneN+' / '+allN+'</span></div>';
  var body=d.items.map(function(it,i){
    var ln=lnOf(i);
    if(it.k==="flight")  return rowFlight(it,c[it.id],ln);
    if(it.k==="transit"){
      /* 這段交通的「下一站」勾完了，代表已經搭過，收成一行 */
      var nx=null;
      for(var j=i+1;j<d.items.length;j++){ if(d.items[j].k==="spot"){ nx=d.items[j]; break; } }

    return rowSpot(it,c[it.id],ln);

function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=1500, w=img.width, h=img.height, r=Math.min(1,max/Math.max(w,h));
      var cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(w*r)); cv.height=Math.max(1,Math.round(h*r));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      try{ cb(cv.toDataURL("image/jpeg",0.72)); }catch(e){ tell("讀不到這張圖","這張圖處理不了，換一張試試。"); }
    };
    img.onerror=function(){ tell("讀不到這張圖","換一張試試。"); };
    img.src=fr.result;
  };
  fr.onerror=function(){ tell("讀不到這個檔案","換一個試試。"); };
  fr.readAsDataURL(file);
}
function pickPhoto(id){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    readPhoto(f,function(d){
      if(!S.photos[id]) S.photos[id]=[];
      S.photos[id].push({d:d});
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }
      catch(e){ S.photos[id].pop(); tell("存不下了","儲存空間不夠，刪掉幾張活動圖再試。"); return; }
      render();
    });
  };
  inp.click();
}

function rowTransit(it,c,ln){
  var mainIc="walk", hasRide=false;
  it.legs.forEach(function(lg){ if(lg.k==="ride"){ if(!hasRide) mainIc=lg.ic; hasRide=true; } });
  var legHTML=it.legs.map(function(lg,i){
    if(lg.k!=="ride"){
      return '<li>'+ico(lg.ic)+'<span class="lg"><b contenteditable="true" data-leg="'+it.id+':'+i+':text">'+esc(lg.text)+'</b>'+
        '<span class="m"><button class="em" data-legmin="'+it.id+':'+i+'">'+lg.min+'分</button>'+
        (it.legs.length>1?'　<button class="em" data-delleg="'+it.id+':'+i+'">刪除</button>':'')+'</span></span></li>';
    }
    var L=null; c.legs.forEach(function(x){ if(x.i===i) L=x; });
    return '<li>'+ico(lg.ic)+'<span class="lg"><b contenteditable="true" data-leg="'+it.id+':'+i+':line">'+esc(lg.line)+'</b>　'+
      '<span class="tm">'+esc(lg.a)+' '+toHM(L.dep)+' → '+esc(lg.b)+' '+toHM(L.arr)+'</span>'+
      '<span class="m">'+lg.min+'分'+(lg.fare?'・'+money(lg.fare,it.cur):'')+(L.wait>0?'・候車 '+dur(L.wait):'')+'</span></span></li>';
  }).join("");

  var pickHTML="", lateL=null, first=true;
  c.legs.forEach(function(L){ if(!lateL&&L.late) lateL=L; });
  c.legs.forEach(function(L){
    if(L.type!=="ride") return;
    var lg=it.legs[L.i];
    var why = L.synth ? ("約 "+lg.freq+" 分一班・下列時刻為推算")
            : !L.list.length ? "時刻表待公布，請自行填入"
            : lg.freq ? ("約 "+lg.freq+" 分一班・表列為部分路線")
            : "可切換班次";
    pickHTML+='<div class="depbar'+(first?"":" more")+'"><span class="tlb">出發</span>'+
      timeField("dep",L.key,hm(L.dep),L.late?"bad":"")+
      (S.pick[L.key]?'<button class="clr" data-cleardep="'+L.key+'">還原</button>':'')+
      '<span class="why">'+esc(lg.line)+'　'+esc(lg.a)+' 發・'+why+'</span></div>';
    first=false;
    if(L.list.length){
      var chosen=toHM(L.dep), at=L.list.indexOf(chosen);
      if(at<0){ at=0; for(var q=0;q<L.list.length;q++){ if(toMin(L.list[q])>=L.dep){ at=q; break; } } }
      var a=Math.max(0,at-6), b=Math.min(L.list.length,at+9);
      pickHTML+='<div class="times'+(L.synth?" synth":"")+'" data-focus="'+L.key+'">'+L.list.slice(a,b).map(function(t){
        return '<button class="tb'+(toMin(t)<L.ready?" past":"")+(t===chosen?" now":"")+
          '" aria-pressed="'+(t===chosen)+'" data-pick="'+L.key+'" data-t="'+t+'">'+t+'</button>';
      }).join("")+'</div>';
    }
  });
  var altHTML = (it.alts && it.alts.length>1) ?
    '<div class="alts">'+it.alts.map(function(A,i){
      return '<button class="altb" aria-pressed="'+((it.altI||0)===i)+'" data-alt="'+it.id+':'+i+'">'+
        '<b>'+esc(A.n)+'</b><span>'+esc(A.d||"")+'</span></button>';
    }).join("")+'</div>' : '';
  var chkHTML = it.chk ? '<div class="conf warn2">上下兩站變動過了，這段的路線與班次請重新確認。'+
    '<button class="cx" data-okchk="'+it.id+'" aria-label="關掉提醒">✕</button>'+
    '<br><button class="cb" data-restr="'+it.id+'">↺ 帶入查好的交通</button></div>' : '';
  var conf = lateL ? '<div class="conf">趕不上這班：'+esc(it.legs[lateL.i].line)+' '+toHM(lateL.dep)+' 開，但 '+toHM(lateL.ready)+' 才到得了 '+esc(it.legs[lateL.i].a)+'，差 '+dur(lateL.ready-lateL.dep)+'。'+
    '<br><button class="cb" data-shift="'+it.id+'">一鍵套用下一班</button></div>' : '';

  var tts={}; it.legs.forEach(function(lg){ if(lg.k==="ride"&&lg.tt) tts[lg.tt]=1; });
  var ttHTML=Object.keys(tts).map(function(k){ return ttBox(TTS[k], toHM(c.dep)); }).join("");

  return '<div class="row" data-k="transit" data-ln="'+ln+'"><div class="gutter"></div><div class="col">'+
   '<div class="tr">'+
    '<div class="th"><b><span contenteditable="true" data-tr="'+it.id+':from">'+esc(it.from)+'</span> → '+
      '<span contenteditable="true" data-tr="'+it.id+':to">'+esc(it.to)+'</span></b></div>'+
    '<div class="main"><span>'+toHM(c.dep)+'</span><span class="ar">▶</span><span>'+toHM(c.arr)+'</span>'+
      '<span class="tot">全程 '+dur(c.total)+(it.fare?'　<b class="fare">'+money(it.fare,it.cur)+'／人</b>':'')+'</span></div>'+
    chkHTML+altHTML+
    '<ul class="legs">'+legHTML+'</ul>'+
    pickHTML+conf+
    (String(it.note||"").trim()?'<div class="tnote" contenteditable="true" data-tnote="'+it.id+'">'+esc(it.note)+'</div>':'')+
    (ttHTML?'<details class="disc"><summary>完整時刻表與出處</summary>'+ttHTML+'</details>':'')+
    '<div class="acts">'+
      (hasRide
        ? '<a class="mini" target="_blank" rel="noopener" href="'+mapDir(it.from,it.to)+'">'+ico("route")+'Google Maps 路線</a>'+
          '<button class="mini" data-addleg="'+it.id+'">＋ 加一段</button>'
        : '<a class="mini" target="_blank" rel="noopener" href="'+mapDir(it.from,it.to)+'&travelmode=walking">'+ico("walk")+'Google Maps 路線</a>')+
      '<button class="mini rst" data-restr="'+it.id+'" title="重新帶入查好的交通">↺ 還原</button>'+
    '</div>'+
   '</div></div></div>';
}
